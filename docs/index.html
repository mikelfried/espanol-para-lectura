"es":"¿Me da un vaso de agua?","en":"Could I have a glass of water?"}]},{"es":"la copa","pos":"n.f.","en":"wine glass; drink (alcoholic); cup, trophy","he":"כוס יין / גביע","note":"Stemmed. tomar una copa is to go for a drink.","ex":[{"tag":"wine glass","es":"Sirvió el vino en copas altas.","en":"He served the wine in tall glasses."},{"tag":"a drink","es":"¿Vamos por una copa?","en":"Shall we go for a drink?"},{"tag":"trophy","es":"Ganaron la copa en 2010.","en":"They won the cup in 2010."}]},{"es":"la taza","pos":"n.f.","en":"cup, mug","note":"For coffee or tea. English cup covers both taza and copa; Spanish keeps them apart.","ex":[{"es":"Una taza de café, por favor.","en":"A cup of coffee, please."}]},{"es":"el tenedor","pos":"n.m.","en":"fork","ex":[{"es":"Se me cayó el tenedor.","en":"I dropped my fork."}]},{"es":"el cuchillo","pos":"n.m.","en":"knife","ex":[{"es":"Este cuchillo no corta nada.","en":"This knife doesn't cut at all."}]},{"es":"la cuchara","pos":"n.f.","en":"spoon","note":"A teaspoon is una cucharita; a spoonful is una cucharada.","ex":[{"es":"Necesito una cuchara para la sopa.","en":"I need a spoon for the soup."}]},{"es":"la servilleta","pos":"n.f.","en":"napkin, serviette","ex":[{"es":"¿Nos trae más servilletas?","en":"Could you bring us more napkins?"}]},{"es":"la botella","pos":"n.f.","en":"bottle","ex":[{"es":"Pedimos una botella de vino tinto.","en":"We ordered a bottle of red wine."}]},{"es":"la carta","pos":"n.f.","en":"menu; letter; playing card","he":"תפריט / מכתב / קלף","warn":"Three unrelated meanings in one word, and none of them is cart. El menú usually means the fixed meal of the day, not the list of dishes — ask for la carta.","ex":[{"tag":"menu","es":"¿Nos trae la carta, por favor?","en":"Could you bring us the menu, please?"},{"tag":"letter","es":"Le escribí una carta a mi abuela.","en":"I wrote my grandmother a letter."},{"tag":"card","es":"Jugamos a las cartas toda la noche.","en":"We played cards all night."}]},{"es":"el mesero / la mesera","pos":"n.","en":"waiter / waitress","note":"mesero in Mexico and much of Latin America; mozo in Argentina; camarero in Spain.","ex":[{"es":"El mesero nos atendió muy bien.","en":"The waiter looked after us very well."}]},{"es":"la propina","pos":"n.f.","en":"tip, gratuity","note":"Ten per cent is usual in much of Latin America; check whether la propina is already on the bill.","ex":[{"es":"¿Dejamos propina?","en":"Shall we leave a tip?"}]},{"es":"la bebida","pos":"n.f.","en":"drink, beverage","ex":[{"es":"Las bebidas no están incluidas.","en":"Drinks are not included."}]},{"es":"el postre","pos":"n.m.","en":"dessert, pudding","note":"de postre means for dessert.","ex":[{"es":"De postre pedí flan.","en":"For dessert I ordered flan."}]},{"es":"probar","pos":"v. irr.","en":"to taste, to try; to try on; to prove","he":"לטעום / למדוד / להוכיח","conj":{"label":"pres.","forms":["pruebo","pruebas","prueba","probamos","prueban"]},"ex":[{"tag":"taste","es":"Prueba la sopa, está buenísima.","en":"Taste the soup, it's really good."},{"tag":"try on","es":"Quiero probarme esta camisa.","en":"I want to try this shirt on."},{"tag":"prove","es":"Nadie pudo probar nada.","en":"Nobody could prove anything."}]},{"es":"beber","pos":"v.","en":"to drink","note":"Correct everywhere, but Latin America reaches for tomar in everyday speech. beber leans towards drinking alcohol.","ex":[{"es":"Esa noche bebimos demasiado.","en":"That night we drank too much."}]},{"es":"cocinar","pos":"v.","en":"to cook","note":"la cocina is both the kitchen and the cuisine; el cocinero is the cook.","ex":[{"es":"Cocina mejor que cualquier restaurante.","en":"He cooks better than any restaurant."}]},{"es":"caliente","pos":"adj.","en":"hot, warm (temperature)","he":"חם","note":"Temperature only. For weather Spanish uses hacer calor, not estar caliente.","ex":[{"es":"Ten cuidado, el plato está caliente.","en":"Be careful, the plate is hot."}]},{"es":"picante","pos":"adj.","en":"spicy, hot (chilli)","he":"חריף","warn":"English hot means both temperature and spice; Spanish does not. Asking for something caliente when you mean picante will get you warm food, and asking whether the soup is caliente is not asking whether it will burn your mouth.","ex":[{"es":"¿La salsa es muy picante?","en":"Is the sauce very spicy?"}]},{"es":"frío","pos":"adj. / n.m.","en":"cold (adjective); the cold (noun)","note":"tener frío is to feel cold, hacer frío is for the weather, estar frío is for objects. Three different verbs.","ex":[{"tag":"adjective","es":"La sopa ya está fría.","en":"The soup has gone cold."},{"tag":"noun","es":"No aguanto el frío de aquí.","en":"I can't stand the cold here."}]}]},{"id":"u13","title":"Clothes and getting dressed","intro":"Spanish uses the singular where English often uses a plural: un pantalón is a pair of trousers. Clothes go on with ponerse and come off with quitarse, both reflexive.","entries":[{"es":"la ropa","pos":"n.f.","en":"clothes, clothing","he":"בגדים","note":"Singular and uncountable, so la ropa está sucia, never las ropas. Not rope — that is la cuerda.","ex":[{"es":"Guarda la ropa en el armario.","en":"Put the clothes away in the wardrobe."}]},{"es":"la camisa","pos":"n.f.","en":"shirt","note":"la camiseta is a T-shirt or vest.","ex":[{"es":"Lleva una camisa blanca.","en":"He's wearing a white shirt."}]},{"es":"el pantalón","pos":"n.m.","en":"trousers, pants","note":"Singular in Spanish. los pantalones is also heard and means the same thing.","ex":[{"es":"Ese pantalón te queda grande.","en":"Those trousers are too big for you."}]},{"es":"el vestido","pos":"n.m.","en":"dress","ex":[{"es":"Se compró un vestido para la boda.","en":"She bought a dress for the wedding."}]},{"es":"la falda","pos":"n.f.","en":"skirt","ex":[{"es":"La falda es demasiado corta para la oficina.","en":"The skirt is too short for the office."}]},{"es":"el abrigo","pos":"n.m.","en":"coat, overcoat","note":"la chaqueta is a jacket; el saco a suit jacket in Latin America.","ex":[{"es":"Ponte el abrigo, hace frío.","en":"Put your coat on, it's cold."}]},{"es":"el suéter","pos":"n.m.","en":"sweater, jumper","note":"Also el jersey in Spain, el pulóver in the Southern Cone.","ex":[{"es":"Tejió el suéter ella misma.","en":"She knitted the sweater herself."}]},{"es":"los zapatos","pos":"n.m.pl.","en":"shoes","note":"las zapatillas or los tenis are trainers; una zapatería is a shoe shop.","ex":[{"es":"Estos zapatos me aprietan.","en":"These shoes are tight on me."}]},{"es":"los calcetines","pos":"n.m.pl.","en":"socks","note":"las medias in much of Latin America, where it also covers tights.","ex":[{"es":"No encuentro un calcetín.","en":"I can't find one of the socks."}]},{"es":"el sombrero","pos":"n.m.","en":"hat","note":"la gorra is a cap with a peak.","ex":[{"es":"Usa sombrero para el sol.","en":"He wears a hat because of the sun."}]},{"es":"el bolsillo","pos":"n.m.","en":"pocket","ex":[{"es":"Lo llevaba en el bolsillo.","en":"I was carrying it in my pocket."}]},{"es":"el botón","pos":"n.m.","en":"button","note":"One word for the button on a shirt and the one on a machine.","ex":[{"es":"Se le cayó un botón.","en":"One of his buttons came off."}]},{"es":"el reloj","pos":"n.m.","en":"watch; clock","he":"שעון","note":"The j is silent at the end in most speech: re-LÓ.","ex":[{"tag":"watch","es":"Me regalaron un reloj.","en":"They gave me a watch."},{"tag":"clock","es":"El reloj de la plaza va atrasado.","en":"The clock in the square is slow."}]},{"es":"ponerse","pos":"v. irr.","en":"to put on (clothes)","note":"Reflexive, with the article rather than a possessive: se puso los zapatos.","ex":[{"es":"Ponte algo más formal.","en":"Put on something more formal."}]},{"es":"quitarse","pos":"v.","en":"to take off (clothes)","note":"In Latin America sacarse is just as common.","ex":[{"es":"Quítate el abrigo, aquí hace calor.","en":"Take your coat off, it's warm in here."}]},{"es":"vestirse","pos":"v. irr.","en":"to get dressed","conj":{"label":"pres.","forms":["me visto","te vistes","se viste","nos vestimos","se visten"]},"ex":[{"es":"Me visto en cinco minutos.","en":"I'll get dressed in five minutes."}]},{"es":"quedar","pos":"v.","en":"to fit, to suit (of clothes)","he":"להתאים (בגד)","note":"Built like gustar: the garment is the subject. Me queda bien is it fits me well.","ex":[{"es":"Ese color te queda muy bien.","en":"That colour really suits you."}]},{"es":"la talla","pos":"n.f.","en":"size (of clothing)","note":"For shoes Spanish says el número, not la talla.","ex":[{"es":"¿Tiene una talla más grande?","en":"Do you have a bigger size?"}]},{"es":"limpio","pos":"adj.","en":"clean","ex":[{"es":"La camisa ya está limpia.","en":"The shirt is clean now."}]},{"es":"sucio","pos":"adj.","en":"dirty","ex":[{"es":"No te sientes con las manos sucias.","en":"Don't sit down with dirty hands."}]}]},{"id":"u14","title":"Colours, size and shape","intro":"Read plate 7 alongside this unit. Colours are adjectives, so they follow the noun and agree with it: una casa blanca. The ones ending in -e or a consonant do not change for gender — verde, azul, gris.","entries":[{"es":"el color","pos":"n.m.","en":"colour","note":"Masculine despite the -or ending being unusual. ¿De qué color es? is how you ask.","ex":[{"es":"¿De qué color es tu carro?","en":"What colour is your car?"}]},{"es":"blanco","pos":"adj.","en":"white","note":"en blanco means blank: dejé la hoja en blanco.","ex":[{"es":"Las paredes son blancas.","en":"The walls are white."}]},{"es":"negro","pos":"adj.","en":"black","ex":[{"es":"Tomo el café negro.","en":"I drink my coffee black."}]},{"es":"rojo","pos":"adj.","en":"red","note":"Red wine is vino tinto, never vino rojo. Red hair is pelirrojo.","ex":[{"es":"Se puso roja de vergüenza.","en":"She went red with embarrassment."}]},{"es":"azul","pos":"adj.","en":"blue","note":"Same form for masculine and feminine: un carro azul, una puerta azul.","ex":[{"es":"El cielo está muy azul hoy.","en":"The sky is very blue today."}]},{"es":"verde","pos":"adj.","en":"green; unripe","he":"ירוק / לא בשל","ex":[{"tag":"green","es":"Pintamos la cocina de verde.","en":"We painted the kitchen green."},{"tag":"unripe","es":"Los plátanos están verdes todavía.","en":"The bananas are still unripe."}]},{"es":"amarillo","pos":"adj.","en":"yellow","ex":[{"es":"Los taxis son amarillos.","en":"The taxis are yellow."}]},{"es":"gris","pos":"adj.","en":"grey","note":"Plural grises. Also used of weather and mood, as in English.","ex":[{"es":"Fue un día gris y lluvioso.","en":"It was a grey, rainy day."}]},{"es":"café · marrón","pos":"adj.","en":"brown","note":"café in Mexico and much of Latin America, marrón in Spain and the Southern Cone. café never changes form.","ex":[{"es":"Tiene los ojos café.","en":"She has brown eyes."}]},{"es":"rosado · rosa","pos":"adj.","en":"pink","ex":[{"es":"Escogió unas flores rosadas.","en":"She chose some pink flowers."}]},{"es":"morado","pos":"adj.","en":"purple","note":"Also violeta and púrpura, but morado is the everyday word.","ex":[{"es":"Se le puso el brazo morado.","en":"His arm turned purple."}]},{"es":"naranja","pos":"adj. / n.f.","en":"orange (colour); orange (fruit)","he":"כתום / תפוז","note":"As a colour it does not change: unos zapatos naranja. Also anaranjado.","ex":[{"tag":"colour","es":"El atardecer era naranja.","en":"The sunset was orange."},{"tag":"fruit","es":"Me comí dos naranjas.","en":"I ate two oranges."}]},{"es":"claro · oscuro","pos":"adj.","en":"light, pale; dark","note":"Placed after the colour: azul claro, verde oscuro. Neither agrees in that position.","ex":[{"tag":"light","es":"Prefiero el azul claro.","en":"I prefer the light blue."},{"tag":"dark","es":"El cuarto es muy oscuro.","en":"The room is very dark."}]},{"es":"grande","pos":"adj.","en":"big, large; great","he":"גדול","note":"Shortens to gran before any singular noun, where it means great rather than large: un gran hombre.","ex":[{"tag":"big","es":"Viven en una casa grande.","en":"They live in a big house."},{"tag":"great","es":"Fue un gran día.","en":"It was a great day."}]},{"es":"pequeño","pos":"adj.","en":"small, little","note":"chico is the everyday alternative in Latin America.","ex":[{"es":"El cuarto es pequeño pero cómodo.","en":"The room is small but comfortable."}]},{"es":"largo","pos":"adj.","en":"long","warn":"A false friend. Large is grande. Un viaje largo is a long journey, not a big one.","ex":[{"es":"Fue una reunión muy larga.","en":"It was a very long meeting."}]},{"es":"corto","pos":"adj.","en":"short (in length)","note":"For a short person use bajo, not corto.","ex":[{"es":"El camino corto pasa por el río.","en":"The short route goes past the river."}]},{"es":"alto · bajo","pos":"adj.","en":"tall, high; short, low","he":"גבוה / נמוך","ex":[{"tag":"tall","es":"Su hijo es muy alto.","en":"Her son is very tall."},{"tag":"low","es":"Habla en voz baja.","en":"Speak quietly."}]},{"es":"ancho · estrecho","pos":"adj.","en":"wide, broad; narrow","ex":[{"tag":"wide","es":"La avenida es muy ancha.","en":"The avenue is very wide."},{"tag":"narrow","es":"La calle es estrecha para dos carros.","en":"The street is narrow for two cars."}]},{"es":"redondo · cuadrado","pos":"adj.","en":"round; square","note":"The nouns are el círculo and el cuadrado.","ex":[{"tag":"round","es":"Buscamos una mesa redonda.","en":"We're looking for a round table."},{"tag":"square","es":"La plaza es perfectamente cuadrada.","en":"The square is perfectly square."}]}]},{"id":"u15","title":"Weather and seasons","intro":"Weather is built with three different verbs and you have to pick the right one. hacer for most conditions (hace frío), estar for the sky's state (está nublado), and haber for what is present (hay niebla).","entries":[{"es":"el clima","pos":"n.m.","en":"climate, weather","note":"el tiempo also means weather — see unit 4. el clima is commoner in Latin America.","ex":[{"es":"El clima aquí es seco todo el año.","en":"The climate here is dry all year."}]},{"es":"el sol","pos":"n.m.","en":"sun, sunshine","note":"hace sol is it's sunny. tomar el sol is to sunbathe.","ex":[{"es":"Hoy hace mucho sol.","en":"It's very sunny today."}]},{"es":"la lluvia","pos":"n.f.","en":"rain","note":"The verb is llover, and it only ever takes the él form: llueve.","ex":[{"es":"La lluvia no paró en tres días.","en":"The rain didn't stop for three days."}]},{"es":"llover","pos":"v. irr.","en":"to rain","note":"Impersonal: no subject, one form. llueve, llovía, llovió.","ex":[{"es":"Parece que va a llover.","en":"It looks like it's going to rain."}]},{"es":"la nieve","pos":"n.f.","en":"snow","note":"The verb is nevar: nieva.","ex":[{"es":"La nieve cubrió el camino.","en":"The snow covered the road."}]},{"es":"el viento","pos":"n.m.","en":"wind","note":"hace viento is it's windy.","ex":[{"es":"El viento se llevó el sombrero.","en":"The wind took his hat."}]},{"es":"la nube","pos":"n.f.","en":"cloud","note":"nublado means cloudy: está nublado.","ex":[{"es":"No hay ni una nube en el cielo.","en":"There isn't a single cloud in the sky."}]},{"es":"el cielo","pos":"n.m.","en":"sky; heaven","he":"שמיים","ex":[{"tag":"sky","es":"El cielo se puso gris.","en":"The sky turned grey."},{"tag":"heaven","es":"Creen que su abuela está en el cielo.","en":"They believe their grandmother is in heaven."}]},{"es":"la tormenta","pos":"n.f.","en":"storm","note":"el trueno is thunder; el relámpago lightning.","ex":[{"es":"Se acerca una tormenta.","en":"A storm is coming."}]},{"es":"el calor","pos":"n.m.","en":"heat","note":"hace calor for the weather, tengo calor for yourself. Never estoy caliente, which means something else.","ex":[{"es":"No aguanto este calor.","en":"I can't stand this heat."}]},{"es":"el frío","pos":"n.m.","en":"the cold","note":"Same three-verb pattern: hace frío, tengo frío, está frío.","ex":[{"es":"En enero hace mucho frío.","en":"It's very cold in January."}]},{"es":"húmedo · seco","pos":"adj.","en":"damp, humid; dry","ex":[{"tag":"humid","es":"El aire está muy húmedo en la costa.","en":"The air is very humid on the coast."},{"tag":"dry","es":"La tierra está seca desde mayo.","en":"The soil has been dry since May."}]},{"es":"la primavera","pos":"n.f.","en":"spring","note":"Seasons take the article: en la primavera. Not capitalised.","ex":[{"es":"En primavera florece todo.","en":"Everything blooms in spring."}]},{"es":"el verano","pos":"n.m.","en":"summer","ex":[{"es":"Pasamos el verano en la playa.","en":"We spent the summer at the beach."}]},{"es":"el otoño","pos":"n.m.","en":"autumn, fall","ex":[{"es":"El otoño es mi estación favorita.","en":"Autumn is my favourite season."}]},{"es":"el invierno","pos":"n.m.","en":"winter","ex":[{"es":"El invierno pasado nevó dos veces.","en":"Last winter it snowed twice."}]},{"es":"el grado","pos":"n.m.","en":"degree","note":"Temperatures are in Celsius: estamos a treinta grados.","ex":[{"es":"Hay veinte grados afuera.","en":"It's twenty degrees outside."}]},{"es":"el paraguas","pos":"n.m.","en":"umbrella","note":"Already plural in form and never changes: un paraguas, dos paraguas.","ex":[{"es":"Lleva paraguas, va a llover.","en":"Take an umbrella, it's going to rain."}]},{"es":"la sombra","pos":"n.f.","en":"shade; shadow","he":"צל","ex":[{"tag":"shade","es":"Vamos a sentarnos en la sombra.","en":"Let's sit in the shade."},{"tag":"shadow","es":"Su sombra era larguísima.","en":"His shadow was very long."}]},{"es":"mojado","pos":"adj.","en":"wet","note":"mojarse is to get wet; secarse to dry off.","ex":[{"es":"Llegué completamente mojado.","en":"I arrived completely soaked."}]}]},{"id":"u16","title":"Days, months and dates","intro":"Days and months are never capitalised in Spanish. Dates run day-month-year and take de: el 5 de mayo de 2024. For the first of the month, primero rather than uno.","entries":[{"es":"el lunes","pos":"n.m.","en":"Monday","note":"Every day ends in -s and does not change in the plural: el lunes, los lunes. los lunes means on Mondays.","ex":[{"es":"Los lunes trabajo desde casa.","en":"On Mondays I work from home."}]},{"es":"el martes · el miércoles","pos":"n.m.","en":"Tuesday, Wednesday","note":"miércoles carries an accent. martes trece is the unlucky day, not Friday the thirteenth.","ex":[{"es":"El miércoles tengo cita con el dentista.","en":"On Wednesday I have a dentist's appointment."}]},{"es":"el jueves · el viernes","pos":"n.m.","en":"Thursday, Friday","ex":[{"es":"Salimos el viernes en la noche.","en":"We go out on Friday evening."}]},{"es":"el sábado · el domingo","pos":"n.m.","en":"Saturday, Sunday","note":"The only two that take a plural -s: los sábados, los domingos.","ex":[{"es":"El sábado fuimos al mercado.","en":"On Saturday we went to the market."}]},{"es":"el fin de semana","pos":"n.m.","en":"weekend","note":"Plural is los fines de semana — the first word changes, not the last.","ex":[{"es":"¿Qué vas a hacer el fin de semana?","en":"What are you doing at the weekend?"}]},{"es":"enero · febrero · marzo","pos":"n.m.","en":"January, February, March","note":"Lower case, and normally with no article: en enero.","ex":[{"es":"Nació en marzo de 1990.","en":"He was born in March 1990."}]},{"es":"abril · mayo · junio","pos":"n.m.","en":"April, May, June","ex":[{"es":"Las clases terminan en junio.","en":"Classes end in June."}]},{"es":"julio · agosto · septiembre","pos":"n.m.","en":"July, August, September","ex":[{"es":"En agosto cierra media ciudad.","en":"Half the city closes in August."}]},{"es":"octubre · noviembre · diciembre","pos":"n.m.","en":"October, November, December","ex":[{"es":"Nos vemos en diciembre.","en":"See you in December."}]},{"es":"la fecha","pos":"n.f.","en":"date (calendar)","he":"תאריך","note":"Not a date with someone — that is una cita.","ex":[{"es":"¿Cuál es la fecha de hoy?","en":"What's today's date?"}]},{"es":"el calendario","pos":"n.m.","en":"calendar","ex":[{"es":"Apúntalo en el calendario.","en":"Write it in the calendar."}]},{"es":"el siglo","pos":"n.m.","en":"century","note":"Written with Roman numerals: el siglo XXI, read as el siglo veintiuno.","ex":[{"es":"La catedral es del siglo XVI.","en":"The cathedral is from the sixteenth century."}]},{"es":"la época","pos":"n.f.","en":"time, period, era; season (of year)","he":"תקופה","ex":[{"tag":"era","es":"En esa época no había teléfonos.","en":"In that era there were no telephones."},{"tag":"season","es":"Es la época de lluvias.","en":"It's the rainy season."}]},{"es":"próximo","pos":"adj.","en":"next; nearby","he":"הבא / קרוב","note":"la próxima semana is next week; la semana que viene means the same and is commoner in speech.","ex":[{"tag":"next","es":"El próximo martes hay examen.","en":"Next Tuesday there's an exam."},{"tag":"nearby","es":"La estación más próxima está a un kilómetro.","en":"The nearest station is a kilometre away."}]},{"es":"pasado","pos":"adj. / n.m.","en":"last, past; the past","ex":[{"tag":"last","es":"El mes pasado llovió mucho.","en":"Last month it rained a lot."},{"tag":"the past","es":"No quiere hablar del pasado.","en":"He doesn't want to talk about the past."}]},{"es":"el futuro","pos":"n.m.","en":"the future","note":"en el futuro for in future; de aquí en adelante for from now on.","ex":[{"es":"En el futuro todo será distinto.","en":"In the future everything will be different."}]},{"es":"antes · después","pos":"adv.","en":"before; after, afterwards","note":"Both take de before a noun or infinitive: antes de comer, después de la clase.","ex":[{"tag":"before","es":"Llámame antes de salir.","en":"Call me before you leave."},{"tag":"after","es":"Después hablamos.","en":"We'll talk afterwards."}]},{"es":"durante","pos":"prep.","en":"during, for (a length of time)","ex":[{"es":"Estudió allí durante cuatro años.","en":"He studied there for four years."}]},{"es":"desde · hasta","pos":"prep.","en":"from, since; until, as far as","he":"מ- / עד","ex":[{"tag":"since","es":"Trabajo aquí desde marzo.","en":"I've worked here since March."},{"tag":"until","es":"Esperamos hasta las nueve.","en":"We waited until nine."}]},{"es":"el rato","pos":"n.m.","en":"a while, a short time","he":"זמן קצר","note":"un rato is a bit; al rato means in a little while in Mexico.","ex":[{"es":"Descansemos un rato.","en":"Let's rest for a while."}]}]},{"id":"u17","title":"Work and jobs","intro":"Professions drop the article after ser: es maestra, not es una maestra. Adding the article turns it into an emphatic judgement — ¡es un artista! meaning he's a real artist.","entries":[{"es":"el trabajo","pos":"n.m.","en":"work, job; piece of work","he":"עבודה","ex":[{"tag":"job","es":"Encontró trabajo en un banco.","en":"She found a job at a bank."},{"tag":"piece of work","es":"Entregué el trabajo tarde.","en":"I handed the assignment in late."}]},{"es":"la empresa","pos":"n.f.","en":"company, firm","note":"la compañía is a synonym; el negocio is a business or a deal.","ex":[{"es":"La empresa tiene cien empleados.","en":"The company has a hundred employees."}]},{"es":"la oficina","pos":"n.f.","en":"office","ex":[{"es":"La oficina cierra a las seis.","en":"The office closes at six."}]},{"es":"el empleo","pos":"n.m.","en":"employment, job","note":"el empleado is the employee; el desempleo unemployment.","ex":[{"es":"Busca empleo desde enero.","en":"He's been looking for work since January."}]},{"es":"el sueldo","pos":"n.m.","en":"salary, wage","note":"el salario is the formal word; la paga what you actually get.","ex":[{"es":"Le subieron el sueldo.","en":"They raised his salary."}]},{"es":"la reunión","pos":"n.f.","en":"meeting, gathering","note":"Plural reuniones loses the accent.","ex":[{"es":"La reunión se canceló.","en":"The meeting was cancelled."}]},{"es":"el maestro / la maestra","pos":"n.","en":"teacher (school); master","he":"מורה","note":"el profesor teaches at secondary or university level.","ex":[{"tag":"teacher","es":"Mi hermana es maestra.","en":"My sister is a teacher."},{"tag":"master","es":"Es un maestro de la guitarra.","en":"He is a master of the guitar."}]},{"es":"el abogado / la abogada","pos":"n.","en":"lawyer","ex":[{"es":"Consultamos a una abogada.","en":"We consulted a lawyer."}]},{"es":"el ingeniero / la ingeniera","pos":"n.","en":"engineer","ex":[{"es":"Trabaja como ingeniero de software.","en":"He works as a software engineer."}]},{"es":"el obrero / la obrera","pos":"n.","en":"manual worker, labourer","note":"el trabajador is any worker; el obrero specifically manual.","ex":[{"es":"Los obreros empiezan a las seis.","en":"The workers start at six."}]},{"es":"el agricultor / el campesino","pos":"n.m.","en":"farmer, farm worker","note":"el campesino carries a rural, often poorer connotation; el granjero is a farm owner.","ex":[{"es":"Los campesinos venden en el mercado.","en":"The farmers sell at the market."}]},{"es":"el policía / la policía","pos":"n.","en":"police officer; the police (force)","he":"שוטר / משטרה","note":"el policía is one officer, la policía is the force. Gender does the work.","ex":[{"tag":"officer","es":"Un policía nos ayudó.","en":"A police officer helped us."},{"tag":"the force","es":"Llamamos a la policía.","en":"We called the police."}]},{"es":"el cliente / la clienta","pos":"n.","en":"customer, client","ex":[{"es":"El cliente siempre tiene razón.","en":"The customer is always right."}]},{"es":"la entrevista","pos":"n.f.","en":"interview","note":"entrevistar is to interview.","ex":[{"es":"Tengo una entrevista el jueves.","en":"I have an interview on Thursday."}]},{"es":"el horario","pos":"n.m.","en":"timetable, schedule; opening hours","ex":[{"tag":"schedule","es":"Mi horario cambia cada semana.","en":"My schedule changes every week."},{"tag":"hours","es":"¿Cuál es el horario de la tienda?","en":"What are the shop's opening hours?"}]},{"es":"ganar","pos":"v.","en":"to earn; to win","he":"להרוויח / לנצח","ex":[{"tag":"earn","es":"Gana bien en ese puesto.","en":"She earns well in that position."},{"tag":"win","es":"Ganamos el partido.","en":"We won the match."}]},{"es":"contratar","pos":"v.","en":"to hire, to take on","note":"despedir is to dismiss; renunciar to resign.","ex":[{"es":"Van a contratar a dos personas más.","en":"They're going to hire two more people."}]},{"es":"el jefe / la jefa","pos":"n.","en":"boss, head","note":"el gerente is a manager; el dueño the owner.","ex":[{"es":"Mi jefa aprobó las vacaciones.","en":"My boss approved the holiday."}]},{"es":"ocupado","pos":"adj.","en":"busy; occupied, taken","he":"עסוק / תפוס","ex":[{"tag":"busy","es":"Estoy ocupado toda la mañana.","en":"I'm busy all morning."},{"tag":"taken","es":"Ese asiento está ocupado.","en":"That seat is taken."}]},{"es":"la carrera","pos":"n.f.","en":"career; university degree; race","he":"קריירה / תואר / מרוץ","note":"Asking ¿qué carrera estudias? asks what you are studying, not about your career.","ex":[{"tag":"career","es":"Dejó su carrera para viajar.","en":"She left her career to travel."},{"tag":"degree","es":"Estudia la carrera de derecho.","en":"He is studying law."},{"tag":"race","es":"Corrió la carrera en tres horas.","en":"He ran the race in three hours."}]}]},{"id":"u18","title":"Money and shopping","intro":"Prices use costar and valer, both irregular. The currency changes by country — el peso in Mexico, Argentina, Colombia and Chile, el sol in Peru, el euro in Spain — but the words for buying and paying do not.","entries":[{"es":"el dinero","pos":"n.m.","en":"money","he":"כסף","note":"Uncountable: no dineros. la plata is everyday slang for money across much of Latin America.","ex":[{"es":"No traigo dinero en efectivo.","en":"I haven't got any cash on me."}]},{"es":"el precio","pos":"n.m.","en":"price","ex":[{"es":"Los precios subieron otra vez.","en":"Prices went up again."}]},{"es":"costar","pos":"v. irr.","en":"to cost; to be hard, to take effort","he":"לעלות (מחיר) / להיות קשה","conj":{"label":"pres.","forms":["cuesto","cuestas","cuesta","costamos","cuestan"]},"ex":[{"tag":"cost","es":"¿Cuánto cuesta el boleto?","en":"How much does the ticket cost?"},{"tag":"be hard","es":"Me cuesta levantarme temprano.","en":"I find it hard to get up early."}]},{"es":"comprar","pos":"v.","en":"to buy","note":"ir de compras is to go shopping; las compras the shopping.","ex":[{"es":"Compré pan y leche.","en":"I bought bread and milk."}]},{"es":"vender","pos":"v.","en":"to sell","note":"se vende on a sign means for sale.","ex":[{"es":"Venden fruta en la esquina.","en":"They sell fruit on the corner."}]},{"es":"pagar","pos":"v.","en":"to pay, to pay for","note":"Takes no preposition for the thing: pagar la cuenta. Use por only for an amount: pagué mil por el boleto.","ex":[{"es":"¿Puedo pagar con tarjeta?","en":"Can I pay by card?"}]},{"es":"gastar","pos":"v.","en":"to spend (money); to wear out","he":"להוציא כסף / לשחוק","note":"For spending time use pasar, not gastar.","ex":[{"tag":"spend","es":"Gastamos demasiado en el viaje.","en":"We spent too much on the trip."},{"tag":"wear out","es":"Gastó los zapatos en un mes.","en":"He wore the shoes out in a month."}]},{"es":"barato · caro","pos":"adj.","en":"cheap; expensive","ex":[{"tag":"cheap","es":"Es más barato en el mercado.","en":"It's cheaper at the market."},{"tag":"expensive","es":"Ese hotel es carísimo.","en":"That hotel is extremely expensive."}]},{"es":"la tarjeta","pos":"n.f.","en":"card (bank, greetings)","note":"tarjeta de crédito, tarjeta de débito. A playing card is una carta.","ex":[{"es":"Se me perdió la tarjeta.","en":"I lost my card."}]},{"es":"el efectivo","pos":"n.m.","en":"cash","note":"en efectivo is in cash. el cambio is change, both the coins and the act.","ex":[{"es":"Sólo aceptan efectivo.","en":"They only take cash."}]},{"es":"el cambio","pos":"n.m.","en":"change (money); change (alteration); exchange rate","he":"עודף / שינוי / שער חליפין","ex":[{"tag":"money","es":"Quédese con el cambio.","en":"Keep the change."},{"tag":"alteration","es":"Hubo un cambio de planes.","en":"There was a change of plan."},{"tag":"rate","es":"El cambio está muy malo hoy.","en":"The exchange rate is very bad today."}]},{"es":"la cuenta","pos":"n.f.","en":"bill; bank account","note":"Also darse cuenta, to realise — a completely separate use of the same word.","ex":[{"tag":"bill","es":"Pedimos la cuenta.","en":"We asked for the bill."},{"tag":"account","es":"Transfirió el dinero a otra cuenta.","en":"He transferred the money to another account."}]},{"es":"el descuento","pos":"n.m.","en":"discount","note":"Sales are las rebajas in Spain, las ofertas or la barata in Latin America.","ex":[{"es":"Nos dieron un descuento del diez por ciento.","en":"They gave us a ten per cent discount."}]},{"es":"la bolsa","pos":"n.f.","en":"bag; stock exchange","he":"שקית / בורסה","ex":[{"tag":"bag","es":"¿Quiere una bolsa?","en":"Would you like a bag?"},{"tag":"exchange","es":"La bolsa cayó ayer.","en":"The stock market fell yesterday."}]},{"es":"el recibo","pos":"n.m.","en":"receipt","note":"la factura is an invoice, and the word you need to claim expenses.","ex":[{"es":"Guarda el recibo por si acaso.","en":"Keep the receipt just in case."}]},{"es":"el banco","pos":"n.m.","en":"bank","note":"See also unit 8, where the same word means bench.","ex":[{"es":"Tengo que ir al banco antes de que cierre.","en":"I have to go to the bank before it closes."}]},{"es":"prestar","pos":"v.","en":"to lend","he":"להשאיל","note":"pedir prestado is to borrow. Spanish has no single verb for borrowing.","ex":[{"es":"¿Me prestas tu carro?","en":"Will you lend me your car?"}]},{"es":"deber","pos":"v.","en":"to owe","note":"Same verb as must — see unit 1.","ex":[{"es":"Todavía le debo el dinero.","en":"I still owe him the money."}]},{"es":"rico · pobre","pos":"adj.","en":"rich; poor","note":"rico also means delicious of food — see unit 7.","ex":[{"tag":"rich","es":"Es de una familia rica.","en":"He's from a wealthy family."},{"tag":"poor","es":"Creció en un barrio pobre.","en":"He grew up in a poor neighbourhood."}]},{"es":"el mercado","pos":"n.m.","en":"market (place); market (economy)","ex":[{"tag":"place","es":"El mercado abre los domingos.","en":"The market is open on Sundays."},{"tag":"economy","es":"El mercado está en crisis.","en":"The market is in crisis."}]}]},{"id":"u19","title":"Inside the house: furniture and things","intro":"Read plate 1 alongside this unit, which names the rooms. These are the things inside them. Note that Spanish says la luz for both the light and the electricity.","entries":[{"es":"el mueble","pos":"n.m.","en":"piece of furniture","note":"los muebles is furniture collectively. English has no singular for it; Spanish does.","ex":[{"es":"Compramos los muebles de segunda mano.","en":"We bought the furniture second-hand."}]},{"es":"la cama","pos":"n.f.","en":"bed","note":"hacer la cama is to make the bed; irse a la cama to go to bed.","ex":[{"es":"La cama es demasiado blanda.","en":"The bed is too soft."}]},{"es":"la almohada","pos":"n.f.","en":"pillow","note":"la sábana is a sheet; la manta or la cobija a blanket.","ex":[{"es":"Necesito otra almohada.","en":"I need another pillow."}]},{"es":"el sillón","pos":"n.m.","en":"armchair","note":"el sofá is the sofa, and is masculine despite the -a.","ex":[{"es":"Se quedó dormido en el sillón.","en":"He fell asleep in the armchair."}]},{"es":"el armario","pos":"n.m.","en":"wardrobe, cupboard","note":"el clóset in much of Latin America; el ropero for clothes specifically.","ex":[{"es":"Cuelga la camisa en el armario.","en":"Hang the shirt in the wardrobe."}]},{"es":"el cajón","pos":"n.m.","en":"drawer","note":"Plural cajones. la caja is a box, and also the till in a shop.","ex":[{"es":"Las llaves están en el primer cajón.","en":"The keys are in the top drawer."}]},{"es":"el estante","pos":"n.m.","en":"shelf","note":"la estantería is the whole bookcase; el librero too in Mexico.","ex":[{"es":"Puse los libros en el estante de arriba.","en":"I put the books on the top shelf."}]},{"es":"la lámpara","pos":"n.f.","en":"lamp","ex":[{"es":"Enciende la lámpara, no veo nada.","en":"Turn the lamp on, I can't see a thing."}]},{"es":"la luz","pos":"n.f.","en":"light; electricity, power","he":"אור / חשמל","note":"Plural luces. Se fue la luz means the power went out.","ex":[{"tag":"light","es":"Apaga la luz al salir.","en":"Turn the light off when you leave."},{"tag":"power","es":"Se fue la luz en todo el barrio.","en":"The power went out in the whole neighbourhood."}]},{"es":"el espejo","pos":"n.m.","en":"mirror","ex":[{"es":"Se miró en el espejo.","en":"She looked at herself in the mirror."}]},{"es":"la alfombra","pos":"n.f.","en":"rug, carpet","ex":[{"es":"La alfombra está manchada.","en":"The rug is stained."}]},{"es":"la cortina","pos":"n.f.","en":"curtain","ex":[{"es":"Abre las cortinas, entra sol.","en":"Open the curtains, the sun's coming in."}]},{"es":"el piso","pos":"n.m.","en":"floor (surface); storey, floor (level)","he":"רצפה / קומה","note":"In Spain un piso is also a flat. el suelo is the ground or floor surface.","ex":[{"tag":"surface","es":"El piso está mojado.","en":"The floor is wet."},{"tag":"storey","es":"Vivimos en el tercer piso.","en":"We live on the third floor."}]},{"es":"la escalera","pos":"n.f.","en":"stairs, staircase; ladder","he":"מדרגות / סולם","note":"Often plural for stairs: las escaleras.","ex":[{"tag":"stairs","es":"Subimos por la escalera.","en":"We went up the stairs."},{"tag":"ladder","es":"Trae la escalera para el techo.","en":"Bring the ladder for the ceiling."}]},{"es":"la llave","pos":"n.f.","en":"key; tap, faucet","he":"מפתח / ברז","note":"In Spain the tap is el grifo; llave de agua in Latin America.","ex":[{"tag":"key","es":"Olvidé las llaves dentro.","en":"I left the keys inside."},{"tag":"tap","es":"Cierra bien la llave.","en":"Turn the tap off properly."}]},{"es":"el jabón","pos":"n.m.","en":"soap","note":"la toalla is a towel; el cepillo de dientes a toothbrush.","ex":[{"es":"Se acabó el jabón.","en":"We're out of soap."}]},{"es":"la basura","pos":"n.f.","en":"rubbish, garbage; bin","note":"sacar la basura is to take the rubbish out.","ex":[{"tag":"rubbish","es":"Tira eso a la basura.","en":"Throw that in the bin."},{"tag":"bin","es":"La basura está llena.","en":"The bin is full."}]},{"es":"limpiar","pos":"v.","en":"to clean","note":"hacer la limpieza is to do the cleaning; barrer to sweep.","ex":[{"es":"Limpio la cocina los domingos.","en":"I clean the kitchen on Sundays."}]},{"es":"lavar","pos":"v.","en":"to wash","note":"Reflexive lavarse for washing yourself: me lavo las manos.","ex":[{"es":"Hay que lavar los platos.","en":"The dishes need washing."}]},{"es":"cómodo","pos":"adj.","en":"comfortable; convenient","he":"נוח","ex":[{"tag":"comfortable","es":"Este sillón es muy cómodo.","en":"This armchair is very comfortable."},{"tag":"convenient","es":"Es más cómodo pagar en línea.","en":"It's more convenient to pay online."}]}]},{"id":"u20","title":"Feelings and states","intro":"Nearly everything here takes estar, not ser, because a feeling is a state and not an identity. The exception is ser + adjective for a lasting trait: es nervioso means he is a nervous sort, está nervioso means he is nervous right now.","entries":[{"es":"feliz","pos":"adj.","en":"happy","note":"Plural felices. Used of a settled happiness; contento is the everyday word for pleased.","ex":[{"es":"Nunca la había visto tan feliz.","en":"I'd never seen her so happy."}]},{"es":"contento","pos":"adj.","en":"pleased, glad, content","note":"Always with estar. The commonest reply to ¿cómo estás?","ex":[{"es":"Estoy contento con el resultado.","en":"I'm pleased with the result."}]},{"es":"triste","pos":"adj.","en":"sad","note":"la tristeza is sadness.","ex":[{"es":"Se puso triste al leer la carta.","en":"He grew sad reading the letter."}]},{"es":"enojado","pos":"adj.","en":"angry, cross","note":"enojado in Latin America, enfadado in Spain. enojarse is to get angry.","ex":[{"es":"Está enojada conmigo.","en":"She's angry with me."}]},{"es":"el miedo","pos":"n.m.","en":"fear","he":"פחד","note":"You have fear rather than being afraid: tengo miedo. dar miedo is to frighten.","ex":[{"es":"Le da miedo volar.","en":"Flying frightens him."}]},{"es":"nervioso","pos":"adj.","en":"nervous, anxious","ex":[{"es":"Me pongo nervioso antes de hablar.","en":"I get nervous before speaking."}]},{"es":"tranquilo","pos":"adj.","en":"calm, quiet; don't worry","he":"רגוע / שקט","note":"¡Tranquilo! on its own means take it easy.","ex":[{"tag":"calm","es":"Es un barrio muy tranquilo.","en":"It's a very quiet neighbourhood."},{"tag":"reassurance","es":"Tranquila, ya lo arreglé.","en":"Don't worry, I've already fixed it."}]},{"es":"preocupado","pos":"adj.","en":"worried","note":"preocuparse por is to worry about.","ex":[{"es":"Están preocupados por su hijo.","en":"They're worried about their son."}]},{"es":"el amor","pos":"n.m.","en":"love","note":"enamorarse de is to fall in love with.","ex":[{"es":"Se casaron por amor.","en":"They married for love."}]},{"es":"odiar","pos":"v.","en":"to hate","note":"el odio is hatred. Strong — for milder dislike use no me gusta nada.","ex":[{"es":"Odio levantarme temprano.","en":"I hate getting up early."}]},{"es":"gustar","pos":"v.","en":"to be pleasing, to like","he":"למצוא חן / לאהוב","note":"Built backwards: the thing liked is the subject. Me gusta el café is literally coffee pleases me. Plural things take gustan.","conj":{"label":"pres.","forms":["me gusta","te gusta","le gusta","nos gusta","les gusta"]},"ex":[{"es":"Me gusta esta canción.","en":"I like this song."},{"es":"No les gustan los perros.","en":"They don't like dogs."}]},{"es":"encantar","pos":"v.","en":"to love, to delight","note":"Works exactly like gustar but stronger: me encanta is I love it. Never me encanta mucho.","ex":[{"es":"Me encanta cocinar los domingos.","en":"I love cooking on Sundays."}]},{"es":"reír","pos":"v. irr.","en":"to laugh","note":"Usually reflexive with de: reírse de algo, to laugh at something. la risa is laughter.","conj":{"label":"pres.","forms":["río","ríes","ríe","reímos","ríen"]},"ex":[{"es":"Nos reímos toda la noche.","en":"We laughed all night."}]},{"es":"llorar","pos":"v.","en":"to cry","note":"las lágrimas are tears.","ex":[{"es":"El bebé lloró hasta dormirse.","en":"The baby cried until it fell asleep."}]},{"es":"sonreír","pos":"v. irr.","en":"to smile","note":"la sonrisa is a smile. Same pattern as reír.","ex":[{"es":"Sonrió sin decir nada.","en":"She smiled without saying anything."}]},{"es":"la suerte","pos":"n.f.","en":"luck; fate","he":"מזל","note":"¡Buena suerte! is good luck. tener suerte is to be lucky.","ex":[{"tag":"luck","es":"Tuvimos mucha suerte con el clima.","en":"We were very lucky with the weather."},{"tag":"fate","es":"Aceptó su suerte sin quejarse.","en":"He accepted his fate without complaining."}]},{"es":"la vergüenza","pos":"n.f.","en":"embarrassment, shame","he":"בושה","note":"dar vergüenza is to embarrass. Remember embarazada means pregnant, not embarrassed.","ex":[{"es":"Me da vergüenza preguntar otra vez.","en":"I'm embarrassed to ask again."}]},{"es":"el ánimo","pos":"n.m.","en":"spirits, mood; encouragement","he":"מצב רוח / עידוד","note":"¡Ánimo! is cheer up or you can do it.","ex":[{"tag":"mood","es":"Hoy tiene mejor ánimo.","en":"He's in better spirits today."},{"tag":"encouragement","es":"¡Ánimo, ya casi terminas!","en":"Come on, you're nearly finished!"}]},{"es":"extrañar","pos":"v.","en":"to miss (someone); to find strange","he":"להתגעגע","note":"extrañar in Latin America; echar de menos in Spain.","ex":[{"tag":"miss","es":"Extraño mucho a mi familia.","en":"I miss my family a lot."},{"tag":"find strange","es":"Me extraña que no haya llamado.","en":"I find it strange that he hasn't called."}]},{"es":"la ganas","pos":"n.f.pl.","en":"desire, urge, wanting to","he":"חשק","note":"tener ganas de + infinitive is to feel like doing something. Almost always plural.","ex":[{"es":"No tengo ganas de salir hoy.","en":"I don't feel like going out today."}]}]},{"id":"u21","title":"Animals","intro":"Many animal names have one form for both sexes, with el or la doing the work: el elefante, la araña. Where a feminine form exists it is given after the slash.","entries":[{"es":"el animal","pos":"n.m.","en":"animal","note":"Plural animales. Also used of a person, rudely.","ex":[{"es":"No se permiten animales en el hotel.","en":"Animals aren't allowed in the hotel."}]},{"es":"el perro / la perra","pos":"n.","en":"dog","note":"The feminine is also a strong insult, so most people say la perrita of a female dog.","ex":[{"es":"El perro ladra a los extraños.","en":"The dog barks at strangers."}]},{"es":"el gato / la gata","pos":"n.","en":"cat","note":"See plate 2, where the cat does all the work.","ex":[{"es":"El gato duerme en la ventana.","en":"The cat sleeps in the window."}]},{"es":"el caballo","pos":"n.m.","en":"horse","note":"la yegua is a mare. montar a caballo is to ride.","ex":[{"es":"Aprendió a montar a caballo de niño.","en":"He learned to ride as a boy."}]},{"es":"la vaca","pos":"n.f.","en":"cow","note":"el toro is a bull; el ternero a calf; la carne de vaca or de res is beef.","ex":[{"es":"Las vacas están en el campo.","en":"The cows are in the field."}]},{"es":"el cerdo","pos":"n.m.","en":"pig; pork","he":"חזיר","note":"el puerco and el chancho are regional alternatives.","ex":[{"tag":"animal","es":"Crían cerdos y gallinas.","en":"They raise pigs and hens."},{"tag":"meat","es":"Pedí carne de cerdo.","en":"I ordered pork."}]},{"es":"la oveja","pos":"n.f.","en":"sheep","note":"Same word for one and many: una oveja, dos ovejas. el cordero is lamb.","ex":[{"es":"El perro cuida las ovejas.","en":"The dog looks after the sheep."}]},{"es":"la gallina","pos":"n.f.","en":"hen","note":"el gallo is the rooster; el pollo the chicken you eat; el pollito a chick.","ex":[{"es":"Las gallinas ponen huevos cada día.","en":"The hens lay eggs every day."}]},{"es":"el pájaro","pos":"n.m.","en":"bird","note":"el ave is the formal or scientific word, feminine but taking el in the singular.","ex":[{"es":"Los pájaros cantan al amanecer.","en":"The birds sing at dawn."}]},{"es":"el pez","pos":"n.m.","en":"fish (alive)","note":"Plural peces. Once caught it becomes el pescado — see unit 7.","ex":[{"es":"Hay peces de colores en el estanque.","en":"There are goldfish in the pond."}]},{"es":"el ratón","pos":"n.m.","en":"mouse (animal and computer)","note":"Plural ratones. la rata is a rat.","ex":[{"tag":"animal","es":"Hay un ratón en la cocina.","en":"There's a mouse in the kitchen."},{"tag":"computer","es":"Se me rompió el ratón.","en":"My mouse broke."}]},{"es":"el conejo","pos":"n.m.","en":"rabbit","ex":[{"es":"El conejo se escapó del jardín.","en":"The rabbit escaped from the garden."}]},{"es":"el oso","pos":"n.m.","en":"bear","note":"Not to be confused with el hueso, bone.","ex":[{"es":"Vimos un oso desde el carro.","en":"We saw a bear from the car."}]},{"es":"el lobo","pos":"n.m.","en":"wolf","ex":[{"es":"Los lobos cazan en grupo.","en":"Wolves hunt in packs."}]},{"es":"la mosca","pos":"n.f.","en":"fly","note":"el mosquito is the mosquito; la araña the spider; la hormiga the ant.","ex":[{"es":"Hay moscas por toda la cocina.","en":"There are flies all over the kitchen."}]},{"es":"la abeja","pos":"n.f.","en":"bee","note":"la miel is honey; picar is to sting.","ex":[{"es":"Una abeja me picó en el brazo.","en":"A bee stung me on the arm."}]},{"es":"la serpiente","pos":"n.f.","en":"snake","note":"la culebra is the everyday word in much of Latin America.","ex":[{"es":"Cuidado, hay serpientes en el monte.","en":"Careful, there are snakes in the hills."}]},{"es":"la cola","pos":"n.f.","en":"tail; queue, line","he":"זנב / תור","note":"hacer cola is to queue. In Mexico it also means glue, and in the Southern Cone it is slang for backside.","ex":[{"tag":"tail","es":"El perro movía la cola.","en":"The dog was wagging its tail."},{"tag":"queue","es":"Había una cola enorme en el banco.","en":"There was a huge queue at the bank."}]},{"es":"el ala","pos":"n.f.","en":"wing","note":"Feminine but takes el in the singular, like el agua: el ala derecha, las alas.","ex":[{"es":"El pájaro tenía un ala rota.","en":"The bird had a broken wing."}]},{"es":"morder","pos":"v. irr.","en":"to bite","conj":{"label":"pres.","forms":["muerdo","muerdes","muerde","mordemos","muerden"]},"ex":[{"es":"El perro no muerde, tranquilo.","en":"The dog doesn't bite, don't worry."}]}]},{"id":"u22","title":"Moving about","intro":"Spanish is strict about direction in a way English is not. ir is away from here, venir towards the speaker, llevar is carrying away, traer carrying towards. Getting these backwards is the most persistent English-speaker error in the language.","entries":[{"es":"venir · ir","pos":"v. irr.","en":"to come (towards me); to go (away from me)","he":"לבוא / ללכת","note":"In English you can say I'm coming to your house. In Spanish that is voy a tu casa — you are going, because you are not yet there.","ex":[{"tag":"come","es":"Ven aquí un momento.","en":"Come here a moment."},{"tag":"go","es":"Ya voy para allá.","en":"I'm on my way over there."}]},{"es":"traer · llevar","pos":"v. irr.","en":"to bring (here); to take (away)","he":"להביא / לקחת","note":"The same split as venir and ir. ¿Te traigo algo? offers to bring it to you here.","conj":{"label":"traer, pres.","forms":["traigo","traes","trae","traemos","traen"]},"ex":[{"tag":"bring","es":"¿Me traes un vaso de agua?","en":"Could you bring me a glass of water?"},{"tag":"take","es":"Llévate el paraguas.","en":"Take the umbrella with you."}]},{"es":"salir","pos":"v. irr.","en":"to leave, to go out; to turn out","he":"לצאת","conj":{"label":"pres.","forms":["salgo","sales","sale","salimos","salen"]},"ex":[{"tag":"go out","es":"Salimos a las ocho.","en":"We leave at eight."},{"tag":"turn out","es":"Todo salió bien.","en":"Everything turned out fine."}]},{"es":"entrar","pos":"v.","en":"to go in, to enter","note":"Takes en or a, never a bare object: entrar en la casa, entrar al cuarto.","ex":[{"es":"Entramos sin hacer ruido.","en":"We went in without making a noise."}]},{"es":"subir","pos":"v.","en":"to go up, to climb; to get on (a vehicle); to raise","he":"לעלות","ex":[{"tag":"go up","es":"Subimos al último piso.","en":"We went up to the top floor."},{"tag":"get on","es":"Sube al autobús, ya va a salir.","en":"Get on the bus, it's about to leave."},{"tag":"raise","es":"Sube el volumen, por favor.","en":"Turn the volume up, please."}]},{"es":"bajar","pos":"v.","en":"to go down; to get off; to lower, to download","he":"לירד","ex":[{"tag":"go down","es":"Baja con cuidado, está resbaloso.","en":"Go down carefully, it's slippery."},{"tag":"get off","es":"Bajamos en la próxima parada.","en":"We get off at the next stop."},{"tag":"download","es":"Bajé la aplicación anoche.","en":"I downloaded the app last night."}]},{"es":"regresar","pos":"v.","en":"to return, to go back","note":"Interchangeable with volver — see unit 1. regresar is commoner in Latin America.","ex":[{"es":"Regresamos el lunes.","en":"We're coming back on Monday."}]},{"es":"correr","pos":"v.","en":"to run; to move (something) along","he":"לרוץ","ex":[{"tag":"run","es":"Corre todas las mañanas.","en":"She runs every morning."},{"tag":"move along","es":"Corre la silla un poco.","en":"Move the chair over a bit."}]},{"es":"saltar","pos":"v.","en":"to jump; to skip (over)","ex":[{"tag":"jump","es":"El gato saltó a la mesa.","en":"The cat jumped onto the table."},{"tag":"skip","es":"Se saltó dos páginas.","en":"He skipped two pages."}]},{"es":"seguir","pos":"v. irr.","en":"to follow; to carry on, to keep doing","he":"לעקוב / להמשיך","note":"seguir + gerund is the everyday way to say still doing something: sigue lloviendo, it's still raining.","conj":{"label":"pres.","forms":["sigo","sigues","sigue","seguimos","siguen"]},"ex":[{"tag":"follow","es":"Sígueme, conozco el camino.","en":"Follow me, I know the way."},{"tag":"carry on","es":"Sigue estudiando, vas muy bien.","en":"Keep studying, you're doing well."}]},{"es":"parar","pos":"v.","en":"to stop; (pararse) to stand up","he":"לעצור / לקום","note":"In Latin America pararse means to stand up; in Spain it means to stop oneself. A real difference.","ex":[{"tag":"stop","es":"Para aquí, por favor.","en":"Stop here, please."},{"tag":"stand up","es":"Se paró para saludarnos.","en":"He stood up to greet us."}]},{"es":"moverse","pos":"v. irr.","en":"to move","conj":{"label":"pres.","forms":["me muevo","te mueves","se mueve","nos movemos","se mueven"]},"ex":[{"es":"No te muevas, ya casi termino.","en":"Don't move, I'm nearly done."}]},{"es":"acercarse","pos":"v.","en":"to approach, to get closer","note":"acercarse a. The opposite is alejarse de.","ex":[{"es":"Se acercó para escuchar mejor.","en":"She came closer to hear better."}]},{"es":"cruzar","pos":"v.","en":"to cross","ex":[{"es":"Cruza en la esquina, no aquí.","en":"Cross at the corner, not here."}]},{"es":"caer","pos":"v. irr.","en":"to fall","note":"Usually reflexive for people: me caí. caerse bien means to get on well with someone.","conj":{"label":"pres.","forms":["caigo","caes","cae","caemos","caen"]},"ex":[{"es":"Se cayó de la bicicleta.","en":"He fell off his bicycle."}]},{"es":"el viaje","pos":"n.m.","en":"trip, journey","note":"viajar is to travel; el viajero the traveller. ¡Buen viaje!","ex":[{"es":"El viaje dura seis horas.","en":"The journey takes six hours."}]},{"es":"la parada","pos":"n.f.","en":"stop (bus, train)","ex":[{"es":"Te espero en la parada.","en":"I'll wait for you at the stop."}]},{"es":"el boleto","pos":"n.m.","en":"ticket","note":"boleto in Latin America; el billete in Spain, where boleto means a lottery ticket.","ex":[{"es":"Compré los boletos por internet.","en":"I bought the tickets online."}]},{"es":"la maleta","pos":"n.f.","en":"suitcase","note":"hacer la maleta is to pack. el equipaje is luggage.","ex":[{"es":"Todavía no hice la maleta.","en":"I haven't packed yet."}]},{"es":"el avión","pos":"n.m.","en":"aeroplane","note":"Plural aviones. volar is to fly; el vuelo the flight.","ex":[{"es":"El avión salió con retraso.","en":"The plane left late."}]}]},{"id":"u23","title":"Speaking and listening","intro":"Spanish separates decir (to say the words) from hablar (to talk), contar (to tell a story) and platicar or charlar (to chat). English overloads say, tell and talk; Spanish does not.","entries":[{"es":"la palabra","pos":"n.f.","en":"word; right to speak","he":"מילה","ex":[{"tag":"word","es":"No entendí esa palabra.","en":"I didn't understand that word."},{"tag":"right to speak","es":"Le dieron la palabra al testigo.","en":"They gave the witness the floor."}]},{"es":"la frase","pos":"n.f.","en":"sentence, phrase","note":"la oración is the grammatical term for a sentence, and also a prayer.","ex":[{"es":"Repite la frase completa.","en":"Repeat the whole sentence."}]},{"es":"el idioma","pos":"n.m.","en":"language","note":"Masculine despite the -a. la lengua also means language, and the tongue.","ex":[{"es":"Habla cuatro idiomas.","en":"She speaks four languages."}]},{"es":"contar","pos":"v. irr.","en":"to tell (a story); to count","he":"לספר / לספור","note":"contar con means to count on, to rely on.","conj":{"label":"pres.","forms":["cuento","cuentas","cuenta","contamos","cuentan"]},"ex":[{"tag":"tell","es":"Cuéntame qué pasó.","en":"Tell me what happened."},{"tag":"count","es":"Cuenta hasta diez.","en":"Count to ten."}]},{"es":"explicar","pos":"v.","en":"to explain","ex":[{"es":"¿Me lo explicas otra vez?","en":"Could you explain it to me again?"}]},{"es":"contestar","pos":"v.","en":"to answer, to reply","note":"responder is the slightly more formal synonym. la respuesta is the answer.","ex":[{"es":"Nadie contestó el teléfono.","en":"Nobody answered the phone."}]},{"es":"gritar","pos":"v.","en":"to shout, to scream","note":"el grito is a shout. dar un grito is to let out a yell.","ex":[{"es":"No me grites, te escucho bien.","en":"Don't shout at me, I can hear you."}]},{"es":"callarse","pos":"v.","en":"to be quiet, to stop talking","note":"¡Cállate! is blunt — shut up. el silencio is silence.","ex":[{"es":"Se calló de repente.","en":"He suddenly went quiet."}]},{"es":"repetir","pos":"v. irr.","en":"to repeat","conj":{"label":"pres.","forms":["repito","repites","repite","repetimos","repiten"]},"ex":[{"es":"¿Puede repetir, por favor?","en":"Could you repeat that, please?"}]},{"es":"llamar","pos":"v.","en":"to call, to phone; to be called (llamarse)","he":"להתקשר / להיקרא","note":"¿Cómo te llamas? is literally what do you call yourself.","ex":[{"tag":"phone","es":"Te llamo en la noche.","en":"I'll call you tonight."},{"tag":"be called","es":"Me llamo Miguel.","en":"My name is Miguel."}]},{"es":"el mensaje","pos":"n.m.","en":"message","note":"mandar or enviar un mensaje is to send a message.","ex":[{"es":"Te dejé un mensaje.","en":"I left you a message."}]},{"es":"la voz","pos":"n.f.","en":"voice","note":"Plural voces. en voz alta means out loud; en voz baja quietly.","ex":[{"es":"Tiene una voz muy grave.","en":"He has a very deep voice."}]},{"es":"el ruido","pos":"n.m.","en":"noise","note":"hacer ruido is to make a noise; ruidoso is noisy.","ex":[{"es":"Los vecinos hacen mucho ruido.","en":"The neighbours make a lot of noise."}]},{"es":"oír","pos":"v. irr.","en":"to hear","he":"לשמוע","note":"Hearing that happens to you, as against escuchar, which is deliberate. ¡Oye! is hey.","conj":{"label":"pres.","forms":["oigo","oyes","oye","oímos","oyen"]},"ex":[{"es":"No te oigo, habla más fuerte.","en":"I can't hear you, speak louder."}]},{"es":"el verbo","pos":"n.m.","en":"verb","note":"el sustantivo is a noun, el adjetivo an adjective, el acento the accent mark.","ex":[{"es":"Ese verbo es irregular.","en":"That verb is irregular."}]},{"es":"significar","pos":"v.","en":"to mean","note":"¿Qué significa esta palabra? is how to ask what a word means. querer decir does the same job.","ex":[{"es":"¿Qué significa esto?","en":"What does this mean?"}]},{"es":"traducir","pos":"v. irr.","en":"to translate","conj":{"label":"pres.","forms":["traduzco","traduces","traduce","traducimos","traducen"]},"ex":[{"es":"¿Me traduces esta frase?","en":"Will you translate this sentence for me?"}]},{"es":"el chiste","pos":"n.m.","en":"joke","note":"contar un chiste is to tell a joke. la broma is a prank.","ex":[{"es":"Nos contó un chiste malísimo.","en":"He told us a terrible joke."}]},{"es":"la noticia","pos":"n.f.","en":"a piece of news","note":"Singular for one item, plural las noticias for the news broadcast.","ex":[{"tag":"one item","es":"Tengo una buena noticia.","en":"I have some good news."},{"tag":"the news","es":"Vemos las noticias a las nueve.","en":"We watch the news at nine."}]},{"es":"mentir","pos":"v. irr.","en":"to lie, to tell a lie","note":"la mentira is a lie; la verdad the truth.","conj":{"label":"pres.","forms":["miento","mientes","miente","mentimos","mienten"]},"ex":[{"es":"No me mientas, por favor.","en":"Don't lie to me, please."}]}]},{"id":"u24","title":"The mind: thinking and remembering","intro":"Two pairs here trip English speakers constantly. saber and conocer both mean know (see unit 1), and recordar and acordarse both mean remember — but acordarse needs de, and recordar refuses it.","entries":[{"es":"la idea","pos":"n.f.","en":"idea","note":"No tengo idea is the everyday I have no idea.","ex":[{"es":"Se me ocurrió una idea.","en":"An idea came to me."}]},{"es":"la razón","pos":"n.f.","en":"reason; rightness","he":"סיבה / צדק","note":"tener razón is to be right. Not to have reason.","ex":[{"tag":"reason","es":"No me dio ninguna razón.","en":"He gave me no reason."},{"tag":"rightness","es":"Tienes razón, me equivoqué.","en":"You're right, I was wrong."}]},{"es":"recordar","pos":"v. irr.","en":"to remember; to remind","he":"לזכור / להזכיר","warn":"Not to record — that is grabar. And it takes a direct object with no preposition: recuerdo su nombre, never recuerdo de su nombre.","conj":{"label":"pres.","forms":["recuerdo","recuerdas","recuerda","recordamos","recuerdan"]},"ex":[{"tag":"remember","es":"No recuerdo dónde lo dejé.","en":"I don't remember where I left it."},{"tag":"remind","es":"Recuérdame llamar al médico.","en":"Remind me to call the doctor."}]},{"es":"acordarse","pos":"v. irr.","en":"to remember","note":"Always with de: me acuerdo de ti. Same meaning as recordar, opposite grammar.","conj":{"label":"pres.","forms":["me acuerdo","te acuerdas","se acuerda","nos acordamos","se acuerdan"]},"ex":[{"es":"¿Te acuerdas de aquella noche?","en":"Do you remember that night?"}]},{"es":"olvidar","pos":"v.","en":"to forget","note":"Three grammars, all correct: olvidé las llaves, me olvidé de las llaves, se me olvidaron las llaves. The last shifts the blame off you.","ex":[{"es":"Se me olvidó tu cumpleaños.","en":"I forgot your birthday."}]},{"es":"entender","pos":"v. irr.","en":"to understand","note":"comprender is the slightly more formal twin.","conj":{"label":"pres.","forms":["entiendo","entiendes","entiende","entendemos","entienden"]},"ex":[{"es":"No entiendo nada de lo que dice.","en":"I don't understand a thing he says."}]},{"es":"aprender","pos":"v.","en":"to learn","note":"aprender a + infinitive: aprender a manejar.","ex":[{"es":"Estoy aprendiendo español.","en":"I'm learning Spanish."}]},{"es":"enseñar","pos":"v.","en":"to teach; to show","he":"ללמד / להראות","ex":[{"tag":"teach","es":"Enseña matemáticas en la secundaria.","en":"She teaches maths at secondary school."},{"tag":"show","es":"Enséñame las fotos.","en":"Show me the photos."}]},{"es":"darse cuenta","pos":"v.","en":"to realise, to notice","he":"לשים לב / להבין","note":"Takes de before a clause: me di cuenta de que no estaba. Nothing to do with realizar, which means to carry out.","ex":[{"es":"No me di cuenta de la hora.","en":"I didn't realise the time."}]},{"es":"parecer","pos":"v. irr.","en":"to seem; to think (an opinion)","he":"להיראות / לחשוב","note":"¿Qué te parece? asks what do you think. me parece que is I think that.","conj":{"label":"pres.","forms":["parezco","pareces","parece","parecemos","parecen"]},"ex":[{"tag":"seem","es":"Parece más joven de lo que es.","en":"She seems younger than she is."},{"tag":"opinion","es":"Me parece una buena idea.","en":"It seems like a good idea to me."}]},{"es":"decidir","pos":"v.","en":"to decide","note":"la decisión is the decision; tomar una decisión to make one.","ex":[{"es":"Decidimos quedarnos un día más.","en":"We decided to stay one more day."}]},{"es":"dudar","pos":"v.","en":"to doubt; to hesitate","he":"לפקפק / להתלבט","ex":[{"tag":"doubt","es":"Dudo que venga.","en":"I doubt he'll come."},{"tag":"hesitate","es":"Dudó antes de contestar.","en":"He hesitated before answering."}]},{"es":"la duda","pos":"n.f.","en":"doubt; question, query","note":"In class ¿alguna duda? means any questions.","ex":[{"tag":"doubt","es":"No hay duda de que funciona.","en":"There's no doubt it works."},{"tag":"query","es":"Tengo una duda sobre el ejercicio.","en":"I have a question about the exercise."}]},{"es":"el problema","pos":"n.m.","en":"problem","note":"Masculine despite the -a, like el tema, el sistema, el programa — all from Greek.","ex":[{"es":"Ningún problema, yo lo hago.","en":"No problem, I'll do it."}]},{"es":"la manera · el modo","pos":"n.","en":"way, manner","note":"de todos modos and de todas maneras both mean anyway.","ex":[{"es":"No me gusta su manera de hablar.","en":"I don't like the way he talks."}]},{"es":"la verdad","pos":"n.f.","en":"truth","note":"¿verdad? at the end of a sentence is the universal tag question: isn't it, don't you, right?","ex":[{"es":"Hace calor, ¿verdad?","en":"It's hot, isn't it?"}]},{"es":"el error","pos":"n.m.","en":"mistake, error","note":"equivocarse is to make a mistake; la falta is a fault or a lack.","ex":[{"es":"Fue un error mío.","en":"It was my mistake."}]},{"es":"el ejemplo","pos":"n.m.","en":"example","note":"por ejemplo is for example, abbreviated p. ej.","ex":[{"es":"Dame un ejemplo concreto.","en":"Give me a specific example."}]},{"es":"importar","pos":"v.","en":"to matter, to be important; to import","he":"להיות חשוב / לייבא","note":"Built like gustar: no me importa means it doesn't matter to me.","ex":[{"tag":"matter","es":"No importa, lo hacemos mañana.","en":"It doesn't matter, we'll do it tomorrow."},{"tag":"import","es":"Importan el café de Colombia.","en":"They import the coffee from Colombia."}]},{"es":"el sentido","pos":"n.m.","en":"meaning, sense; direction","he":"משמעות / כיוון","note":"no tiene sentido is it makes no sense. calle de un sentido is a one-way street.","ex":[{"tag":"meaning","es":"Eso no tiene sentido.","en":"That doesn't make sense."},{"tag":"direction","es":"Vas en sentido contrario.","en":"You're going the wrong way."}]}]},{"id":"u25","title":"School and studying","intro":"Watch two traps: la librería is a bookshop and the library is la biblioteca, and el colegio is a school, not a college. University is la universidad.","entries":[{"es":"la escuela · el colegio","pos":"n.","en":"school","warn":"el colegio is not a college. Higher education is la universidad, and a university course is una carrera.","ex":[{"es":"Los niños salen del colegio a las dos.","en":"The children leave school at two."}]},{"es":"la universidad","pos":"n.f.","en":"university","note":"la facultad is the faculty or department you actually attend.","ex":[{"es":"Estudia en la universidad pública.","en":"She studies at the state university."}]},{"es":"el alumno / la alumna","pos":"n.","en":"pupil, student","note":"el estudiante is used at any level and has one form for both sexes.","ex":[{"es":"Hay treinta alumnos en el grupo.","en":"There are thirty pupils in the class."}]},{"es":"la clase","pos":"n.f.","en":"class, lesson; kind, type; classroom","he":"שיעור / סוג","note":"toda clase de means all kinds of.","ex":[{"tag":"lesson","es":"La clase empieza a las nueve.","en":"The lesson starts at nine."},{"tag":"kind","es":"Vende toda clase de herramientas.","en":"He sells all kinds of tools."},{"tag":"classroom","es":"Nos vemos en la clase de al lado.","en":"See you in the next classroom."}]},{"es":"el libro","pos":"n.m.","en":"book","note":"la librería is a bookshop; la biblioteca the library. A classic false friend.","ex":[{"es":"Me presta el libro cuando lo termine.","en":"He'll lend me the book when he finishes it."}]},{"es":"el cuaderno","pos":"n.m.","en":"notebook, exercise book","ex":[{"es":"Apúntalo en el cuaderno.","en":"Write it down in your notebook."}]},{"es":"el papel","pos":"n.m.","en":"paper; role, part","he":"נייר / תפקיד","note":"hacer el papel de is to play the part of.","ex":[{"tag":"paper","es":"Necesito una hoja de papel.","en":"I need a sheet of paper."},{"tag":"role","es":"Jugó un papel importante.","en":"He played an important role."}]},{"es":"el lápiz","pos":"n.m.","en":"pencil","note":"Plural lápices. la pluma or el bolígrafo is a pen; la goma an eraser.","ex":[{"es":"Escribe con lápiz, por si te equivocas.","en":"Write in pencil, in case you make a mistake."}]},{"es":"la tarea","pos":"n.f.","en":"homework; task","he":"שיעורי בית / מטלה","note":"hacer la tarea is to do your homework. los deberes in Spain.","ex":[{"tag":"homework","es":"¿Ya hiciste la tarea?","en":"Have you done your homework?"},{"tag":"task","es":"Es una tarea difícil.","en":"It's a difficult task."}]},{"es":"el examen","pos":"n.m.","en":"exam, test","note":"Plural exámenes, which gains an accent. la prueba is a shorter test.","ex":[{"es":"Aprobé el examen por poco.","en":"I passed the exam by a whisker."}]},{"es":"aprobar · reprobar","pos":"v. irr.","en":"to pass (an exam); to fail","note":"suspender is used for failing in Spain. aprobar also means to approve.","ex":[{"tag":"pass","es":"Aprobó con buena nota.","en":"She passed with a good mark."},{"tag":"fail","es":"Reprobé química el año pasado.","en":"I failed chemistry last year."}]},{"es":"la nota","pos":"n.f.","en":"mark, grade; note","he":"ציון / פתק","ex":[{"tag":"mark","es":"Saqué buena nota en historia.","en":"I got a good mark in history."},{"tag":"note","es":"Me dejó una nota en la mesa.","en":"He left me a note on the table."}]},{"es":"la pregunta","pos":"n.f.","en":"question","note":"hacer una pregunta is to ask a question — hacer, never preguntar una pregunta.","ex":[{"es":"¿Puedo hacer una pregunta?","en":"May I ask a question?"}]},{"es":"la respuesta","pos":"n.f.","en":"answer, reply","ex":[{"es":"Todavía espero su respuesta.","en":"I'm still waiting for his answer."}]},{"es":"la página","pos":"n.f.","en":"page","note":"Also a web page: la página web.","ex":[{"es":"Abran el libro en la página treinta.","en":"Open your books at page thirty."}]},{"es":"el curso","pos":"n.m.","en":"course; school year","ex":[{"tag":"course","es":"Tomé un curso de fotografía.","en":"I took a photography course."},{"tag":"school year","es":"El curso termina en junio.","en":"The school year ends in June."}]},{"es":"la materia","pos":"n.f.","en":"subject (of study); matter, material","he":"מקצוע / חומר","ex":[{"tag":"subject","es":"Mi materia favorita es la historia.","en":"My favourite subject is history."},{"tag":"matter","es":"Es experto en la materia.","en":"He's an expert on the subject."}]},{"es":"la historia","pos":"n.f.","en":"history; story","he":"היסטוריה / סיפור","note":"One word for both, which English keeps apart.","ex":[{"tag":"history","es":"Estudió historia en México.","en":"She studied history in Mexico."},{"tag":"story","es":"Cuéntame la historia completa.","en":"Tell me the whole story."}]},{"es":"las matemáticas","pos":"n.f.pl.","en":"mathematics","note":"Plural in Spanish. Shortened to mate or matemática in some countries.","ex":[{"es":"Siempre fui malo en matemáticas.","en":"I was always bad at maths."}]},{"es":"practicar","pos":"v.","en":"to practise; to play (a sport)","he":"להתאמן / לשחק","ex":[{"tag":"practise","es":"Practico español todos los días.","en":"I practise Spanish every day."},{"tag":"play a sport","es":"Practica natación dos veces por semana.","en":"He swims twice a week."}]}]},{"id":"u26","title":"Everyday routine","intro":"Most of this unit is reflexive, because Spanish marks actions you do to yourself: despertarse, levantarse, bañarse, acostarse. The reflexive pronoun is not optional — levantar without it means to lift something else.","entries":[{"es":"despertarse","pos":"v. irr.","en":"to wake up","note":"despertar without se means to wake someone else: despierta a tu hermano.","conj":{"label":"pres.","forms":["me despierto","te despiertas","se despierta","nos despertamos","se despiertan"]},"ex":[{"es":"Me despierto a las seis sin despertador.","en":"I wake up at six without an alarm."}]},{"es":"levantarse","pos":"v.","en":"to get up, to stand up","note":"levantar alone is to lift or raise something.","ex":[{"es":"Se levanta tardísimo los domingos.","en":"He gets up very late on Sundays."}]},{"es":"dormir","pos":"v. irr.","en":"to sleep; (dormirse) to fall asleep","he":"לישון / להירדם","conj":{"label":"pres.","forms":["duermo","duermes","duerme","dormimos","duermen"]},"ex":[{"tag":"sleep","es":"Dormí ocho horas seguidas.","en":"I slept eight hours straight."},{"tag":"fall asleep","es":"Se durmió en el sofá.","en":"He fell asleep on the sofa."}]},{"es":"acostarse","pos":"v. irr.","en":"to go to bed, to lie down","conj":{"label":"pres.","forms":["me acuesto","te acuestas","se acuesta","nos acostamos","se acuestan"]},"ex":[{"es":"Me acuesto antes de medianoche.","en":"I go to bed before midnight."}]},{"es":"bañarse · ducharse","pos":"v.","en":"to have a bath; to have a shower","note":"In much of Latin America bañarse covers showering too.","ex":[{"tag":"bath","es":"El niño se baña antes de cenar.","en":"The boy has a bath before dinner."},{"tag":"shower","es":"Me ducho en cinco minutos.","en":"I shower in five minutes."}]},{"es":"el baño","pos":"n.m.","en":"bathroom; bath","note":"Asking ¿dónde está el baño? is the polite way to ask for the toilet.","ex":[{"tag":"bathroom","es":"¿Dónde está el baño?","en":"Where is the bathroom?"},{"tag":"bath","es":"Se dio un baño largo.","en":"She had a long bath."}]},{"es":"peinarse","pos":"v.","en":"to comb one's hair","note":"el peine is the comb; el cepillo the brush.","ex":[{"es":"Péinate antes de salir.","en":"Comb your hair before you go out."}]},{"es":"afeitarse","pos":"v.","en":"to shave","note":"la barba is a beard; el bigote a moustache.","ex":[{"es":"Se afeita cada dos días.","en":"He shaves every other day."}]},{"es":"el despertador","pos":"n.m.","en":"alarm clock","note":"poner el despertador is to set the alarm.","ex":[{"es":"No oí el despertador.","en":"I didn't hear the alarm."}]},{"es":"desayunar","pos":"v.","en":"to have breakfast","note":"One verb where English needs three words. Same with almorzar and cenar.","ex":[{"es":"Desayunamos juntos todos los días.","en":"We have breakfast together every day."}]},{"es":"descansar","pos":"v.","en":"to rest","note":"el descanso is a rest or a break.","ex":[{"es":"Descansa un rato, llevas horas trabajando.","en":"Rest for a while, you've been working for hours."}]},{"es":"esperar el turno","pos":"phrase","en":"to wait one's turn","note":"el turno is your turn or a shift at work. me toca a mí means it's my turn.","ex":[{"es":"Espera tu turno, por favor.","en":"Wait your turn, please."}]},{"es":"olvidarse","pos":"v.","en":"to forget","note":"See unit 24. In routine contexts se me olvidó is the everyday form.","ex":[{"es":"Se me olvidó el almuerzo en casa.","en":"I left my lunch at home."}]},{"es":"apagar · encender","pos":"v. irr.","en":"to turn off; to turn on, to light","he":"לכבות / להדליק","warn":"Frequently swapped in word lists. apagar is off, encender is on. prender is the everyday word for on in Latin America.","ex":[{"tag":"turn off","es":"Apaga la luz al salir.","en":"Turn the light off when you leave."},{"tag":"turn on","es":"Enciende la televisión.","en":"Turn the television on."}]},{"es":"abrir · cerrar","pos":"v. irr.","en":"to open; to close","note":"Past participles: abierto, cerrado — the words on every shop door.","ex":[{"tag":"open","es":"Abre la ventana, hace calor.","en":"Open the window, it's hot."},{"tag":"close","es":"Cierra la puerta con llave.","en":"Lock the door."}]},{"es":"buscar · encontrar","pos":"v.","en":"to look for; to find","note":"See unit 2. Together they cover most of what you do with lost keys.","ex":[{"tag":"look for","es":"Busco mis lentes.","en":"I'm looking for my glasses."},{"tag":"find","es":"Los encontré en el carro.","en":"I found them in the car."}]},{"es":"el cepillo de dientes","pos":"n.m.","en":"toothbrush","note":"la pasta de dientes is toothpaste; lavarse los dientes to brush your teeth.","ex":[{"es":"Olvidé el cepillo de dientes.","en":"I forgot my toothbrush."}]},{"es":"la toalla","pos":"n.f.","en":"towel","ex":[{"es":"Hay toallas limpias en el baño.","en":"There are clean towels in the bathroom."}]},{"es":"el rato libre","pos":"n.m.","en":"free time, spare moment","note":"el tiempo libre is free time in general; los ratos libres odd moments.","ex":[{"es":"Leo en mis ratos libres.","en":"I read in my spare time."}]},{"es":"tarde · temprano","pos":"adv.","en":"late; early","note":"For late as an adjective use atrasado or con retraso: el tren viene atrasado.","ex":[{"tag":"late","es":"Llegamos tarde otra vez.","en":"We arrived late again."},{"tag":"early","es":"Salimos temprano para evitar el tráfico.","en":"We left early to avoid the traffic."}]}]},{"id":"u27","title":"Phones, computers and the internet","intro":"This is the one area where borrowed English is normal and understood everywhere, but the native words are still the ones printed on signs and menus. Both are given.","entries":[{"es":"el teléfono","pos":"n.m.","en":"telephone","note":"el celular in Latin America, el móvil in Spain. Both mean mobile phone.","ex":[{"es":"Se me quedó el teléfono en casa.","en":"I left my phone at home."}]},{"es":"la computadora","pos":"n.f.","en":"computer","note":"la computadora in Latin America, el ordenador in Spain. Both are everyday.","ex":[{"es":"La computadora va lentísima.","en":"The computer is running very slowly."}]},{"es":"la pantalla","pos":"n.f.","en":"screen","note":"Also the cinema screen and a lampshade.","ex":[{"es":"Se rompió la pantalla del celular.","en":"The phone screen broke."}]},{"es":"el teclado","pos":"n.m.","en":"keyboard","note":"la tecla is a single key; el ratón the mouse.","ex":[{"es":"El teclado no tiene la eñe.","en":"The keyboard doesn't have an ñ."}]},{"es":"el archivo","pos":"n.m.","en":"file; archive","he":"קובץ / ארכיון","note":"la carpeta is a folder.","ex":[{"tag":"file","es":"No puedo abrir el archivo.","en":"I can't open the file."},{"tag":"archive","es":"Lo encontré en el archivo nacional.","en":"I found it in the national archive."}]},{"es":"guardar","pos":"v.","en":"to save; to keep, to put away","he":"לשמור","ex":[{"tag":"save","es":"Guarda el archivo antes de cerrar.","en":"Save the file before closing."},{"tag":"put away","es":"Guarda la ropa en el cajón.","en":"Put the clothes away in the drawer."}]},{"es":"borrar","pos":"v.","en":"to delete, to erase, to rub out","ex":[{"es":"Borré el mensaje sin leerlo.","en":"I deleted the message without reading it."}]},{"es":"la contraseña","pos":"n.f.","en":"password","note":"la clave is used just as often, and also means key or code.","ex":[{"es":"Olvidé la contraseña otra vez.","en":"I've forgotten the password again."}]},{"es":"la red","pos":"n.f.","en":"network; net","he":"רשת","note":"las redes sociales is social media. la Red with a capital is the internet.","ex":[{"tag":"network","es":"No hay red en este cuarto.","en":"There's no signal in this room."},{"tag":"net","es":"La pelota pasó por encima de la red.","en":"The ball went over the net."}]},{"es":"el correo","pos":"n.m.","en":"email; post, mail","he":"אימייל / דואר","note":"el correo electrónico in full; everyone says el correo. la oficina de correos is the post office.","ex":[{"tag":"email","es":"Te mandé un correo ayer.","en":"I sent you an email yesterday."},{"tag":"post","es":"Llegó por correo esta mañana.","en":"It came in the post this morning."}]},{"es":"el enlace","pos":"n.m.","en":"link","note":"el vínculo is the formal word. Many people just say el link.","ex":[{"es":"Haz clic en el enlace.","en":"Click on the link."}]},{"es":"descargar","pos":"v.","en":"to download; to unload","note":"bajar does the job too — see unit 22.","ex":[{"tag":"download","es":"Descargué la película anoche.","en":"I downloaded the film last night."},{"tag":"unload","es":"Están descargando el camión.","en":"They're unloading the lorry."}]},{"es":"subir","pos":"v.","en":"to upload","note":"Same verb as to go up — see unit 22. Context decides.","ex":[{"es":"Subió las fotos a la nube.","en":"She uploaded the photos to the cloud."}]},{"es":"el usuario","pos":"n.m.","en":"user; username","ex":[{"tag":"user","es":"El sistema tiene mil usuarios.","en":"The system has a thousand users."},{"tag":"username","es":"Escribe tu usuario y contraseña.","en":"Type your username and password."}]},{"es":"la aplicación","pos":"n.f.","en":"app, application","note":"Often shortened to la app, pronounced as in English.","ex":[{"es":"Esa aplicación gasta mucha batería.","en":"That app uses a lot of battery."}]},{"es":"la batería","pos":"n.f.","en":"battery; drums","he":"סוללה / תופים","note":"la pila is a small battery, the AA kind.","ex":[{"tag":"battery","es":"Se me acabó la batería.","en":"My battery died."},{"tag":"drums","es":"Toca la batería en un grupo.","en":"He plays drums in a band."}]},{"es":"cargar","pos":"v.","en":"to charge; to carry, to load","he":"לטעון / לסחוב","note":"el cargador is the charger.","ex":[{"tag":"charge","es":"Necesito cargar el celular.","en":"I need to charge my phone."},{"tag":"carry","es":"Cargó las bolsas hasta el carro.","en":"He carried the bags to the car."}]},{"es":"funcionar","pos":"v.","en":"to work, to function","note":"Used of machines, never of people. For people, trabajar.","ex":[{"es":"El control no funciona.","en":"The remote doesn't work."}]},{"es":"prender · apagar","pos":"v. irr.","en":"to switch on; to switch off","note":"prender is the Latin American everyday word for on; encender is standard everywhere.","ex":[{"tag":"on","es":"Prende la computadora.","en":"Switch the computer on."},{"tag":"off","es":"Apaga el teléfono en el cine.","en":"Switch your phone off in the cinema."}]},{"es":"la foto","pos":"n.f.","en":"photo","note":"Short for la fotografía, and feminine even though it ends in -o. tomar or sacar una foto is to take a photo.","ex":[{"es":"¿Nos tomas una foto?","en":"Would you take a photo of us?"}]}]},{"id":"u28","title":"Giving, taking and holding","intro":"A cluster of high-frequency verbs that English keeps apart but Spanish distributes differently. Note especially poner versus meter, and dejar, which covers leaving, letting and stopping.","entries":[{"es":"dejar","pos":"v.","en":"to leave (behind); to let, to allow; to stop doing","he":"להשאיר / לתת / להפסיק","note":"dejar de + infinitive is to stop doing something: dejé de fumar.","ex":[{"tag":"leave behind","es":"Dejé las llaves en la mesa.","en":"I left the keys on the table."},{"tag":"allow","es":"No me dejan entrar.","en":"They won't let me in."},{"tag":"stop doing","es":"Dejó de llover a las cinco.","en":"It stopped raining at five."}]},{"es":"meter","pos":"v.","en":"to put in, to insert","note":"poner is to place on a surface; meter is to put inside something.","ex":[{"es":"Metió la ropa en la maleta.","en":"He put the clothes in the suitcase."}]},{"es":"sacar","pos":"v.","en":"to take out; to get, to obtain","he":"להוציא / להשיג","note":"sacar una foto is to take a photo; sacar buena nota to get a good mark.","ex":[{"tag":"take out","es":"Saca la basura, por favor.","en":"Take the rubbish out, please."},{"tag":"obtain","es":"Sacó el pasaporte en una semana.","en":"He got his passp
