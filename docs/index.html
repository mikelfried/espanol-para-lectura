<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f6f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141619" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Español">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Español</title>
<style>
:root{
  --bg:#f7f6f2; --card:#fff; --ink:#1f2328; --dim:#626973; --faint:#9aa1aa;
  --line:#e4e1da; --line2:#d4d0c7;
  --g:#2f8a5f; --gd:#236a48; --gl:#e2f3e9; --gt:#1c5c3d;
  --r:#d0473f; --rd:#a8352e; --rl:#fbe7e5; --rt:#8c2a24;
  --b:#3a7cc2; --bl:#e7f0fa;
  --fl:#ef8a2c;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;
  --serif:"Iowan Old Style",Charter,Georgia,serif;
  --tab:calc(58px + env(safe-area-inset-bottom));
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141619; --card:#1e2125; --ink:#eceae6; --dim:#a4abb4; --faint:#6f7780;
  --line:#2c3035; --line2:#3a3f45;
  --g:#3fa673; --gd:#2c7a53; --gl:#17301f; --gt:#8fd9ae;
  --r:#e0605a; --rd:#b0433e; --rl:#3a1c1b; --rt:#f3a7a2;
  --b:#5a9ae0; --bl:#1b2a3b;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 var(--round);
  padding-bottom:var(--tab)}
button{font:inherit;color:inherit}
svg.i{width:24px;height:24px;display:block}
.hide{display:none!important}

/* ---------- chunky buttons ------------------------------------------ */
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px 18px;
  font-size:17px;font-weight:700;letter-spacing:.2px;text-align:center;
  background:var(--g);color:#fff;box-shadow:0 4px 0 var(--gd);
  transform:translateY(0);transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--gd)}
.btn.ghost{background:var(--card);color:var(--ink);
  box-shadow:0 4px 0 var(--line2);border:2px solid var(--line2)}
.btn.ghost:active{box-shadow:0 0 0 var(--line2)}
.btn.red{background:var(--r);box-shadow:0 4px 0 var(--rd)}
.btn:disabled{background:var(--line);color:var(--faint);box-shadow:0 4px 0 var(--line2)}

/* ---------- top bar --------------------------------------------------- */
.top{position:sticky;top:0;z-index:20;background:var(--bg);
  padding:calc(env(safe-area-inset-top) + 10px) 18px 10px;
  display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--line)}
.top h1{margin:0;flex:1;font-size:21px;font-weight:800;letter-spacing:-.2px}
.chip{display:flex;align-items:center;gap:5px;font-weight:800;font-size:16px}
.chip .i{width:22px;height:22px}
.chip.fl{color:var(--fl)} .chip.off{color:var(--faint)}
.goal{position:relative;width:34px;height:34px}
.goal svg{width:34px;height:34px;transform:rotate(-90deg)}
.goal b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:800;color:var(--dim)}
.iconbtn{border:0;background:none;padding:8px;margin:-8px;color:var(--dim)}
main{padding:18px 18px 28px}

/* ---------- learn path ------------------------------------------------ */
.readfirst{display:flex;gap:14px;align-items:center;background:var(--card);
  border:2px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:26px;
  box-shadow:0 3px 0 var(--line);width:100%;text-align:left}
.readfirst .i{color:var(--b);width:30px;height:30px;flex:none}
.readfirst b{display:block;font-size:16px}
.readfirst span{color:var(--dim);font-size:14px}
.path{position:relative;display:flex;flex-direction:column;align-items:center;gap:44px;
  padding-bottom:10px}
.node{position:relative;display:flex;flex-direction:column;align-items:center;
  background:none;border:0;padding:0;width:170px}
.ring{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;position:relative}
.disc{width:66px;height:66px;border-radius:50%;background:var(--card);
  border:2px solid var(--line2);box-shadow:0 5px 0 var(--line2);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:800;color:var(--dim);transition:transform .06s,box-shadow .06s}
.node:active .disc{transform:translateY(5px);box-shadow:0 0 0 var(--line2)}
.node.done .disc{background:var(--g);border-color:var(--gd);color:#fff;box-shadow:0 5px 0 var(--gd)}
.node.now .disc{background:var(--g);border-color:var(--gd);color:#fff;box-shadow:0 5px 0 var(--gd)}
.node.now .ring::after{content:"";position:absolute;inset:-6px;border-radius:50%;
  border:3px solid var(--g);opacity:.35}
.node .nl{margin-top:8px;font-size:14px;font-weight:700;text-align:center;line-height:1.25}
.node .ns{font-size:12px;color:var(--faint);font-weight:600}
.startflag{position:absolute;top:-30px;background:var(--card);color:var(--g);
  border:2px solid var(--line2);border-radius:10px;padding:3px 10px;font-size:12px;
  font-weight:800;letter-spacing:.8px;text-transform:uppercase;white-space:nowrap}
.startflag::after{content:"";position:absolute;left:50%;bottom:-7px;width:10px;height:10px;
  background:var(--card);border-right:2px solid var(--line2);border-bottom:2px solid var(--line2);
  transform:translateX(-50%) rotate(45deg)}

/* ---------- bottom sheet --------------------------------------------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:40;opacity:0;
  pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);
  border-radius:22px 22px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom) + 22px);
  transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 14px}
.sheet .k{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--faint);font-weight:800}
.sheet h2{margin:2px 0 6px;font-size:23px;font-weight:800;letter-spacing:-.3px}
.sheet p{margin:0 0 14px;color:var(--dim);font-size:15px}
.bar{height:12px;border-radius:6px;background:var(--line);overflow:hidden;margin:4px 0 6px}
.bar i{display:block;height:100%;background:var(--g);border-radius:6px}
.sheet .row{display:flex;flex-direction:column;gap:12px;margin-top:18px}

/* ---------- reading lists -------------------------------------------- */
.lead{color:var(--dim);font-size:15px;margin:0 0 16px}
.e{background:var(--card);border:2px solid var(--line);border-radius:16px;
  padding:13px 15px;margin-bottom:10px}
.eh{font-family:var(--serif);font-size:21px;font-weight:600}
.pos{font:600 12px var(--round);color:var(--faint);margin-left:7px}
.gl{margin:1px 0 0;font-size:16px}
.he{margin:2px 0 0;color:var(--dim);font-size:16px}
.note{margin:7px 0 0;font-size:14px;color:var(--dim)}
.conj{margin:9px 0 0;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:14px;
  background:var(--bg);border-radius:10px;padding:8px 10px}
.conj span{white-space:nowrap} .conj i{font-style:normal;color:var(--faint);font-size:12px;margin-right:3px}
.warn{margin:9px 0 0;font-size:14px;background:var(--rl);color:var(--rt);
  border-radius:12px;padding:9px 11px}
.warn b{display:block;font-size:11px;letter-spacing:1px;text-transform:uppercase;margin-bottom:2px}
.ex{margin:9px 0 0}
.ex .tag{display:inline-block;font-size:11px;font-weight:800;color:var(--faint);
  text-transform:uppercase;letter-spacing:.6px;margin-bottom:1px}
.ex .s{display:block;font-family:var(--serif);font-size:17px}
.ex .t{display:block;color:var(--dim);font-size:14.5px}
.hidden .gl,.hidden .he,.hidden .ex .t{filter:blur(6px);transition:filter .15s}
.hidden .e:active .gl,.hidden .e:active .he,.hidden .e:active .ex .t{filter:none}
.seg{display:inline-flex;background:var(--line);border-radius:12px;padding:3px;margin:0 0 16px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:9px;font-size:14px;font-weight:700;color:var(--dim)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.sect{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--faint);font-weight:800;margin:22px 0 8px}
.cog{list-style:none;margin:0;padding:0;columns:2;column-gap:14px;font-size:15px}
.cog li{margin-bottom:4px;break-inside:avoid} .cog b{font-family:var(--serif);font-weight:600}
.cog span{color:var(--dim);font-size:13px}

/* ---------- search ---------------------------------------------------- */
.sbox{position:relative;margin-bottom:14px}
.sbox .i{position:absolute;left:13px;top:13px;color:var(--faint);width:22px;height:22px}
#q{width:100%;font:17px var(--round);padding:12px 14px 12px 44px;border-radius:14px;
  border:2px solid var(--line2);background:var(--card);color:var(--ink);-webkit-appearance:none}
#q:focus{outline:0;border-color:var(--b)}
.empty{text-align:center;color:var(--faint);padding:40px 10px;font-size:15px}

/* ---------- plates ---------------------------------------------------- */
.plate{margin-bottom:28px}
.plate h2{font-size:18px;font-weight:800;margin:0 0 10px}
.pfig{background:#fff;border:2px solid var(--line);border-radius:16px;padding:8px;
  overflow-x:auto;-webkit-overflow-scrolling:touch}
.pfig svg{width:100%;height:auto;display:block}
.pfig.zoom svg{width:820px;max-width:none}
.pfig.nolab .lab{visibility:hidden}
.ptools{display:flex;gap:8px;margin:10px 0}
.pill{border:2px solid var(--line2);background:var(--card);border-radius:999px;
  padding:6px 13px;font-size:14px;font-weight:700;color:var(--dim)}
.pill.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* ---------- review hub ------------------------------------------------ */
.hero{background:var(--card);border:2px solid var(--line);border-radius:22px;
  padding:22px 20px;text-align:center;margin-bottom:18px}
.hero .big{font-size:52px;font-weight:800;line-height:1;letter-spacing:-1px}
.hero .cap{color:var(--dim);font-size:15px;margin:6px 0 18px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:800}
.stat span{font-size:12px;color:var(--faint);font-weight:700}
.tiny{font-size:13px;color:var(--faint);text-align:center;margin:18px 0 10px}
.linkrow{display:flex;gap:10px}
.linkrow .btn{font-size:15px;padding:12px}

/* ---------- tab bar --------------------------------------------------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--bg);
  border-top:2px solid var(--line);padding:6px 6px env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;
  gap:2px;padding:4px 0 6px;color:var(--faint);font-size:11px;font-weight:700;border-radius:12px}
nav button .i{width:26px;height:26px}
nav button.on{color:var(--g)}
.badge{position:absolute;margin:-4px 0 0 20px;background:var(--r);color:#fff;border-radius:9px;
  font-size:10px;font-weight:800;padding:1px 5px;min-width:17px}

/* ---------- lesson ---------------------------------------------------- */
#lesson{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top)}
.lh{display:flex;align-items:center;gap:14px;padding:12px 18px}
.lh .iconbtn{margin:0;padding:6px}
.lbar{flex:1;height:16px;border-radius:8px;background:var(--line);overflow:hidden}
.lbar i{display:block;height:100%;background:var(--g);border-radius:8px;
  transition:width .35s cubic-bezier(.2,.8,.2,1);box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.lbody{flex:1;overflow-y:auto;padding:10px 20px 20px}
.kind{font-size:13px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--b);margin:6px 0 10px}
.q{font-size:26px;font-weight:800;line-height:1.2;letter-spacing:-.3px;margin:0 0 22px}
.q.es{font-family:var(--serif);font-weight:600;font-size:34px;letter-spacing:0}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{border:2px solid var(--line2);background:var(--card);border-radius:16px;padding:14px 16px;
  text-align:left;font-size:17px;font-weight:600;box-shadow:0 4px 0 var(--line2);
  transition:transform .06s,box-shadow .06s;display:flex;gap:12px;align-items:center}
.opt:active{transform:translateY(4px);box-shadow:0 0 0 var(--line2)}
.opt .n{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line2);
  display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--faint);font-weight:800}
.opt.es{font-family:var(--serif);font-size:20px}
.opt.sel{border-color:var(--b);background:var(--bl);box-shadow:0 4px 0 var(--b)}
.opt.sel .n{border-color:var(--b);color:var(--b)}
.opt.ok{border-color:var(--g);background:var(--gl);box-shadow:0 4px 0 var(--g)}
.opt.bad{border-color:var(--r);background:var(--rl);box-shadow:0 4px 0 var(--r)}
.opt[disabled]{pointer-events:none}
.meet{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:22px 20px;text-align:center}
.meet .new{display:inline-block;background:var(--bl);color:var(--b);font-size:12px;font-weight:800;
  letter-spacing:1px;text-transform:uppercase;border-radius:8px;padding:3px 9px;margin-bottom:12px}
.meet .w{font-family:var(--serif);font-size:38px;font-weight:600;line-height:1.1}
.meet .p{color:var(--faint);font-size:13px;font-weight:700;margin-top:4px}
.meet .m{font-size:19px;font-weight:700;margin-top:14px}
.meet .h{color:var(--dim);font-size:17px;margin-top:3px}
.meet .x{margin-top:16px;padding-top:14px;border-top:2px solid var(--line);text-align:left}
.meet .x .s{font-family:var(--serif);font-size:18px}
.meet .x .t{color:var(--dim);font-size:15px}
.meet .warn{text-align:left}
.meet .conj{justify-content:center}
.type{width:100%;font:22px var(--serif);padding:14px 16px;border-radius:16px;border:2px solid var(--line2);
  background:var(--card);color:var(--ink);-webkit-appearance:none}
.type:focus{outline:0;border-color:var(--b)}
.hint{color:var(--faint);font-size:14px;margin-top:10px}
.lfoot{padding:14px 20px calc(env(safe-area-inset-bottom) + 16px);border-top:2px solid var(--line);background:var(--bg)}
.lfoot.ok{background:var(--gl);border-color:transparent}
.lfoot.bad{background:var(--rl);border-color:transparent}
.fb{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.fb .dot{flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff}
.fb .dot .i{width:20px;height:20px}
.lfoot.ok .dot{background:var(--g)} .lfoot.bad .dot{background:var(--r)}
.fb b{display:block;font-size:19px;font-weight:800}
.lfoot.ok .fb b{color:var(--gt)} .lfoot.bad .fb b{color:var(--rt)}
.fb span{display:block;font-size:15px}
.lfoot.ok .fb span{color:var(--gt)} .lfoot.bad .fb span{color:var(--rt)}
.fb .ans{font-family:var(--serif);font-size:18px;font-weight:600}
.done{text-align:center;padding-top:30px}
.done .medal{width:112px;height:112px;border-radius:50%;background:var(--gl);color:var(--g);
  margin:0 auto 18px;display:flex;align-items:center;justify-content:center;border:4px solid var(--g)}
.done .medal .i{width:56px;height:56px}
.done h2{font-size:28px;font-weight:800;margin:0 0 6px;letter-spacing:-.4px}
.done p{color:var(--dim);margin:0 0 24px}
.pop{animation:pop .28s cubic-bezier(.2,.8,.3,1.4)}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.shake{animation:shake .32s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="app"></div><nav></nav>
<div id="scrim" class="scrim"></div><div id="sheet" class="sheet"></div>
<div id="lesson" class="hide"></div>
<script>window.__DATA__={"units":[{"id":"u01","title":"The engine verbs","intro":"Twenty verbs that carry most Spanish sentences. Nearly all are irregular, which is exactly why they are worth memorising as forms rather than as rules. Where a verb has several meanings, each one gets its own sentence, labelled.","entries":[{"es":"ser","pos":"v. irr.","en":"to be — identity, origin, essence, time","he":"להיות (מהות קבועה)","note":"What something fundamentally is. Pairs with nouns, professions, nationalities and the clock.","conj":{"label":"pres.","forms":["soy","eres","es","somos","son"]},"ex":[{"tag":"identity","es":"Mi hermana es médica.","en":"My sister is a doctor."},{"tag":"origin","es":"Soy de Israel.","en":"I'm from Israel."},{"tag":"clock","es":"Ya son las diez.","en":"It's ten o'clock already."}]},{"es":"estar","pos":"v. irr.","en":"to be — location, condition, mood","he":"להיות (מצב או מיקום)","note":"Where something is and how it is right now. A condition that could change tomorrow takes estar.","conj":{"label":"pres.","forms":["estoy","estás","está","estamos","están"]},"ex":[{"tag":"location","es":"¿Dónde estás?","en":"Where are you?"},{"tag":"condition","es":"El café está frío.","en":"The coffee is cold."}]},{"es":"haber","pos":"v. irr.","en":"there is, there are; to have (helper verb)","he":"יש / קיים","note":"As hay it never changes for plural. As he/has/ha it builds the perfect tense.","conj":{"label":"pres.","forms":["he","has","ha · hay","hemos","han"]},"ex":[{"tag":"there is","es":"Hay mucha gente en la calle.","en":"There are a lot of people in the street."},{"tag":"helper","es":"No he comido todavía.","en":"I haven't eaten yet."}]},{"es":"tener","pos":"v. irr.","en":"to have, to own; to be (age, hunger, cold)","note":"Spanish uses tener where English uses be for bodily states.","conj":{"label":"pres.","forms":["tengo","tienes","tiene","tenemos","tienen"]},"ex":[{"tag":"own","es":"Tengo dos hermanos.","en":"I have two brothers."},{"tag":"state","es":"¿Cuántos años tienes?","en":"How old are you?"},{"tag":"state","es":"Tenemos hambre.","en":"We're hungry."}]},{"es":"hacer","pos":"v. irr.","en":"to do; to make; (weather) to be","he":"לעשות / לייצר","conj":{"label":"pres.","forms":["hago","haces","hace","hacemos","hacen"]},"ex":[{"tag":"do","es":"¿Qué haces el domingo?","en":"What are you doing on Sunday?"},{"tag":"make","es":"Mi abuela hace un pan excelente.","en":"My grandmother makes excellent bread."},{"tag":"weather","es":"Hace mucho calor hoy.","en":"It's very hot today."}]},{"es":"ir","pos":"v. irr.","en":"to go","note":"ir a + infinitive is the everyday future: voy a llamar = I'm going to call.","conj":{"label":"pres.","forms":["voy","vas","va","vamos","van"]},"ex":[{"es":"Vamos al mercado temprano.","en":"We go to the market early."},{"es":"Voy a llamarte esta noche.","en":"I'm going to call you tonight."}]},{"es":"venir","pos":"v. irr.","en":"to come","conj":{"label":"pres.","forms":["vengo","vienes","viene","venimos","vienen"]},"ex":[{"es":"¿Vienes con nosotros?","en":"Are you coming with us?"},{"es":"El tren viene lleno.","en":"The train is coming in full."}]},{"es":"poder","pos":"v. irr.","en":"to be able to, can; may, to be allowed","he":"יכול","conj":{"label":"pres.","forms":["puedo","puedes","puede","podemos","pueden"]},"ex":[{"tag":"ability","es":"No puedo ir mañana.","en":"I can't go tomorrow."},{"tag":"permission","es":"¿Puedo pasar?","en":"May I come in?"}]},{"es":"querer","pos":"v. irr.","en":"to want; to love (a person)","he":"לרצות / לאהוב","note":"Te quiero is what you say to family, friends and partners. Te amo is heavier and rarer.","conj":{"label":"pres.","forms":["quiero","quieres","quiere","queremos","quieren"]},"ex":[{"tag":"want","es":"Quiero un café sin azúcar.","en":"I want a coffee without sugar."},{"tag":"love","es":"Te quiero mucho.","en":"I love you very much."}]},{"es":"saber","pos":"v. irr.","en":"to know (a fact); to know how to; to taste (of)","he":"לדעת / לטעום כמו","note":"Facts and skills. Compare conocer, which is knowing by acquaintance.","conj":{"label":"pres.","forms":["sé","sabes","sabe","sabemos","saben"]},"ex":[{"tag":"fact","es":"No sé su apellido.","en":"I don't know his last name."},{"tag":"skill","es":"Ella sabe manejar.","en":"She knows how to drive."},{"tag":"taste","es":"Esta sopa sabe a limón.","en":"This soup tastes of lemon."}]},{"es":"conocer","pos":"v. irr.","en":"to know (a person, a place); to meet for the first time","he":"להכיר","note":"You conoces a city; you sabes its population.","conj":{"label":"pres.","forms":["conozco","conoces","conoce","conocemos","conocen"]},"ex":[{"tag":"be familiar","es":"¿Conoces a mi vecina?","en":"Do you know my neighbour?"},{"tag":"meet","es":"Nos conocimos en Lima.","en":"We met in Lima."}]},{"es":"decir","pos":"v. irr.","en":"to say, to tell","conj":{"label":"pres.","forms":["digo","dices","dice","decimos","dicen"]},"ex":[{"es":"Dime la verdad.","en":"Tell me the truth."},{"es":"Dicen que va a llover.","en":"They say it's going to rain."}]},{"es":"ver","pos":"v. irr.","en":"to see; to watch","note":"Nos vemos — literally we see each other — is the standard see you later.","conj":{"label":"pres.","forms":["veo","ves","ve","vemos","ven"]},"ex":[{"tag":"see","es":"Desde aquí se ve el mar.","en":"You can see the sea from here."},{"tag":"watch","es":"Vemos una película los viernes.","en":"We watch a film on Fridays."}]},{"es":"dar","pos":"v. irr.","en":"to give; to face, to look onto","conj":{"label":"pres.","forms":["doy","das","da","damos","dan"]},"ex":[{"tag":"give","es":"Dame un minuto.","en":"Give me a minute."},{"tag":"face","es":"La ventana da al patio.","en":"The window looks onto the courtyard."}]},{"es":"poner","pos":"v. irr.","en":"to put, to place; to turn on; (ponerse) to put on, to become","conj":{"label":"pres.","forms":["pongo","pones","pone","ponemos","ponen"]},"ex":[{"tag":"place","es":"Pon el plato en la mesa.","en":"Put the plate on the table."},{"tag":"turn on","es":"Pon música, por favor.","en":"Put some music on, please."},{"tag":"ponerse","es":"Se puso el abrigo y salió.","en":"He put on his coat and left."},{"tag":"ponerse","es":"Se puso nervioso antes del examen.","en":"He got nervous before the exam."}]},{"es":"deber","pos":"v.","en":"must, ought to; to owe","he":"חייב / חב","note":"debe = must. debe de = probably. One preposition separates obligation from guesswork.","ex":[{"tag":"must","es":"Debes descansar.","en":"You must rest."},{"tag":"owe","es":"Me debe cincuenta pesos.","en":"He owes me fifty pesos."}]},{"es":"llevar","pos":"v.","en":"to carry, to take along; to wear; to have spent (time)","he":"לשאת / ללבוש / להיות כבר (זמן)","ex":[{"tag":"carry","es":"Lleva los libros a la oficina.","en":"Take the books to the office."},{"tag":"wear","es":"Lleva una camisa azul.","en":"He's wearing a blue shirt."},{"tag":"duration","es":"Llevo tres años aquí.","en":"I've been here three years."}]},{"es":"llegar","pos":"v.","en":"to arrive; to reach; to manage to","ex":[{"tag":"arrive","es":"El vuelo llega a las seis.","en":"The flight arrives at six."},{"tag":"reach","es":"El agua llegó hasta la puerta.","en":"The water reached the door."},{"tag":"manage to","es":"Nunca llegué a conocerlo.","en":"I never got to know him."}]},{"es":"volver","pos":"v. irr.","en":"to return, to go back; volver a + inf., to do again","conj":{"label":"pres.","forms":["vuelvo","vuelves","vuelve","volvemos","vuelven"]},"ex":[{"tag":"return","es":"Vuelvo en cinco minutos.","en":"I'll be back in five minutes."},{"tag":"again","es":"No vuelvas a hacer eso.","en":"Don't do that again."}]},{"es":"quedar","pos":"v.","en":"to remain, to be left; to arrange to meet; (quedarse) to stay","he":"להישאר / לקבוע פגישה","ex":[{"tag":"be left","es":"Sólo queda un boleto.","en":"There's only one ticket left."},{"tag":"arrange","es":"Quedamos en vernos el jueves.","en":"We agreed to meet on Thursday."},{"tag":"quedarse","es":"Me quedé en casa todo el día.","en":"I stayed home all day."}]}]},{"id":"u02","title":"What people do all day","intro":"Ordinary actions. Most are regular; the ones whose stem changes under stress are marked irr. and given their forms.","entries":[{"es":"hablar","pos":"v.","en":"to speak, to talk","ex":[{"es":"Hablo un poco de español.","en":"I speak a little Spanish."},{"es":"Habla más despacio, por favor.","en":"Speak more slowly, please."}]},{"es":"comer","pos":"v.","en":"to eat; to have lunch","note":"In much of Latin America comer on its own implies the midday meal.","ex":[{"tag":"eat","es":"¿Ya comiste?","en":"Have you eaten yet?"},{"tag":"lunch","es":"Comemos a las dos los domingos.","en":"We have lunch at two on Sundays."}]},{"es":"tomar","pos":"v.","en":"to take; to drink","he":"לקחת / לשתות","note":"In Latin America tomar is the default verb for drinking, ahead of beber.","ex":[{"tag":"take","es":"Toma el primer autobús.","en":"Take the first bus."},{"tag":"drink","es":"Tomo café por la mañana.","en":"I drink coffee in the morning."}]},{"es":"vivir","pos":"v.","en":"to live, to be alive; to reside","ex":[{"tag":"be alive","es":"Vivió noventa años.","en":"She lived ninety years."},{"tag":"reside","es":"Vivimos cerca del río.","en":"We live near the river."}]},{"es":"trabajar","pos":"v.","en":"to work","ex":[{"es":"Trabaja desde su casa.","en":"He works from home."},{"es":"¿En qué trabajas?","en":"What do you do for a living?"}]},{"es":"estudiar","pos":"v.","en":"to study","ex":[{"es":"Estudio de noche porque hay silencio.","en":"I study at night because it's quiet."}]},{"es":"leer","pos":"v.","en":"to read","ex":[{"es":"Leí el artículo dos veces.","en":"I read the article twice."},{"es":"Léelo en voz alta.","en":"Read it out loud."}]},{"es":"escribir","pos":"v.","en":"to write","note":"Irregular past participle: escrito.","ex":[{"es":"Escríbeme cuando llegues.","en":"Write to me when you arrive."}]},{"es":"escuchar","pos":"v.","en":"to listen to","he":"להקשיב","note":"Deliberate listening. oír is the passive hearing that happens to you.","ex":[{"es":"Escucha, esto es importante.","en":"Listen, this is important."}]},{"es":"mirar","pos":"v.","en":"to look at, to watch","he":"להביט","note":"Directed looking, where ver is undirected seeing.","ex":[{"es":"Mira el cielo, está rojo.","en":"Look at the sky, it's red."}]},{"es":"buscar","pos":"v.","en":"to look for; to pick up (a person)","note":"Never followed by por. Busco las llaves, not busco por las llaves.","ex":[{"tag":"look for","es":"Estoy buscando trabajo.","en":"I'm looking for work."},{"tag":"pick up","es":"Paso a buscarte a las siete.","en":"I'll come pick you up at seven."}]},{"es":"encontrar","pos":"v. irr.","en":"to find; (encontrarse) to run into; to feel","conj":{"label":"pres.","forms":["encuentro","encuentras","encuentra","encontramos","encuentran"]},"ex":[{"tag":"find","es":"No encuentro mi celular.","en":"I can't find my phone."},{"tag":"run into","es":"Me encontré con Pablo en el banco.","en":"I ran into Pablo at the bank."},{"tag":"feel","es":"¿Cómo te encuentras hoy?","en":"How are you feeling today?"}]},{"es":"pensar","pos":"v. irr.","en":"to think, to ponder; to intend to","note":"pensar en = to think about something. pensar que = to hold an opinion.","conj":{"label":"pres.","forms":["pienso","piensas","piensa","pensamos","piensan"]},"ex":[{"tag":"ponder","es":"¿En qué piensas?","en":"What are you thinking about?"},{"tag":"intend","es":"Pensamos salir temprano.","en":"We plan to leave early."}]},{"es":"creer","pos":"v.","en":"to believe; to think (hold an opinion)","ex":[{"tag":"believe","es":"No lo creo.","en":"I don't believe it."},{"tag":"opinion","es":"Creo que es una buena idea.","en":"I think it's a good idea."}]},{"es":"sentir","pos":"v. irr.","en":"to feel; to be sorry, to regret","he":"להרגיש / להצטער","note":"Lo siento literally means I feel it — the ordinary apology.","conj":{"label":"pres.","forms":["siento","sientes","siente","sentimos","sienten"]},"ex":[{"tag":"feel","es":"Me siento mucho mejor hoy.","en":"I feel much better today."},{"tag":"regret","es":"Siento llegar tarde.","en":"I'm sorry for arriving late."}]},{"es":"empezar","pos":"v. irr.","en":"to begin, to start","note":"empezar a + infinitive. The synonym comenzar behaves identically.","conj":{"label":"pres.","forms":["empiezo","empiezas","empieza","empezamos","empiezan"]},"ex":[{"es":"La película empieza a las nueve.","en":"The film starts at nine."},{"es":"Empezó a llover de repente.","en":"It suddenly started to rain."}]},{"es":"terminar","pos":"v.","en":"to finish, to end","ex":[{"es":"Termina el informe y descansa.","en":"Finish the report and rest."},{"es":"La reunión terminó tarde.","en":"The meeting ended late."}]},{"es":"esperar","pos":"v.","en":"to wait; to hope; to expect","he":"לחכות / לקוות","note":"Three meanings English keeps apart and Spanish does not. Only context separates them.","ex":[{"tag":"wait","es":"Espérame afuera.","en":"Wait for me outside."},{"tag":"hope","es":"Espero que estés bien.","en":"I hope you're well."},{"tag":"expect","es":"Esperamos unos veinte invitados.","en":"We're expecting about twenty guests."}]},{"es":"pedir","pos":"v. irr.","en":"to ask for, to request; to order (food)","he":"לבקש","conj":{"label":"pres.","forms":["pido","pides","pide","pedimos","piden"]},"ex":[{"tag":"request","es":"Pidió ayuda a su hermano.","en":"She asked her brother for help."},{"tag":"order","es":"Pedimos dos tacos y una limonada.","en":"We ordered two tacos and a lemonade."}]},{"es":"coger","pos":"v.","en":"to take, to grab, to catch","he":"לתפוס / לקחת","warn":"In Mexico, Argentina, Uruguay and much of Latin America this is crude slang for having sex. Neutral in Spain, where it is the ordinary word for catching a bus. Use tomar or agarrar instead and you are safe everywhere.","ex":[{"es":"En España cogen el metro; en México toman el metro.","en":"In Spain they take the metro; in Mexico they take the metro."}]},{"es":"preguntar","pos":"v.","en":"to ask (a question)","he":"לשאול","note":"You preguntas a question and pides a thing — the same split Hebrew makes between לשאול and לבקש.","ex":[{"es":"Me preguntó dónde vivías.","en":"He asked me where you lived."}]}]},{"id":"u03","title":"People and family","intro":"Nouns appear with their article because the article is part of the word. Where a word has a matching feminine form it is shown after a slash.","entries":[{"es":"la gente","pos":"n.f.","en":"people","he":"אנשים","note":"Singular in Spanish, plural in English. La gente dice, never la gente dicen.","ex":[{"es":"Hay poca gente en el museo.","en":"There are few people in the museum."}]},{"es":"la persona","pos":"n.f.","en":"person","note":"Always feminine, even for a man: Juan es una persona seria.","ex":[{"es":"Es la única persona que me entiende.","en":"She's the only person who understands me."}]},{"es":"el hombre","pos":"n.m.","en":"man","ex":[{"es":"Un hombre mayor abrió la puerta.","en":"An older man opened the door."}]},{"es":"la mujer","pos":"n.f.","en":"woman; wife","he":"אישה / רעיה","ex":[{"tag":"woman","es":"Esa mujer dirige la empresa.","en":"That woman runs the company."},{"tag":"wife","es":"Vino con su mujer.","en":"He came with his wife."}]},{"es":"el niño / la niña","pos":"n.","en":"child, boy / girl","ex":[{"es":"Los niños juegan en el patio.","en":"The children are playing in the yard."}]},{"es":"la familia","pos":"n.f.","en":"family","ex":[{"es":"Toda la familia vino a la cena.","en":"The whole family came to the dinner."}]},{"es":"el padre","pos":"n.m.","en":"father; (pl.) parents","he":"אב / הורים","note":"los padres means parents, not fathers. The same trick applies to los hijos and los hermanos.","ex":[{"tag":"father","es":"Su padre nació en Córdoba.","en":"His father was born in Córdoba."},{"tag":"parents","es":"Mis padres viven en Haifa.","en":"My parents live in Haifa."}]},{"es":"la madre","pos":"n.f.","en":"mother","ex":[{"es":"Su madre es maestra.","en":"His mother is a teacher."}]},{"es":"el hijo / la hija","pos":"n.","en":"son, daughter; (pl.) children","ex":[{"tag":"son","es":"Su hijo mayor estudia en Chile.","en":"Their eldest son studies in Chile."},{"tag":"children","es":"Tienen tres hijos.","en":"They have three children."}]},{"es":"el hermano / la hermana","pos":"n.","en":"brother / sister","ex":[{"es":"Mi hermana menor estudia medicina.","en":"My younger sister studies medicine."}]},{"es":"el abuelo / la abuela","pos":"n.","en":"grandfather / grandmother","ex":[{"es":"Mi abuela cocina mejor que nadie.","en":"My grandmother cooks better than anyone."}]},{"es":"el esposo / la esposa","pos":"n.","en":"husband / wife","ex":[{"es":"Su esposo trabaja en el hospital.","en":"Her husband works at the hospital."}]},{"es":"la pareja","pos":"n.f.","en":"partner; couple","he":"בן/בת זוג / זוג","note":"Feminine regardless of the partner's gender: mi pareja es ingeniero.","ex":[{"tag":"partner","es":"Vino con su pareja a la fiesta.","en":"She came to the party with her partner."},{"tag":"couple","es":"Es una pareja muy tranquila.","en":"They're a very easy-going couple."}]},{"es":"el amigo / la amiga","pos":"n.","en":"friend","ex":[{"es":"Es un amigo de la universidad.","en":"He's a friend from university."}]},{"es":"el compañero / la compañera","pos":"n.","en":"colleague, classmate, companion","he":"עמית / חבר לעבודה או ללימודים","ex":[{"es":"Mis compañeros de trabajo son amables.","en":"My co-workers are kind."}]},{"es":"el señor","pos":"n.m.","en":"gentleman, man; Mr, sir","note":"Before a name it takes the article: el señor García llamó. Speaking to him directly, it drops: buenos días, señor García.","ex":[{"tag":"man","es":"Un señor mayor preguntó por ti.","en":"An older man asked for you."},{"tag":"sir","es":"Disculpe, señor, ¿tiene hora?","en":"Excuse me, sir, do you have the time?"}]},{"es":"la señora","pos":"n.f.","en":"lady, woman; Mrs, madam","ex":[{"tag":"woman","es":"La señora de la tienda me ayudó.","en":"The woman from the shop helped me."},{"tag":"madam","es":"Pase usted, señora.","en":"Do come in, madam."}]},{"es":"el vecino / la vecina","pos":"n.","en":"neighbour","ex":[{"es":"Los vecinos hacen mucho ruido.","en":"The neighbours make a lot of noise."}]},{"es":"el jefe / la jefa","pos":"n.","en":"boss, head, chief","ex":[{"es":"Habla con tu jefa antes de decidir.","en":"Talk to your boss before deciding."}]},{"es":"el nombre","pos":"n.m.","en":"name, first name","he":"שם","note":"A family name is el apellido — a separate word, not a compound like English last name.","ex":[{"es":"No recuerdo su nombre.","en":"I don't remember his name."},{"es":"Escribe tu nombre y apellido aquí.","en":"Write your first and last name here."}]}]},{"id":"u04","title":"Time","intro":"This unit contains the book's worst traps for an English speaker: tiempo, vez, mañana and tarde each carry two meanings that English splits into different words.","entries":[{"es":"el tiempo","pos":"n.m.","en":"time (in general); weather","he":"זמן / מזג אוויר","note":"Uncountable time, and the weather. For a countable occasion use vez.","ex":[{"tag":"time","es":"No tengo tiempo esta semana.","en":"I don't have time this week."},{"tag":"weather","es":"¿Cómo está el tiempo en Bogotá?","en":"What's the weather like in Bogotá?"}]},{"es":"la vez","pos":"n.f.","en":"time, occasion, instance","he":"פעם","note":"Countable times. Plural veces. A veces = sometimes, otra vez = again, tal vez = maybe.","ex":[{"es":"Te lo dije tres veces.","en":"I told you three times."},{"es":"Tal vez venga más tarde.","en":"Maybe he'll come later."}]},{"es":"el año","pos":"n.m.","en":"year","note":"The tilde matters: ano without it is a part of the body.","ex":[{"es":"El año pasado viajamos a Perú.","en":"Last year we travelled to Peru."}]},{"es":"el día","pos":"n.m.","en":"day","note":"Ends in -a but is masculine: el día, un buen día. Words from Greek often behave this way.","ex":[{"es":"Trabajo todos los días menos el domingo.","en":"I work every day except Sunday."}]},{"es":"la semana","pos":"n.f.","en":"week","ex":[{"es":"Nos vemos la semana que viene.","en":"We'll see each other next week."}]},{"es":"el mes","pos":"n.m.","en":"month","ex":[{"es":"Pago la renta a fin de mes.","en":"I pay the rent at the end of the month."}]},{"es":"la hora","pos":"n.f.","en":"hour; time of day","he":"שעה","ex":[{"tag":"hour","es":"Esperamos media hora.","en":"We waited half an hour."},{"tag":"time of day","es":"¿A qué hora sale el tren?","en":"What time does the train leave?"}]},{"es":"el momento","pos":"n.m.","en":"moment, instant; right time","ex":[{"tag":"instant","es":"En ese momento sonó el teléfono.","en":"At that moment the phone rang."},{"tag":"right time","es":"No es el momento de hablar de eso.","en":"This isn't the time to talk about that."}]},{"es":"la mañana","pos":"n.f. / adv.","en":"morning; (bare mañana) tomorrow","he":"בוקר / מחר","note":"With the article it is the morning; bare, it is tomorrow. Both at once: mañana por la mañana.","ex":[{"tag":"morning","es":"Corro todas las mañanas.","en":"I run every morning."},{"tag":"tomorrow","es":"Mañana tengo una cita con el médico.","en":"Tomorrow I have a doctor's appointment."},{"tag":"both","es":"Salgo mañana por la mañana.","en":"I'm leaving tomorrow morning."}]},{"es":"la tarde","pos":"n.f. / adv.","en":"afternoon, early evening; (bare tarde) late","he":"אחר הצהריים / מאוחר","note":"La tarde stretches until dark, so it covers both English afternoon and evening.","ex":[{"tag":"afternoon","es":"Nos vemos en la tarde.","en":"We'll see each other in the afternoon."},{"tag":"late","es":"Se acostó muy tarde.","en":"He went to bed very late."},{"tag":"both","es":"Llegó tarde por la tarde.","en":"He arrived late in the afternoon."}]},{"es":"la noche","pos":"n.f.","en":"night, evening","ex":[{"es":"Anoche dormí muy mal.","en":"Last night I slept badly."}]},{"es":"hoy","pos":"adv.","en":"today","ex":[{"es":"Hoy no trabajo.","en":"I'm not working today."}]},{"es":"ayer","pos":"adv.","en":"yesterday","ex":[{"es":"Ayer hizo mucho viento.","en":"It was very windy yesterday."}]},{"es":"ahora","pos":"adv.","en":"now","note":"ahora mismo = right now. por ahora = for the time being.","ex":[{"es":"Ahora mismo estoy ocupado.","en":"I'm busy right now."}]},{"es":"luego","pos":"adv.","en":"later, afterwards; then, next","he":"אחר כך","note":"Hasta luego is the everyday goodbye.","ex":[{"tag":"later","es":"Te llamo luego.","en":"I'll call you later."},{"tag":"next","es":"Primero comemos y luego salimos.","en":"First we eat and then we go out."}]},{"es":"siempre","pos":"adv.","en":"always","ex":[{"es":"Siempre olvida las llaves.","en":"He always forgets his keys."}]},{"es":"nunca","pos":"adv.","en":"never","note":"After the verb it needs a no in front of it: no voy nunca. Before the verb it stands alone: nunca voy.","ex":[{"es":"Nunca he estado en México.","en":"I've never been to Mexico."}]},{"es":"temprano","pos":"adv.","en":"early","ex":[{"es":"Me levanto temprano entre semana.","en":"I get up early on weekdays."}]},{"es":"todavía","pos":"adv.","en":"still; (with no) yet","he":"עדיין","note":"Interchangeable with aún in most sentences.","ex":[{"tag":"still","es":"Todavía vive con sus padres.","en":"He still lives with his parents."},{"tag":"yet","es":"Todavía no está listo.","en":"It isn't ready yet."}]},{"es":"mientras","pos":"conj.","en":"while, meanwhile","ex":[{"es":"Lee el periódico mientras desayuna.","en":"He reads the paper while he has breakfast."}]}]},{"id":"u05","title":"Getting by: greeting people and being polite","intro":"Fixed formulas rather than words you build from parts. Learn each one whole. Spanish is warmer than English here: strangers greet each other in lifts and shops, and skipping the greeting reads as rudeness rather than efficiency.","entries":[{"es":"hola","pos":"interj.","en":"hello, hi","note":"Neutral at any hour and with anyone. The h is silent.","ex":[{"es":"¡Hola! ¿Qué tal todo?","en":"Hi! How's everything?"}]},{"es":"buenos días","pos":"phrase","en":"good morning","note":"Plural in Spanish, always. Used until about midday.","ex":[{"es":"Buenos días, ¿ya desayunaste?","en":"Good morning, have you had breakfast?"}]},{"es":"buenas tardes","pos":"phrase","en":"good afternoon, good evening","note":"From midday until dark, so it covers the English evening too.","ex":[{"es":"Buenas tardes, ¿en qué le puedo ayudar?","en":"Good afternoon, how can I help you?"}]},{"es":"buenas noches","pos":"phrase","en":"good evening (arriving); good night (leaving)","he":"ערב טוב / לילה טוב","note":"One phrase for both hello and goodbye after dark — the moment decides which.","ex":[{"tag":"arriving","es":"Buenas noches, mesa para dos.","en":"Good evening, a table for two."},{"tag":"leaving","es":"Buenas noches, que descanses.","en":"Good night, sleep well."}]},{"es":"¿cómo estás? · ¿cómo está?","pos":"phrase","en":"how are you? (informal); how are you? (formal)","note":"The -s ending is the whole difference between tú and usted.","ex":[{"tag":"informal","es":"¡Pedro! ¿Cómo estás?","en":"Pedro! How are you?"},{"tag":"formal","es":"Buenos días, doctora. ¿Cómo está?","en":"Good morning, doctor. How are you?"}]},{"es":"¿qué tal?","pos":"phrase","en":"how's it going?, what's up?","note":"Casual and invariable — no verb to conjugate, which makes it the safe one.","ex":[{"es":"¿Qué tal el trabajo nuevo?","en":"How's the new job going?"}]},{"es":"bien","pos":"adv.","en":"well, fine; very (before an adjective)","he":"טוב / מאוד","note":"bien is an adverb, bueno an adjective. Estoy bien, not estoy bueno — the second means something quite different.","ex":[{"tag":"well","es":"Todo salió bien.","en":"Everything turned out well."},{"tag":"very","es":"El café está bien caliente.","en":"The coffee is really hot."}]},{"es":"mal","pos":"adv. / adj.","en":"badly; bad","ex":[{"tag":"badly","es":"Dormí mal anoche.","en":"I slept badly last night."},{"tag":"bad","es":"No está mal.","en":"It's not bad."}]},{"es":"más o menos","pos":"phrase","en":"so-so; roughly, about","he":"ככה ככה / בערך","ex":[{"tag":"so-so","es":"—¿Cómo te fue? —Más o menos.","en":"\"How did it go?\" \"So-so.\""},{"tag":"roughly","es":"Cuesta más o menos cien pesos.","en":"It costs about a hundred pesos."}]},{"es":"gracias","pos":"interj.","en":"thank you","note":"muchas gracias, never mucho gracias — the word is feminine plural.","ex":[{"es":"Muchas gracias por todo.","en":"Thank you very much for everything."}]},{"es":"de nada","pos":"phrase","en":"you're welcome, not at all","note":"In Mexico you will also hear no hay de qué and con gusto.","ex":[{"es":"—Gracias. —De nada.","en":"\"Thanks.\" \"You're welcome.\""}]},{"es":"por favor","pos":"phrase","en":"please","ex":[{"es":"Un café, por favor.","en":"A coffee, please."}]},{"es":"perdón","pos":"interj.","en":"sorry; excuse me (to get past or interrupt)","he":"סליחה","ex":[{"tag":"sorry","es":"Perdón, no quise molestarte.","en":"Sorry, I didn't mean to bother you."},{"tag":"excuse me","es":"Perdón, ¿me deja pasar?","en":"Excuse me, may I get past?"}]},{"es":"disculpe","pos":"interj.","en":"excuse me (formal, to get attention)","note":"The opener for asking a stranger anything. Informal: disculpa.","ex":[{"es":"Disculpe, ¿dónde está la estación?","en":"Excuse me, where is the station?"}]},{"es":"con permiso","pos":"phrase","en":"excuse me (passing by, or leaving)","he":"ברשותך","note":"Said as you squeeze past someone or step away from a table. Where English says nothing, Spanish says this.","ex":[{"es":"Con permiso, voy a salir un momento.","en":"Excuse me, I'm going to step out for a moment."}]},{"es":"mucho gusto","pos":"phrase","en":"nice to meet you","note":"The reply is igualmente or el gusto es mío.","ex":[{"es":"Mucho gusto, soy Miguel.","en":"Nice to meet you, I'm Miguel."}]},{"es":"claro","pos":"adv.","en":"of course, sure; clearly","he":"בטח / ברור","note":"claro que sí is an emphatic yes; claro que no an emphatic no.","ex":[{"tag":"of course","es":"—¿Me ayudas? —¡Claro!","en":"\"Will you help me?\" \"Of course!\""},{"tag":"clearly","es":"Habla claro, por favor.","en":"Speak clearly, please."}]},{"es":"salud","pos":"interj.","en":"cheers!; bless you!","he":"לחיים / לבריאות","note":"Literally health. The same word covers the toast and the sneeze.","ex":[{"tag":"cheers","es":"¡Salud, por los novios!","en":"Cheers, to the newlyweds!"},{"tag":"bless you","es":"—¡Achú! —¡Salud!","en":"\"Achoo!\" \"Bless you!\""}]},{"es":"adiós","pos":"interj.","en":"goodbye","note":"A touch final. For everyday partings people prefer hasta luego or chao.","ex":[{"es":"Adiós, y buen viaje.","en":"Goodbye, and have a good trip."}]},{"es":"hasta luego","pos":"phrase","en":"see you later","note":"Same pattern: hasta mañana, hasta el lunes, hasta pronto.","ex":[{"es":"Me voy. ¡Hasta luego!","en":"I'm off. See you later!"}]}]},{"id":"u06","title":"Asking: question words and pronouns","intro":"Every question word carries an accent — that accent is what makes it a question rather than a relative pronoun. Spanish also drops subject pronouns constantly, because the verb ending already says who is speaking; the pronouns below are for emphasis and for clearing up ambiguity.","entries":[{"es":"¿qué?","pos":"pron.","en":"what?","note":"Asks for a definition or a thing. Unaccented que is the conjunction that.","ex":[{"es":"¿Qué quieres tomar?","en":"What do you want to drink?"}]},{"es":"¿quién? · ¿quiénes?","pos":"pron.","en":"who?","note":"Takes a plural form when you expect more than one person.","ex":[{"es":"¿Quién llamó?","en":"Who called?"},{"es":"¿Quiénes vienen a la cena?","en":"Who is coming to the dinner?"}]},{"es":"¿cuándo?","pos":"adv.","en":"when?","ex":[{"es":"¿Cuándo llegaste?","en":"When did you arrive?"}]},{"es":"¿dónde?","pos":"adv.","en":"where?","ex":[{"es":"¿Dónde dejaste las llaves?","en":"Where did you leave the keys?"}]},{"es":"¿adónde? · ¿de dónde?","pos":"adv.","en":"where to?; where from?","he":"לאן / מאיפה","note":"Spanish marks direction on the question word. English has to add a preposition at the end of the sentence.","ex":[{"tag":"where to","es":"¿Adónde vas con tanta prisa?","en":"Where are you going in such a hurry?"},{"tag":"where from","es":"¿De dónde eres?","en":"Where are you from?"}]},{"es":"¿por qué? · porque","pos":"adv. / conj.","en":"why?; because","he":"למה / כי","note":"Two words with an accent asks the question; one word without answers it. A third form, el porqué, is the noun the reason.","ex":[{"tag":"why","es":"¿Por qué no viniste?","en":"Why didn't you come?"},{"tag":"because","es":"Porque estaba enfermo.","en":"Because I was ill."}]},{"es":"¿cuál? · ¿cuáles?","pos":"pron.","en":"which?, which one?","note":"Picks from a set. Before a noun Spanish prefers qué: ¿qué color? not ¿cuál color? But ¿cuál es tu nombre? — not ¿qué es tu nombre?","ex":[{"es":"Hay dos trenes. ¿Cuál tomamos?","en":"There are two trains. Which one do we take?"}]},{"es":"¿cómo?","pos":"adv.","en":"how?; what? (I didn't catch that)","he":"איך / מה אמרת","note":"Asking someone to repeat themselves with ¿qué? is blunt; ¿cómo? is the polite one.","ex":[{"tag":"how","es":"¿Cómo se abre esto?","en":"How does this open?"},{"tag":"pardon","es":"¿Cómo? No te escuché.","en":"Sorry? I didn't hear you."}]},{"es":"¿cuánto? · ¿cuántos?","pos":"adj.","en":"how much?; how many?","note":"Agrees with the noun: cuánta agua, cuántas sillas.","ex":[{"tag":"how much","es":"¿Cuánto cuesta?","en":"How much does it cost?"},{"tag":"how many","es":"¿Cuántas personas caben?","en":"How many people fit?"}]},{"es":"yo","pos":"pron.","en":"I","note":"Usually left out — hablo already means I speak. Say yo only to stress or contrast.","ex":[{"es":"Yo pago, tú invitas la próxima.","en":"I'll pay, you treat next time."}]},{"es":"tú","pos":"pron.","en":"you (one person, informal)","note":"With an accent it is the pronoun; without, tu means your. In Argentina and much of Central America vos replaces it.","ex":[{"es":"¿Y tú qué opinas?","en":"And what do you think?"}]},{"es":"usted","pos":"pron.","en":"you (one person, formal)","he":"אתה/את (בכבוד)","note":"Takes the same verb form as él and ella: usted tiene, not usted tienes. Abbreviated Ud.","ex":[{"es":"¿Usted ya tiene su boleto?","en":"Do you already have your ticket?"}]},{"es":"ustedes","pos":"pron.","en":"you (more than one person)","note":"In Latin America this is the only plural you — formal and informal alike. Spain keeps a separate vosotros, which you can safely ignore.","ex":[{"es":"¿Ustedes vienen en carro o en tren?","en":"Are you coming by car or by train?"}]},{"es":"él · ella","pos":"pron.","en":"he · she","note":"él with an accent is the pronoun; el without is the article the.","ex":[{"es":"Él cocina y ella lava los platos.","en":"He cooks and she washes the dishes."}]},{"es":"nosotros · nosotras","pos":"pron.","en":"we","note":"nosotras only if every one of you is female.","ex":[{"es":"Nosotros ya comimos, gracias.","en":"We've already eaten, thanks."}]},{"es":"ellos · ellas","pos":"pron.","en":"they","note":"One man in the group and it goes back to ellos.","ex":[{"es":"Ellas trabajan en el hospital.","en":"They work at the hospital."}]},{"es":"me · te · nos","pos":"pron.","en":"me · you · us (object)","he":"אותי / אותך / אותנו","note":"They sit before the verb, or stick onto the end of an infinitive or a command: quiero verte, llámame.","ex":[{"tag":"before verb","es":"Me llamó ayer.","en":"She called me yesterday."},{"tag":"attached","es":"¿Puedes esperarnos?","en":"Can you wait for us?"}]},{"es":"le · les","pos":"pron.","en":"to him, to her, to you (formal); to them","note":"The indirect object. Becomes se when lo or la follows: se lo dije.","ex":[{"tag":"singular","es":"Le dije la verdad a mi jefa.","en":"I told my boss the truth."},{"tag":"plural","es":"Les mandé un mensaje a los niños.","en":"I sent the children a message."}]},{"es":"mi · tu · su","pos":"adj.","en":"my · your · his, her, your (formal), their","he":"שלי / שלך / שלו־שלה־שלהם","note":"su is genuinely ambiguous, so Spanish often clarifies: su casa de ella, or la casa de Marta.","ex":[{"es":"Mi hermano perdió su teléfono.","en":"My brother lost his phone."}]},{"es":"conmigo · contigo","pos":"pron.","en":"with me · with you","note":"Irregular one-word forms. Never con mí or con ti.","ex":[{"es":"¿Vienes conmigo al mercado?","en":"Are you coming with me to the market?"}]}]},{"id":"u07","title":"Food and eating","intro":"The most useful concrete nouns in the language, because you will use them every day and can point at them while you learn. Watch the genders: most are predictable from the ending, and the two that are not are flagged.","entries":[{"es":"la comida","pos":"n.f.","en":"food; meal; lunch","he":"אוכל / ארוחה","note":"In Mexico la comida on its own usually means the main midday meal.","ex":[{"tag":"food","es":"La comida de este país me encanta.","en":"I love this country's food."},{"tag":"meal","es":"Es la mejor comida que he probado.","en":"It's the best meal I've ever tasted."},{"tag":"lunch","es":"La comida es a las dos.","en":"Lunch is at two."}]},{"es":"el desayuno","pos":"n.m.","en":"breakfast","note":"The verb is desayunar — one word where English needs three.","ex":[{"es":"Desayuno pan con queso.","en":"I have bread and cheese for breakfast."}]},{"es":"el almuerzo","pos":"n.m.","en":"lunch","note":"Verb: almorzar (yo almuerzo). Competes regionally with la comida.","ex":[{"es":"¿Almorzamos juntos el viernes?","en":"Shall we have lunch together on Friday?"}]},{"es":"la cena","pos":"n.f.","en":"dinner, supper","note":"Verb: cenar. Eaten late — nine or ten at night is normal.","ex":[{"es":"Cenamos tarde los sábados.","en":"We eat dinner late on Saturdays."}]},{"es":"el agua","pos":"n.f.","en":"water","he":"מים","note":"Feminine, but takes el in the singular because agua starts with a stressed a. So el agua fría, and las aguas in the plural.","ex":[{"es":"¿Me trae un vaso de agua, por favor?","en":"Could you bring me a glass of water, please?"}]},{"es":"el pan","pos":"n.m.","en":"bread","ex":[{"es":"Compro pan fresco cada mañana.","en":"I buy fresh bread every morning."}]},{"es":"la carne","pos":"n.f.","en":"meat; beef","he":"בשר","note":"On a menu carne usually means beef specifically; carne de cerdo is pork.","ex":[{"tag":"meat","es":"No come carne desde hace años.","en":"She hasn't eaten meat for years."},{"tag":"beef","es":"Pedí carne con papas.","en":"I ordered beef with potatoes."}]},{"es":"el pollo","pos":"n.m.","en":"chicken","ex":[{"es":"El pollo asado está riquísimo.","en":"The roast chicken is delicious."}]},{"es":"el pescado","pos":"n.m.","en":"fish (as food)","he":"דג (למאכל)","note":"A fish still swimming is el pez. Once it is caught it becomes el pescado — literally the fished.","ex":[{"es":"En la costa el pescado es más barato.","en":"On the coast fish is cheaper."}]},{"es":"el huevo","pos":"n.m.","en":"egg","ex":[{"es":"¿Cómo quiere los huevos?","en":"How would you like your eggs?"}]},{"es":"la leche","pos":"n.f.","en":"milk","ex":[{"es":"Se acabó la leche.","en":"We're out of milk."}]},{"es":"el queso","pos":"n.m.","en":"cheese","ex":[{"es":"Ponle más queso, por favor.","en":"Put more cheese on it, please."}]},{"es":"la fruta","pos":"n.f.","en":"fruit","note":"Uncountable like the English, so la fruta covers the whole category.","ex":[{"es":"Come fruta en vez de dulces.","en":"Eat fruit instead of sweets."}]},{"es":"la verdura","pos":"n.f.","en":"vegetable","note":"Usually plural: las verduras. la legumbre is a pulse, not a vegetable.","ex":[{"es":"Las verduras están en la bolsa verde.","en":"The vegetables are in the green bag."}]},{"es":"el arroz","pos":"n.m.","en":"rice","ex":[{"es":"Sirven arroz con casi todo.","en":"They serve rice with almost everything."}]},{"es":"los frijoles","pos":"n.m.pl.","en":"beans","note":"Mexico and Central America say frijoles; the Caribbean habichuelas; Spain and the Southern Cone judías or porotos.","ex":[{"es":"Los frijoles negros son mis favoritos.","en":"Black beans are my favourite."}]},{"es":"la sal","pos":"n.f.","en":"salt","note":"Feminine despite ending in a consonant. salado means salty.","ex":[{"es":"Le falta sal.","en":"It needs salt."}]},{"es":"el azúcar","pos":"n.m.","en":"sugar","note":"Takes either gender in practice — el azúcar and la azúcar are both heard — but el is safer.","ex":[{"es":"Tomo el café sin azúcar.","en":"I drink my coffee without sugar."}]},{"es":"rico","pos":"adj.","en":"delicious; rich, wealthy","he":"טעים / עשיר","note":"About food it means tasty, and it is the everyday compliment to a cook — far commoner than delicioso.","ex":[{"tag":"delicious","es":"¡Qué rico está el pastel!","en":"The cake is so good!"},{"tag":"wealthy","es":"Es de una familia rica.","en":"He's from a wealthy family."}]},{"es":"la cuenta","pos":"n.f.","en":"bill, check; account","he":"חשבון","note":"La cuenta, por favor is how you end a meal. Waving for the bill is normal.","ex":[{"tag":"bill","es":"¿Nos trae la cuenta?","en":"Could you bring us the bill?"},{"tag":"account","es":"Abrí una cuenta en ese banco.","en":"I opened an account at that bank."}]},{"es":"la concha","pos":"n.f.","en":"shell; a sweet bread roll (Mexico)","warn":"In Argentina, Uruguay, Chile and Paraguay this is a coarse word for the female genitals, and one of the strongest insults in the language. Perfectly ordinary in Mexico, where it names a pastry. Say caracol or caparazón for a shell if you are anywhere near the Southern Cone.","ex":[{"tag":"shell","es":"Encontramos una concha en la playa.","en":"We found a shell on the beach."},{"tag":"pastry","es":"Dos conchas y un café con leche.","en":"Two conchas and a latte."}]}]},{"id":"u08","title":"Town and getting around","intro":"Words for finding your way and naming what you pass. This unit has more regional variation than any other in the book — the bus alone has five names — so the alternatives are given where they matter.","entries":[{"es":"la ciudad","pos":"n.f.","en":"city, town","note":"Stress on the last syllable: ciu-DAD.","ex":[{"es":"Es la ciudad más grande del país.","en":"It's the largest city in the country."}]},{"es":"el pueblo","pos":"n.m.","en":"village, small town; the people, the populace","he":"כפר / עם","note":"The second sense is the political one — el pueblo mexicano, the Mexican people.","ex":[{"tag":"village","es":"Mis abuelos viven en un pueblo pequeño.","en":"My grandparents live in a small village."},{"tag":"the people","es":"El pueblo salió a la calle.","en":"The people took to the streets."}]},{"es":"la calle","pos":"n.f.","en":"street","note":"Double l sounds like English y in most of Latin America; in Buenos Aires it is closer to sh.","ex":[{"es":"Vivo en la calle Bolívar.","en":"I live on Bolívar Street."}]},{"es":"la avenida","pos":"n.f.","en":"avenue","note":"Abbreviated Av. in addresses. Wider than a calle and usually numbered or named after a date.","ex":[{"es":"Camina dos cuadras por la avenida.","en":"Walk two blocks along the avenue."}]},{"es":"la esquina","pos":"n.f.","en":"corner (of a street)","he":"פינת רחוב","note":"An outside corner where two streets meet. An inside corner of a room is el rincón.","ex":[{"es":"Nos vemos en la esquina de Juárez y Reforma.","en":"Let's meet at the corner of Juárez and Reforma."}]},{"es":"la cuadra","pos":"n.f.","en":"block (of houses)","note":"The standard unit of walking directions in Latin America. Spain says manzana.","ex":[{"es":"Está a tres cuadras de aquí.","en":"It's three blocks from here."}]},{"es":"la plaza","pos":"n.f.","en":"square, plaza","note":"The centre of any Latin American town, usually with a church on one side.","ex":[{"es":"La plaza se llena los domingos.","en":"The square fills up on Sundays."}]},{"es":"el parque","pos":"n.m.","en":"park","ex":[{"es":"Los niños juegan en el parque hasta que oscurece.","en":"The children play in the park until it gets dark."}]},{"es":"la tienda","pos":"n.f.","en":"shop, store","note":"A shop for a specific trade takes -ería: panadería, librería, zapatería.","ex":[{"es":"La tienda cierra a las nueve.","en":"The shop closes at nine."}]},{"es":"el mercado","pos":"n.m.","en":"market","ex":[{"es":"En el mercado todo es más barato.","en":"Everything is cheaper at the market."}]},{"es":"la escuela","pos":"n.f.","en":"school","note":"el colegio is also school, not college. University is la universidad.","ex":[{"es":"La escuela está frente al parque.","en":"The school is opposite the park."}]},{"es":"el hospital","pos":"n.m.","en":"hospital","ex":[{"es":"Lo llevaron al hospital anoche.","en":"They took him to the hospital last night."}]},{"es":"el banco","pos":"n.m.","en":"bank; bench, stool","he":"בנק / ספסל","note":"Context alone separates the two. A river bank is la orilla, a third thing entirely.","ex":[{"tag":"bank","es":"El banco abre a las nueve.","en":"The bank opens at nine."},{"tag":"bench","es":"Nos sentamos en un banco del parque.","en":"We sat on a park bench."}]},{"es":"la iglesia","pos":"n.f.","en":"church","ex":[{"es":"La iglesia es del siglo XVII.","en":"The church is from the seventeenth century."}]},{"es":"la estación","pos":"n.f.","en":"station; season (of the year)","he":"תחנה / עונה","ex":[{"tag":"station","es":"Te espero en la estación.","en":"I'll wait for you at the station."},{"tag":"season","es":"Mi estación favorita es el otoño.","en":"My favourite season is autumn."}]},{"es":"el camino","pos":"n.m.","en":"road, path; way, route","he":"דרך","ex":[{"tag":"path","es":"El camino al río es de tierra.","en":"The road to the river is unpaved."},{"tag":"way","es":"Nos perdimos en el camino.","en":"We got lost on the way."}]},{"es":"el autobús","pos":"n.m.","en":"bus","note":"Regional roulette: camión in Mexico, guagua in the Caribbean, colectivo in Argentina, micro in Chile, bus almost everywhere. autobús is understood by all of them.","ex":[{"es":"El autobús pasa cada veinte minutos.","en":"The bus comes every twenty minutes."}]},{"es":"el tren","pos":"n.m.","en":"train","ex":[{"es":"Perdimos el último tren.","en":"We missed the last train."}]},{"es":"el carro","pos":"n.m.","en":"car","note":"carro in Mexico, Colombia and Central America; auto in Argentina and Chile; coche in Spain. All three are understood everywhere.","ex":[{"es":"Dejé el carro en la esquina.","en":"I left the car on the corner."}]},{"es":"manejar","pos":"v.","en":"to drive; to handle, to manage","he":"לנהוג / לטפל ב-","note":"Latin America drives with manejar; Spain uses conducir.","ex":[{"tag":"drive","es":"No sé manejar.","en":"I don't know how to drive."},{"tag":"handle","es":"Ella maneja muy bien la presión.","en":"She handles pressure very well."}]},{"es":"caminar","pos":"v.","en":"to walk","note":"andar also means to walk, but leans towards to go about, to be running: el reloj no anda.","ex":[{"es":"Caminamos hasta la plaza.","en":"We walked to the square."}]}]},{"id":"u09","title":"The body, and saying what hurts","intro":"Read plate 3 alongside this unit. Spanish uses the article where English uses a possessive — me lavo las manos, not mis manos — because the reflexive already tells you whose they are.","entries":[{"es":"el cuerpo","pos":"n.m.","en":"body","ex":[{"es":"Después de la carrera me dolía todo el cuerpo.","en":"After the race my whole body ached."}]},{"es":"la cabeza","pos":"n.f.","en":"head","note":"de cabeza means upside down or headfirst.","ex":[{"es":"Cuidado, no te golpees la cabeza.","en":"Careful, don't bang your head."}]},{"es":"la cara","pos":"n.f.","en":"face; cheek, nerve","he":"פנים / חוצפה","note":"¡Qué cara! means what a nerve — the same jump English makes with cheek.","ex":[{"tag":"face","es":"Se lavó la cara con agua fría.","en":"He washed his face with cold water."},{"tag":"nerve","es":"Tiene mucha cara para pedir eso.","en":"He's got some nerve asking for that."}]},{"es":"el ojo","pos":"n.m.","en":"eye","note":"¡Ojo! on its own is a warning: watch out.","ex":[{"es":"Cierra los ojos un momento.","en":"Close your eyes for a moment."}]},{"es":"la boca","pos":"n.f.","en":"mouth","ex":[{"es":"Habló con la boca llena.","en":"He spoke with his mouth full."}]},{"es":"la mano","pos":"n.f.","en":"hand","he":"יד","note":"Ends in -o and is feminine anyway: la mano derecha, las manos limpias. One of the few genuine exceptions.","ex":[{"es":"Dame la mano para cruzar.","en":"Give me your hand to cross."}]},{"es":"el brazo","pos":"n.m.","en":"arm","ex":[{"es":"Se rompió el brazo jugando fútbol.","en":"He broke his arm playing football."}]},{"es":"la pierna","pos":"n.f.","en":"leg","ex":[{"es":"Tengo las piernas cansadas de tanto caminar.","en":"My legs are tired from so much walking."}]},{"es":"el pie","pos":"n.m.","en":"foot; bottom, base","he":"רגל (כף) / תחתית","note":"a pie means on foot. Plural is pies, not pieses.","ex":[{"tag":"foot","es":"Vamos a pie, está cerca.","en":"Let's walk, it's close."},{"tag":"base","es":"Nos vemos al pie de la escalera.","en":"Meet me at the bottom of the stairs."}]},{"es":"el pelo","pos":"n.m.","en":"hair","note":"Singular for the whole head of hair. el cabello is the more formal word.","ex":[{"es":"Se cortó el pelo muy corto.","en":"She cut her hair very short."}]},{"es":"la espalda","pos":"n.f.","en":"back (of the body)","he":"גב","note":"The back of an object is la parte de atrás. de espaldas means with one's back turned.","ex":[{"es":"Me duele la espalda de estar sentado.","en":"My back hurts from sitting."}]},{"es":"el corazón","pos":"n.m.","en":"heart","note":"Also the affectionate address, like English love or sweetheart.","ex":[{"es":"El corazón le latía muy rápido.","en":"His heart was beating very fast."}]},{"es":"doler","pos":"v. irr.","en":"to hurt, to ache","he":"לכאוב","note":"Built backwards from English: the body part is the subject. Me duele la cabeza is literally the head hurts to me. Plural parts take duelen.","conj":{"label":"pres.","forms":["me duele","te duele","le duele","nos duele","les duele"]},"ex":[{"es":"Me duele la garganta.","en":"My throat hurts."},{"es":"¿Te duelen los pies?","en":"Do your feet hurt?"}]},{"es":"el dolor","pos":"n.m.","en":"pain, ache; grief","he":"כאב","note":"Name the part with de: dolor de cabeza, dolor de estómago, dolor de muelas.","ex":[{"tag":"pain","es":"Tengo un dolor de cabeza terrible.","en":"I have a terrible headache."},{"tag":"grief","es":"Habló de su dolor con calma.","en":"She spoke about her grief calmly."}]},{"es":"enfermo","pos":"adj.","en":"ill, sick","note":"Takes estar, because it is a state: está enfermo. With ser it would mean a permanent condition.","ex":[{"es":"Mi hija está enferma y no fue a la escuela.","en":"My daughter is ill and didn't go to school."}]},{"es":"la fiebre","pos":"n.f.","en":"fever, temperature","note":"You have fever rather than a fever: tener fiebre.","ex":[{"es":"Tiene fiebre desde anoche.","en":"He's had a fever since last night."}]},{"es":"la salud","pos":"n.f.","en":"health","note":"The same word you raise a glass with — see salud in unit 5.","ex":[{"es":"Su salud ha mejorado mucho.","en":"His health has improved a lot."}]},{"es":"el médico / la médica","pos":"n.","en":"doctor, physician","note":"el doctor is also used, especially as a title of address.","ex":[{"es":"Deberías ver a un médico.","en":"You should see a doctor."}]},{"es":"la medicina","pos":"n.f.","en":"medicine (the substance); medicine (the field)","he":"תרופה / רפואה","note":"For a specific drug, el medicamento or la pastilla is more precise.","ex":[{"tag":"substance","es":"Tómate la medicina después de comer.","en":"Take your medicine after eating."},{"tag":"field","es":"Estudia medicina en la capital.","en":"She studies medicine in the capital."}]},{"es":"cansado","pos":"adj.","en":"tired; tiring","he":"עייף / מעייף","note":"estar cansado is to feel tired; ser cansado describes something that tires you out.","ex":[{"tag":"tired","es":"Estoy muy cansado, me voy a dormir.","en":"I'm very tired, I'm going to sleep."},{"tag":"tiring","es":"El viaje es largo y cansado.","en":"The journey is long and tiring."}]}]},{"id":"u10","title":"Wider family, birth and marriage","intro":"Read plate 4 alongside this unit. Spanish builds in-law words from the base word rather than compounding with in-law, so each one has to be learned separately — and the most dangerous word here is pariente, which does not mean parent.","entries":[{"es":"el tío / la tía","pos":"n.","en":"uncle / aunt","note":"In Spain tío doubles as slang for guy or mate. In Latin America it does not.","ex":[{"es":"Mi tía vive en Guadalajara.","en":"My aunt lives in Guadalajara."}]},{"es":"el primo / la prima","pos":"n.","en":"cousin","note":"primo hermano is a first cousin; primo segundo a second cousin.","ex":[{"es":"Crecí con mis primos en el campo.","en":"I grew up with my cousins in the countryside."}]},{"es":"el sobrino / la sobrina","pos":"n.","en":"nephew / niece","ex":[{"es":"Le compré un regalo a mi sobrina.","en":"I bought my niece a present."}]},{"es":"el nieto / la nieta","pos":"n.","en":"grandson / granddaughter","note":"los nietos covers grandchildren of either sex.","ex":[{"es":"Los abuelos cuidan a sus nietos los viernes.","en":"The grandparents look after their grandchildren on Fridays."}]},{"es":"el bisabuelo / la bisabuela","pos":"n.","en":"great-grandfather / great-grandmother","note":"bis- adds a generation each time: bisnieto is a great-grandchild.","ex":[{"es":"Mi bisabuela llegó de Polonia en 1930.","en":"My great-grandmother arrived from Poland in 1930."}]},{"es":"el suegro / la suegra","pos":"n.","en":"father-in-law / mother-in-law","note":"los suegros means the in-laws as a pair.","ex":[{"es":"Mis suegros vienen a cenar el domingo.","en":"My in-laws are coming to dinner on Sunday."}]},{"es":"el cuñado / la cuñada","pos":"n.","en":"brother-in-law / sister-in-law","ex":[{"es":"Su cuñado le consiguió el trabajo.","en":"His brother-in-law got him the job."}]},{"es":"el yerno / la nuera","pos":"n.","en":"son-in-law / daughter-in-law","note":"Two unrelated words rather than a matched pair — these two simply have to be memorised.","ex":[{"es":"Su nuera es arquitecta.","en":"Her daughter-in-law is an architect."}]},{"es":"el pariente","pos":"n.m.","en":"relative, relation","he":"קרוב משפחה","warn":"A false friend, and a costly one. Parents is los padres. Mis parientes means my relatives — cousins, aunts, the lot.","ex":[{"es":"Tengo parientes en tres países.","en":"I have relatives in three countries."}]},{"es":"casarse","pos":"v.","en":"to get married","he":"להתחתן","note":"Reflexive, and the person you marry takes con: se casó con Ana. estar casado is to be married.","ex":[{"es":"Se casaron en la playa.","en":"They got married on the beach."}]},{"es":"la boda","pos":"n.f.","en":"wedding","note":"el matrimonio is the marriage itself, the institution, not the party.","ex":[{"es":"La boda fue pequeña y bonita.","en":"The wedding was small and lovely."}]},{"es":"soltero","pos":"adj.","en":"single, unmarried","note":"Goes with ser, not estar: es soltera.","ex":[{"es":"Sigue soltero y muy contento.","en":"He's still single and very happy."}]},{"es":"nacer","pos":"v. irr.","en":"to be born","he":"להיוולד","note":"One word, not a passive. Only the yo form is irregular.","conj":{"label":"pres.","forms":["nazco","naces","nace","nacemos","nacen"]},"ex":[{"es":"Nací en Jerusalén.","en":"I was born in Jerusalem."}]},{"es":"crecer","pos":"v. irr.","en":"to grow; to grow up","conj":{"label":"pres.","forms":["crezco","creces","crece","crecemos","crecen"]},"ex":[{"tag":"grow","es":"El árbol creció muy rápido.","en":"The tree grew very fast."},{"tag":"grow up","es":"Crecí en un pueblo chico.","en":"I grew up in a small town."}]},{"es":"morir","pos":"v. irr.","en":"to die","note":"Past participle is muerto. morirse de risa is to die laughing.","conj":{"label":"pres.","forms":["muero","mueres","muere","morimos","mueren"]},"ex":[{"es":"Su abuelo murió el año pasado.","en":"His grandfather died last year."}]},{"es":"el bebé","pos":"n.m.","en":"baby","note":"Masculine whatever the baby is: el bebé es una niña.","ex":[{"es":"El bebé durmió toda la noche.","en":"The baby slept all night."}]},{"es":"joven","pos":"adj. / n.","en":"young; a young person","he":"צעיר","note":"Plural jóvenes takes an accent, because the stress must stay on the first syllable.","ex":[{"tag":"young","es":"Es demasiado joven para manejar.","en":"He's too young to drive."},{"tag":"a young person","es":"Los jóvenes se reúnen en la plaza.","en":"The young people gather in the square."}]},{"es":"viejo","pos":"adj. / n.","en":"old; (colloquial) parents, folks","he":"זקן / ישן","note":"Blunt about people — mayor is the polite word. mis viejos for my parents is warm, not rude, in Mexico and the Southern Cone.","ex":[{"tag":"old","es":"Ese carro ya está muy viejo.","en":"That car is very old now."},{"tag":"folks","es":"Voy a visitar a mis viejos.","en":"I'm going to visit my folks."}]},{"es":"el cumpleaños","pos":"n.m.","en":"birthday","note":"Already ends in -s in the singular and does not change in the plural: un cumpleaños, dos cumpleaños.","ex":[{"es":"¡Feliz cumpleaños!","en":"Happy birthday!"}]},{"es":"el apellido","pos":"n.m.","en":"surname, last name","note":"Most Spanish speakers carry two: the father's first, then the mother's. García Márquez is one person, not two names.","ex":[{"es":"¿Cómo se escribe su apellido?","en":"How do you spell your surname?"}]}]},{"id":"u11","title":"Numbers, quantity and order","intro":"Read plate 5 alongside this unit. Several numerals are grouped into single entries because they are learned as a run. Note that Spanish reverses the English punctuation: 1.500 is one and a half thousand, and 3,5 is three and a half.","entries":[{"es":"uno · un · una","pos":"num.","en":"one; a, an","he":"אחד / אחת","note":"uno stands alone, un goes before a masculine noun, una before a feminine one. The same shortening hits veintiún and treinta y un.","ex":[{"tag":"one","es":"Sólo queda uno.","en":"There's only one left."},{"tag":"a, an","es":"Necesito un boleto y una maleta.","en":"I need a ticket and a suitcase."}]},{"es":"dos · tres · cuatro · cinco","pos":"num.","en":"two, three, four, five","ex":[{"es":"Somos cinco en la familia.","en":"There are five of us in the family."}]},{"es":"seis · siete · ocho · nueve · diez","pos":"num.","en":"six, seven, eight, nine, ten","ex":[{"es":"El tren sale a las diez.","en":"The train leaves at ten."}]},{"es":"once · doce · trece · catorce · quince","pos":"num.","en":"eleven to fifteen","note":"These five are irregular and simply have to be learned. From sixteen the pattern becomes regular.","ex":[{"es":"Mi hija cumple quince años.","en":"My daughter is turning fifteen."}]},{"es":"dieciséis · diecisiete · dieciocho · diecinueve","pos":"num.","en":"sixteen to nineteen","note":"Literally ten-and-six, written as one word. dieciséis carries an accent; the others do not.","ex":[{"es":"Trabajé allí dieciocho meses.","en":"I worked there for eighteen months."}]},{"es":"veinte · veintiuno · veintidós","pos":"num.","en":"twenty, twenty-one, twenty-two","note":"The twenties are one word; from thirty on they split into three: treinta y uno.","ex":[{"es":"Cuesta veintidós pesos.","en":"It costs twenty-two pesos."}]},{"es":"treinta · cuarenta · cincuenta","pos":"num.","en":"thirty, forty, fifty","ex":[{"es":"Mi padre tiene cincuenta años.","en":"My father is fifty."}]},{"es":"sesenta · setenta · ochenta · noventa","pos":"num.","en":"sixty, seventy, eighty, ninety","note":"sesenta and setenta differ by one letter and are easy to confuse when spoken quickly.","ex":[{"es":"La reunión duró noventa minutos.","en":"The meeting lasted ninety minutes."}]},{"es":"cien · ciento","pos":"num.","en":"a hundred; a hundred and (101–199)","he":"מאה","note":"cien exactly, and before a noun or before mil. ciento only when something follows: ciento cinco.","ex":[{"tag":"exactly","es":"Hay cien personas en la sala.","en":"There are a hundred people in the room."},{"tag":"and more","es":"Pagué ciento veinte pesos.","en":"I paid a hundred and twenty pesos."}]},{"es":"mil · un millón","pos":"num.","en":"a thousand; a million","note":"Never un mil — mil stands alone. But un millón takes de before a noun: un millón de personas.","ex":[{"tag":"thousand","es":"El vuelo cuesta mil quinientos pesos.","en":"The flight costs fifteen hundred pesos."},{"tag":"million","es":"La ciudad tiene dos millones de habitantes.","en":"The city has two million inhabitants."}]},{"es":"el número","pos":"n.m.","en":"number; issue, size","he":"מספר","ex":[{"tag":"number","es":"¿Me das tu número?","en":"Can I have your number?"},{"tag":"size","es":"¿Qué número calza?","en":"What shoe size do you take?"}]},{"es":"primero · segundo · tercero","pos":"adj.","en":"first, second, third","note":"primero and tercero drop the -o before a masculine noun: el primer día, el tercer piso.","ex":[{"es":"Vivo en el primer piso.","en":"I live on the first floor."}]},{"es":"último","pos":"adj.","en":"last, final; latest","he":"אחרון","ex":[{"tag":"final","es":"Ése fue el último tren.","en":"That was the last train."},{"tag":"latest","es":"¿Leíste su último libro?","en":"Did you read her latest book?"}]},{"es":"medio · la mitad","pos":"adj. / n.f.","en":"half (adjective); half (noun)","he":"חצי","note":"medio agrees with its noun — media hora. la mitad is the thing itself, and takes de.","ex":[{"tag":"adjective","es":"Espera media hora.","en":"Wait half an hour."},{"tag":"noun","es":"Me comí la mitad del pastel.","en":"I ate half the cake."}]},{"es":"mucho · poco","pos":"adj. / adv.","en":"a lot, many; little, few","note":"As adjectives they agree: muchas casas, pocos días. As adverbs they never change: trabaja mucho.","ex":[{"tag":"a lot","es":"Hay muchas opciones.","en":"There are a lot of options."},{"tag":"few","es":"Quedan pocos días.","en":"There are few days left."}]},{"es":"todo","pos":"adj. / pron.","en":"all, every; everything","he":"כל / הכל","note":"todo el día is all day; todos los días is every day. One letter, two different meanings.","ex":[{"tag":"all, every","es":"Estudia todos los días.","en":"He studies every day."},{"tag":"everything","es":"Ya lo sé todo.","en":"I already know everything."}]},{"es":"alguno · ninguno","pos":"adj. / pron.","en":"some, any; none, not any","he":"כלשהו / אף אחד","note":"Both shorten before a masculine noun: algún día, ningún problema. ninguno needs no before the verb if it follows it.","ex":[{"tag":"some","es":"Algún día volveré.","en":"Some day I'll come back."},{"tag":"none","es":"No tengo ningún problema.","en":"I don't have any problem."}]},{"es":"cada","pos":"adj.","en":"each, every","note":"Never changes form, and is always followed by a singular noun: cada persona.","ex":[{"es":"Cada niño recibió un libro.","en":"Each child received a book."}]},{"es":"otro","pos":"adj. / pron.","en":"other, another","note":"Takes no article: otro café, never un otro café. That un is the commonest mistake English speakers make with it.","ex":[{"es":"¿Me trae otro café, por favor?","en":"Could you bring me another coffee, please?"}]},{"es":"varios","pos":"adj.","en":"several, various","ex":[{"es":"Lo intenté varias veces.","en":"I tried several times."}]}]},{"id":"u12","title":"At the table and eating out","intro":"Read plate 6 alongside this unit. The trap to watch is hot: caliente is temperature and picante is spice, and confusing them in a Mexican restaurant has consequences.","entries":[{"es":"el plato","pos":"n.m.","en":"plate; dish, course","he":"צלחת / מנה","note":"A deep plate is un plato hondo; el platillo is the saucer.","ex":[{"tag":"plate","es":"Pon los platos en la mesa.","en":"Put the plates on the table."},{"tag":"dish","es":"Es el plato típico de la región.","en":"It's the region's typical dish."}]},{"es":"el vaso","pos":"n.m.","en":"glass, tumbler","he":"כוס","note":"For water or juice, with no stem. Not a vase — that is un florero.","ex":[{
