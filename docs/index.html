:"worse","es":"La segunda parte es peor.","en":"The second part is worse."}]},{"es":"mayor · menor","pos":"adj.","en":"older, greater; younger, lesser","note":"mi hermano mayor is my older brother. Also used of quantities: la mayor parte, most of.","ex":[{"tag":"older","es":"Mi hermana mayor vive en Chile.","en":"My older sister lives in Chile."},{"tag":"younger","es":"Es tres años menor que yo.","en":"He's three years younger than me."}]},{"es":"igual","pos":"adj. / adv.","en":"the same, equal; anyway","he":"אותו דבר / בכל מקרה","note":"me da igual means I don't mind. al igual que means just like.","ex":[{"tag":"the same","es":"Los dos cuestan igual.","en":"They both cost the same."},{"tag":"anyway","es":"Igual voy a ir.","en":"I'm going to go anyway."}]},{"es":"parecido · distinto","pos":"adj.","en":"similar; different","note":"diferente also works for different. parecerse a is to look like.","ex":[{"tag":"similar","es":"Son muy parecidos.","en":"They're very similar."},{"tag":"different","es":"Es distinto de lo que esperaba.","en":"It's different from what I expected."}]},{"es":"importante","pos":"adj.","en":"important; sizeable","note":"lo importante is the important thing — see lo in the opening section.","ex":[{"tag":"important","es":"Es importante llegar temprano.","en":"It's important to arrive early."},{"tag":"sizeable","es":"Fue una suma importante.","en":"It was a sizeable sum."}]},{"es":"difícil · fácil","pos":"adj.","en":"difficult; easy","note":"Both are invariable for gender: un examen difícil, una pregunta difícil.","ex":[{"tag":"difficult","es":"El examen fue más difícil de lo normal.","en":"The exam was harder than usual."},{"tag":"easy","es":"Es fácil de aprender.","en":"It's easy to learn."}]},{"es":"posible · imposible","pos":"adj.","en":"possible; impossible","note":"lo antes posible means as soon as possible.","ex":[{"tag":"possible","es":"Es posible que llueva.","en":"It may rain."},{"tag":"impossible","es":"Es imposible llegar a tiempo.","en":"It's impossible to get there on time."}]},{"es":"cierto","pos":"adj.","en":"true; certain, a certain","he":"נכון / מסוים","note":"es cierto means it's true. Before a noun it means a certain: cierta persona.","ex":[{"tag":"true","es":"Lo que dice es cierto.","en":"What he says is true."},{"tag":"a certain","es":"Hay cierto riesgo.","en":"There is a certain risk."}]},{"es":"claro · confuso","pos":"adj.","en":"clear; confusing, unclear","note":"See unit 5 for claro meaning of course.","ex":[{"tag":"clear","es":"La explicación fue muy clara.","en":"The explanation was very clear."},{"tag":"unclear","es":"El texto es confuso.","en":"The text is confusing."}]},{"es":"suficiente","pos":"adj.","en":"enough, sufficient","note":"bastante does the same job in speech — see unit 35.","ex":[{"es":"No hay tiempo suficiente.","en":"There isn't enough time."}]},{"es":"principal","pos":"adj.","en":"main, principal","note":"sobre todo and principalmente are the adverbs.","ex":[{"es":"Ése es el problema principal.","en":"That's the main problem."}]},{"es":"general","pos":"adj.","en":"general","note":"en general means generally, on the whole.","ex":[{"es":"En general estoy de acuerdo.","en":"On the whole I agree."}]},{"es":"muy · mucho","pos":"adv.","en":"very; a lot, much","he":"מאוד / הרבה","warn":"muy goes before adjectives and adverbs, mucho with verbs and nouns. muy bien but me gusta mucho. Never muy mucho.","ex":[{"tag":"very","es":"Está muy cansada.","en":"She's very tired."},{"tag":"a lot","es":"Trabaja mucho.","en":"He works a lot."}]},{"es":"tan · tanto","pos":"adv.","en":"so; so much, so many","note":"Same split as muy and mucho. tan ... como is as ... as; tanto como as much as.","ex":[{"tag":"so","es":"No es tan difícil como parece.","en":"It isn't as hard as it looks."},{"tag":"so much","es":"No comas tanto.","en":"Don't eat so much."}]},{"es":"apenas","pos":"adv.","en":"barely, hardly; just, only just","he":"בקושי / רק עכשיו","ex":[{"tag":"barely","es":"Apenas lo conozco.","en":"I barely know him."},{"tag":"just","es":"Apenas llegué.","en":"I've only just arrived."}]},{"es":"quizá · tal vez","pos":"adv.","en":"perhaps, maybe","note":"quizás with an s is equally correct. Both often take the subjunctive: quizá venga.","ex":[{"es":"Tal vez llegue mañana.","en":"Perhaps he'll arrive tomorrow."}]},{"es":"por supuesto","pos":"phrase","en":"of course","note":"claro que sí and desde luego do the same job.","ex":[{"es":"Por supuesto que te ayudo.","en":"Of course I'll help you."}]},{"es":"de acuerdo","pos":"phrase","en":"agreed, all right; in agreement","note":"estar de acuerdo con is to agree with. On its own, de acuerdo means OK.","ex":[{"tag":"OK","es":"De acuerdo, nos vemos allí.","en":"All right, see you there."},{"tag":"in agreement","es":"No estoy de acuerdo contigo.","en":"I don't agree with you."}]},{"es":"vale la pena","pos":"phrase","en":"it's worth it","note":"From valer — see unit 40. vale la pena intentarlo, it's worth trying.","ex":[{"es":"El viaje es largo pero vale la pena.","en":"The journey is long but it's worth it."}]}]},{"id":"u44","title":"How often, how long, when","intro":"Frequency and duration. The one to learn carefully is hace, which builds all time-ago expressions: hace dos años, two years ago, and hace dos años que vivo aquí, I've lived here for two years.","entries":[{"es":"hace","pos":"v.","en":"ago; for (a length of time)","he":"לפני / כבר","note":"From hacer. hace un mes is a month ago; hace un mes que espero, I've been waiting a month.","ex":[{"tag":"ago","es":"Llegamos hace dos horas.","en":"We arrived two hours ago."},{"tag":"for","es":"Hace tres años que estudio español.","en":"I've been studying Spanish for three years."}]},{"es":"siempre · nunca","pos":"adv.","en":"always; never","note":"See unit 4. para siempre means forever; casi nunca hardly ever.","ex":[{"tag":"always","es":"Siempre llega puntual.","en":"He always arrives on time."},{"tag":"never","es":"Nunca he probado eso.","en":"I've never tried that."}]},{"es":"a veces","pos":"phrase","en":"sometimes","note":"From la vez — see unit 4. Also de vez en cuando, now and then.","ex":[{"es":"A veces trabajo los sábados.","en":"Sometimes I work on Saturdays."}]},{"es":"a menudo · seguido","pos":"adv.","en":"often","note":"seguido is the Latin American everyday word; a menudo is more written.","ex":[{"es":"Nos vemos bastante seguido.","en":"We see each other fairly often."}]},{"es":"de vez en cuando","pos":"phrase","en":"now and then, occasionally","ex":[{"es":"De vez en cuando salimos a cenar.","en":"Now and then we go out for dinner."}]},{"es":"cada vez","pos":"phrase","en":"each time; increasingly","he":"כל פעם / יותר ויותר","note":"cada vez más means more and more: cada vez más caro.","ex":[{"tag":"each time","es":"Cada vez que lo veo está más alto.","en":"Every time I see him he's taller."},{"tag":"increasingly","es":"Está cada vez más difícil.","en":"It's getting harder and harder."}]},{"es":"ya no · todavía no","pos":"adv.","en":"not anymore; not yet","he":"כבר לא / עדיין לא","note":"The pair that English learners most often swap. See ya in the opening section.","ex":[{"tag":"not anymore","es":"Ya no fuma.","en":"He doesn't smoke anymore."},{"tag":"not yet","es":"Todavía no ha llegado.","en":"He hasn't arrived yet."}]},{"es":"enseguida · ahorita","pos":"adv.","en":"right away, in a moment","note":"ahorita is Mexican and elastic: it can mean right now or in a while, depending on tone.","ex":[{"es":"Enseguida te atiendo.","en":"I'll be with you in a moment."}]},{"es":"de repente · de pronto","pos":"adv.","en":"suddenly, all of a sudden","ex":[{"es":"De repente se apagó la luz.","en":"Suddenly the light went out."}]},{"es":"por fin · ya","pos":"adv.","en":"at last; already","note":"See unit 32 and the opening section.","ex":[{"tag":"at last","es":"Por fin terminamos.","en":"We've finished at last."},{"tag":"already","es":"Ya terminé la tarea.","en":"I've already finished the homework."}]},{"es":"mientras tanto","pos":"phrase","en":"meanwhile, in the meantime","note":"See mientras in unit 4 and unit 32.","ex":[{"es":"Mientras tanto, prepara la mesa.","en":"In the meantime, set the table."}]},{"es":"al principio · al final","pos":"phrase","en":"at first, at the beginning; in the end","he":"בהתחלה / בסוף","ex":[{"tag":"at first","es":"Al principio no entendía nada.","en":"At first I understood nothing."},{"tag":"in the end","es":"Al final decidimos quedarnos.","en":"In the end we decided to stay."}]},{"es":"primero · luego · después","pos":"adv.","en":"first; then; afterwards","note":"The basic sequence for telling a story or giving instructions.","ex":[{"tag":"first","es":"Primero calienta el aceite.","en":"First heat the oil."},{"tag":"then","es":"Luego añade la cebolla.","en":"Then add the onion."},{"tag":"afterwards","es":"Después lo dejas reposar.","en":"Afterwards you let it rest."}]},{"es":"el momento · el instante","pos":"n.m.","en":"moment, instant","note":"un momento, por favor is the everyday hold on a second.","ex":[{"es":"Un momento, por favor.","en":"One moment, please."}]},{"es":"durar","pos":"v.","en":"to last, to go on for","note":"¿Cuánto dura? asks how long something lasts.","ex":[{"es":"La película dura dos horas.","en":"The film lasts two hours."}]},{"es":"tardar","pos":"v.","en":"to take (time); to be late","he":"לקחת זמן / להתאחר","note":"¿Cuánto tarda? asks how long the journey takes. No tardes means don't be long.","ex":[{"tag":"take time","es":"El tren tarda cuarenta minutos.","en":"The train takes forty minutes."},{"tag":"be late","es":"No tardes, te esperamos.","en":"Don't be long, we're waiting."}]},{"es":"a tiempo · con tiempo","pos":"phrase","en":"on time; in good time","note":"a la vez means at the same time; a tiempo completo full-time.","ex":[{"tag":"on time","es":"Llegamos justo a tiempo.","en":"We arrived just on time."},{"tag":"in good time","es":"Sal con tiempo, hay tráfico.","en":"Leave in good time, there's traffic."}]},{"es":"el retraso","pos":"n.m.","en":"delay","note":"con retraso means late, of trains and flights. atrasado is the adjective.","ex":[{"es":"El vuelo lleva dos horas de retraso.","en":"The flight is two hours delayed."}]},{"es":"diario · semanal","pos":"adj.","en":"daily; weekly","note":"mensual monthly, anual yearly. el diario is also a newspaper or a diary.","ex":[{"tag":"daily","es":"Es parte de mi rutina diaria.","en":"It's part of my daily routine."},{"tag":"weekly","es":"Tenemos una reunión semanal.","en":"We have a weekly meeting."}]},{"es":"anoche · anteayer","pos":"adv.","en":"last night; the day before yesterday","note":"pasado mañana is the day after tomorrow. Spanish has single words where English needs phrases.","ex":[{"tag":"last night","es":"Anoche dormí fatal.","en":"I slept terribly last night."},{"tag":"day before yesterday","es":"Llegaron anteayer.","en":"They arrived the day before yesterday."}]}]},{"id":"u45","title":"The senses and perception","intro":"Spanish pairs a deliberate verb with a passive one for each sense: mirar and ver, escuchar and oír. English uses look and see, listen and hear the same way, so the pattern is familiar — but Spanish holds to it more strictly.","entries":[{"es":"ver · mirar","pos":"v. irr.","en":"to see; to look at","note":"See unit 1 and unit 2. ver is what reaches your eyes, mirar what you point them at.","ex":[{"tag":"see","es":"No veo nada sin lentes.","en":"I can't see anything without glasses."},{"tag":"look at","es":"Mira esa foto.","en":"Look at that photo."}]},{"es":"oír · escuchar","pos":"v. irr.","en":"to hear; to listen to","note":"See unit 23 and unit 2.","ex":[{"tag":"hear","es":"¿Oyes ese ruido?","en":"Do you hear that noise?"},{"tag":"listen","es":"Escucha lo que te digo.","en":"Listen to what I'm telling you."}]},{"es":"el olor · oler","pos":"n.m. / v. irr.","en":"smell; to smell","he":"ריח / להריח","note":"oler a means to smell of: huele a café. The yo form takes an h: huelo.","ex":[{"tag":"smell (noun)","es":"Hay un olor raro en la cocina.","en":"There's a strange smell in the kitchen."},{"tag":"to smell","es":"Huele a pan recién hecho.","en":"It smells of fresh bread."}]},{"es":"el sabor · saber a","pos":"n.m. / v.","en":"taste, flavour; to taste of","note":"Yes, the same saber as to know — see unit 1. sabe a limón, it tastes of lemon.","ex":[{"tag":"flavour","es":"Tiene un sabor muy fuerte.","en":"It has a very strong flavour."},{"tag":"to taste of","es":"Sabe a naranja.","en":"It tastes of orange."}]},{"es":"tocar","pos":"v.","en":"to touch","note":"See unit 33 for its other meanings. el tacto is the sense of touch.","ex":[{"es":"No toques la pintura, está fresca.","en":"Don't touch the paint, it's wet."}]},{"es":"sentir · sentirse","pos":"v. irr.","en":"to feel (something); to feel (a way)","note":"See unit 2. sentir takes an object; sentirse takes an adjective.","ex":[{"tag":"feel something","es":"Sentí un dolor en el pecho.","en":"I felt a pain in my chest."},{"tag":"feel a way","es":"Me siento mucho mejor.","en":"I feel much better."}]},{"es":"la vista","pos":"n.f.","en":"sight, eyesight; view","he":"ראייה / נוף","note":"hasta la vista is a farewell, though less used than films suggest.","ex":[{"tag":"eyesight","es":"Tiene mala vista.","en":"His eyesight is poor."},{"tag":"view","es":"El cuarto tiene vista al mar.","en":"The room has a sea view."}]},{"es":"los lentes · las gafas","pos":"n.pl.","en":"glasses, spectacles","note":"los lentes or los anteojos in Latin America, las gafas in Spain. Always plural.","ex":[{"es":"No encuentro mis lentes.","en":"I can't find my glasses."}]},{"es":"la luz · la oscuridad","pos":"n.f.","en":"light; darkness","note":"See unit 19 for la luz meaning electricity.","ex":[{"tag":"light","es":"Entra mucha luz por la mañana.","en":"A lot of light comes in in the morning."},{"tag":"darkness","es":"No me gusta la oscuridad.","en":"I don't like the dark."}]},{"es":"brillante · opaco","pos":"adj.","en":"bright, shiny; dull, matt","note":"brillar is to shine. brillante of a person means brilliant.","ex":[{"tag":"bright","es":"El sol estaba brillante.","en":"The sun was bright."},{"tag":"dull","es":"Quedó con un acabado opaco.","en":"It ended up with a matt finish."}]},{"es":"suave · áspero","pos":"adj.","en":"smooth, soft, gentle; rough","he":"חלק / מחוספס","ex":[{"tag":"smooth","es":"La tela es muy suave.","en":"The fabric is very soft."},{"tag":"rough","es":"La piedra es áspera al tacto.","en":"The stone is rough to the touch."}]},{"es":"el silencio · el sonido","pos":"n.m.","en":"silence; sound","note":"sonar is to sound or to ring: suena el teléfono.","ex":[{"tag":"silence","es":"Se hizo un silencio total.","en":"A complete silence fell."},{"tag":"sound","es":"Me despertó un sonido raro.","en":"A strange sound woke me."}]},{"es":"notar","pos":"v.","en":"to notice","note":"darse cuenta de is the commoner way to say it — see unit 24.","ex":[{"es":"¿Notaste algo diferente?","en":"Did you notice anything different?"}]},{"es":"el gesto","pos":"n.m.","en":"gesture, expression","note":"hacer un gesto is to make a gesture. la cara or la expresión for a facial one.","ex":[{"es":"Hizo un gesto de aprobación.","en":"He made a gesture of approval."}]},{"es":"señalar","pos":"v.","en":"to point at; to point out, to indicate","he":"להצביע / לציין","ex":[{"tag":"point at","es":"Señaló la puerta sin hablar.","en":"He pointed at the door without speaking."},{"tag":"point out","es":"Señaló varios errores.","en":"She pointed out several mistakes."}]},{"es":"la señal","pos":"n.f.","en":"sign, signal","note":"la señal de tráfico is a road sign; no hay señal, there's no signal.","ex":[{"es":"No había señal en el celular.","en":"There was no signal on my phone."}]},{"es":"parecerse a","pos":"v. irr.","en":"to look like, to resemble","note":"From parecer — see unit 24. Reflexive and takes a.","ex":[{"es":"Se parece mucho a su madre.","en":"She looks a lot like her mother."}]},{"es":"la imagen","pos":"n.f.","en":"image, picture","note":"Plural imágenes, which gains an accent. la foto is a photo — see unit 27.","ex":[{"es":"La imagen no se ve bien.","en":"The image isn't showing properly."}]},{"es":"el color · la forma","pos":"n.","en":"colour; shape, form","note":"See unit 14. de esta forma means in this way.","ex":[{"tag":"colour","es":"Me gusta el color de la pared.","en":"I like the colour of the wall."},{"tag":"shape","es":"Tiene forma de corazón.","en":"It's heart-shaped."}]},{"es":"el detalle","pos":"n.m.","en":"detail; a thoughtful gesture","he":"פרט / מחווה","note":"¡Qué detalle! means how thoughtful.","ex":[{"tag":"detail","es":"Cuéntame todos los detalles.","en":"Tell me all the details."},{"tag":"kind gesture","es":"Las flores fueron un lindo detalle.","en":"The flowers were a lovely gesture."}]}]},{"id":"u46","title":"Celebrations and the year's holidays","intro":"Holidays are a large part of the calendar in Spanish-speaking countries, and the greetings are fixed formulas. Note that feliz goes before the noun: Feliz Navidad, Feliz cumpleaños.","entries":[{"es":"la fiesta","pos":"n.f.","en":"party, celebration; public holiday","note":"See unit 33. el día festivo or el feriado is a public holiday.","ex":[{"tag":"party","es":"Hicieron una fiesta enorme.","en":"They threw a huge party."},{"tag":"holiday","es":"El viernes es día festivo.","en":"Friday is a public holiday."}]},{"es":"las vacaciones","pos":"n.f.pl.","en":"holiday, holidays, vacation","he":"חופשה","note":"Always plural. estar de vacaciones is to be on holiday.","ex":[{"es":"Nos vamos de vacaciones en julio.","en":"We're going on holiday in July."}]},{"es":"la Navidad","pos":"n.f.","en":"Christmas","note":"Capitalised. la Nochebuena is Christmas Eve, and is the bigger celebration of the two.","ex":[{"es":"Pasamos la Navidad con mis suegros.","en":"We spent Christmas with my in-laws."}]},{"es":"el Año Nuevo","pos":"n.m.","en":"New Year","note":"la Nochevieja or el fin de año is New Year's Eve.","ex":[{"es":"¡Feliz Año Nuevo!","en":"Happy New Year!"}]},{"es":"el cumpleaños","pos":"n.m.","en":"birthday","note":"See unit 10. cumplir años is to have a birthday: cumplo treinta.","ex":[{"es":"¿Cuándo es tu cumpleaños?","en":"When is your birthday?"}]},{"es":"felicitar","pos":"v.","en":"to congratulate","note":"¡Felicidades! and ¡Felicitaciones! are both congratulations.","ex":[{"es":"Vinieron a felicitarnos.","en":"They came to congratulate us."}]},{"es":"celebrar","pos":"v.","en":"to celebrate; to hold (an event)","ex":[{"tag":"celebrate","es":"Celebramos su graduación.","en":"We celebrated her graduation."},{"tag":"hold","es":"La reunión se celebra en mayo.","en":"The meeting is held in May."}]},{"es":"el pastel · la torta","pos":"n.","en":"cake","note":"el pastel in Mexico, la torta further south. In Mexico la torta is a filled bread roll — a real difference.","ex":[{"es":"Apagó las velas del pastel.","en":"She blew out the candles on the cake."}]},{"es":"la vela","pos":"n.f.","en":"candle; sail","he":"נר / מפרש","ex":[{"tag":"candle","es":"Encendimos velas cuando se fue la luz.","en":"We lit candles when the power went out."},{"tag":"sail","es":"El barco de vela salió al amanecer.","en":"The sailing boat left at dawn."}]},{"es":"el globo","pos":"n.m.","en":"balloon; globe","ex":[{"tag":"balloon","es":"Los niños reventaron los globos.","en":"The children burst the balloons."},{"tag":"globe","es":"Señaló España en el globo.","en":"He pointed at Spain on the globe."}]},{"es":"el desfile","pos":"n.m.","en":"parade, procession","note":"desfilar is to parade. la procesión is a religious procession.","ex":[{"es":"El desfile pasa por la avenida principal.","en":"The parade goes along the main avenue."}]},{"es":"los fuegos artificiales","pos":"n.m.pl.","en":"fireworks","note":"Also los cohetes for rockets and bangers.","ex":[{"es":"Hubo fuegos artificiales a medianoche.","en":"There were fireworks at midnight."}]},{"es":"la iglesia · la misa","pos":"n.f.","en":"church; mass","note":"See unit 8. ir a misa is to go to mass.","ex":[{"tag":"church","es":"La iglesia estaba llena.","en":"The church was full."},{"tag":"mass","es":"La misa empieza a las siete.","en":"Mass starts at seven."}]},{"es":"rezar","pos":"v.","en":"to pray","note":"la oración is a prayer, and also a grammatical sentence — see unit 23.","ex":[{"es":"Reza todas las noches.","en":"She prays every night."}]},{"es":"Dios","pos":"n.m.","en":"God","note":"Appears constantly in set phrases regardless of belief: gracias a Dios, si Dios quiere, ¡Dios mío!","ex":[{"es":"Gracias a Dios llegaron bien.","en":"Thank God they arrived safely."}]},{"es":"el santo · la Semana Santa","pos":"n.","en":"saint, saint's day; Holy Week, Easter","note":"Many people celebrate their santo as well as their birthday. Semana Santa is the biggest holiday of the year in much of the region.","ex":[{"tag":"saint's day","es":"Mañana es su santo.","en":"Tomorrow is his saint's day."},{"tag":"Holy Week","es":"Viajamos en Semana Santa.","en":"We travel during Holy Week."}]},{"es":"el regalo · el detalle","pos":"n.m.","en":"present; a small gift","note":"See unit 28 and unit 45. envolver is to wrap.","ex":[{"tag":"present","es":"Abrió los regalos por la mañana.","en":"She opened the presents in the morning."},{"tag":"small gift","es":"Le llevé un detalle a la anfitriona.","en":"I took a small gift for the host."}]},{"es":"la tradición · la costumbre","pos":"n.f.","en":"tradition; custom","note":"See unit 31 for la costumbre.","ex":[{"tag":"tradition","es":"Es una tradición familiar.","en":"It's a family tradition."},{"tag":"custom","es":"Aquí la costumbre es cenar tarde.","en":"Here the custom is to eat late."}]},{"es":"el baile · la música","pos":"n.","en":"dance, dancing; music","note":"See unit 33. No celebration in the region happens without both.","ex":[{"tag":"dancing","es":"El baile duró hasta el amanecer.","en":"The dancing went on until dawn."},{"tag":"music","es":"La música estaba altísima.","en":"The music was very loud."}]},{"es":"disfrutar","pos":"v.","en":"to enjoy","note":"disfrutar de algo, or just disfrutar algo. See divertirse in unit 33.","ex":[{"es":"Disfrutamos mucho la fiesta.","en":"We really enjoyed the party."}]}]},{"id":"u47","title":"The office and doing business","intro":"Working vocabulary for meetings, deadlines and paperwork. See unit 17 for jobs and unit 37 for officialdom.","entries":[{"es":"el proyecto","pos":"n.m.","en":"project, plan","note":"el plan is a plan in general — see unit 42.","ex":[{"es":"El proyecto empieza en enero.","en":"The project starts in January."}]},{"es":"el informe","pos":"n.m.","en":"report","note":"el reporte is also used in Latin America.","ex":[{"es":"Entregué el informe el viernes.","en":"I handed in the report on Friday."}]},{"es":"el plazo","pos":"n.m.","en":"deadline, time limit; instalment","he":"מועד אחרון / תשלום","note":"a corto plazo is short-term; a largo plazo long-term; pagar a plazos to pay in instalments.","ex":[{"tag":"deadline","es":"El plazo vence el lunes.","en":"The deadline is Monday."},{"tag":"instalment","es":"Lo pagamos en doce plazos.","en":"We paid for it in twelve instalments."}]},{"es":"la junta · la reunión","pos":"n.f.","en":"meeting; board","note":"la junta is the usual word for a meeting in Mexico, and also a governing board.","ex":[{"tag":"meeting","es":"La junta es a las diez.","en":"The meeting is at ten."},{"tag":"board","es":"La junta directiva lo aprobó.","en":"The board approved it."}]},{"es":"el puesto","pos":"n.m.","en":"post, position, job; market stall","he":"תפקיד / דוכן","ex":[{"tag":"position","es":"Solicitó el puesto de gerente.","en":"He applied for the manager's post."},{"tag":"stall","es":"Compré fruta en un puesto del mercado.","en":"I bought fruit at a market stall."}]},{"es":"el gerente","pos":"n.","en":"manager","note":"el jefe is the boss — see unit 17. el director the director or head.","ex":[{"es":"Habla con el gerente, por favor.","en":"Speak to the manager, please."}]},{"es":"la venta · la compra","pos":"n.f.","en":"sale; purchase","note":"en venta means for sale. See unit 18 for the verbs.","ex":[{"tag":"sale","es":"Las ventas subieron un diez por ciento.","en":"Sales rose by ten per cent."},{"tag":"purchase","es":"Guarde el recibo de compra.","en":"Keep the purchase receipt."}]},{"es":"el contrato","pos":"n.m.","en":"contract","note":"firmar un contrato is to sign a contract — see unit 37.","ex":[{"es":"El contrato dura un año.","en":"The contract runs for a year."}]},{"es":"la factura","pos":"n.f.","en":"invoice, bill","note":"el recibo is a receipt; la cuenta the bill in a restaurant — see unit 12.","ex":[{"es":"Mándame la factura por correo.","en":"Send me the invoice by email."}]},{"es":"el presupuesto","pos":"n.m.","en":"budget; quote, estimate","he":"תקציב / הצעת מחיר","ex":[{"tag":"budget","es":"No hay presupuesto para eso.","en":"There's no budget for that."},{"tag":"quote","es":"Pedí tres presupuestos distintos.","en":"I asked for three different quotes."}]},{"es":"la ganancia · la pérdida","pos":"n.f.","en":"profit; loss","note":"From ganar and perder — see unit 17 and unit 28.","ex":[{"tag":"profit","es":"Las ganancias del año fueron buenas.","en":"The year's profits were good."},{"tag":"loss","es":"Cerraron por las pérdidas.","en":"They closed because of the losses."}]},{"es":"el negocio","pos":"n.m.","en":"business; deal; shop","he":"עסק / עסקה","ex":[{"tag":"business","es":"Abrió un negocio propio.","en":"She opened her own business."},{"tag":"deal","es":"Cerramos el negocio ayer.","en":"We closed the deal yesterday."},{"tag":"shop","es":"Hay varios negocios en esa calle.","en":"There are several shops on that street."}]},{"es":"el socio","pos":"n.m.","en":"partner, associate; member","he":"שותף / חבר","ex":[{"tag":"partner","es":"Es mi socio desde hace diez años.","en":"He's been my business partner for ten years."},{"tag":"member","es":"Sólo entran los socios del club.","en":"Only club members may enter."}]},{"es":"encargarse de","pos":"v.","en":"to take charge of, to see to","he":"לטפל ב-","note":"el encargado is the person in charge. Yo me encargo means leave it to me.","ex":[{"es":"Yo me encargo de las bebidas.","en":"I'll take care of the drinks."}]},{"es":"el pedido","pos":"n.m.","en":"order (of goods)","note":"From pedir — see unit 2. hacer un pedido is to place an order.","ex":[{"es":"El pedido llega el jueves.","en":"The order arrives on Thursday."}]},{"es":"el cliente · el proveedor","pos":"n.m.","en":"customer; supplier","note":"See unit 17 for el cliente.","ex":[{"tag":"customer","es":"El cliente llamó dos veces.","en":"The customer called twice."},{"tag":"supplier","es":"Cambiamos de proveedor.","en":"We changed suppliers."}]},{"es":"la copia · el original","pos":"n.","en":"copy; original","note":"sacar copias is to make photocopies.","ex":[{"tag":"copy","es":"Necesito una copia del contrato.","en":"I need a copy of the contract."},{"tag":"original","es":"Traiga el original y una copia.","en":"Bring the original and a copy."}]},{"es":"la cifra · el dato","pos":"n.","en":"figure, number; piece of data","note":"los datos are data, and also personal details on a form.","ex":[{"tag":"figure","es":"Las cifras no cuadran.","en":"The figures don't add up."},{"tag":"data","es":"Faltan algunos datos.","en":"Some details are missing."}]},{"es":"aumentar · disminuir","pos":"v. irr.","en":"to increase; to decrease","note":"subir and bajar do the same job in speech — see unit 22.","ex":[{"tag":"increase","es":"Los precios aumentaron en marzo.","en":"Prices increased in March."},{"tag":"decrease","es":"El consumo disminuyó a la mitad.","en":"Consumption fell by half."}]},{"es":"el éxito · el fracaso","pos":"n.m.","en":"success; failure","he":"הצלחה / כישלון","warn":"el éxito is not an exit. The exit is la salida. tener éxito is to be successful.","ex":[{"tag":"success","es":"La campaña fue un éxito.","en":"The campaign was a success."},{"tag":"failure","es":"El proyecto fue un fracaso.","en":"The project was a failure."}]}]},{"id":"u48","title":"On the road","intro":"Driving, road signs and the words you need when something goes wrong. See unit 8 and unit 41 for the town itself, unit 22 for the journey.","entries":[{"es":"la carretera","pos":"n.f.","en":"road, highway","note":"la autopista is a motorway, usually with a toll (la cuota or el peaje).","ex":[{"es":"La carretera está en obras.","en":"The road is under repair."}]},{"es":"el camión","pos":"n.m.","en":"lorry, truck; bus (Mexico)","he":"משאית / אוטובוס","note":"A real ambiguity: in Mexico el camión is the bus. Elsewhere it is a lorry.","ex":[{"tag":"lorry","es":"El camión bloqueaba la calle.","en":"The lorry was blocking the street."},{"tag":"bus","es":"Tomé el camión a Puebla.","en":"I took the bus to Puebla."}]},{"es":"la bicicleta · la moto","pos":"n.f.","en":"bicycle; motorbike","note":"la bici and la moto are the everyday short forms. la moto is feminine, short for la motocicleta.","ex":[{"tag":"bicycle","es":"Voy al trabajo en bicicleta.","en":"I cycle to work."},{"tag":"motorbike","es":"Se compró una moto usada.","en":"He bought a second-hand motorbike."}]},{"es":"el barco","pos":"n.m.","en":"boat, ship","note":"el buque is a large vessel; la lancha a small motorboat.","ex":[{"es":"Cruzamos en barco.","en":"We crossed by boat."}]},{"es":"la llanta · el neumático","pos":"n.","en":"tyre","note":"la llanta in Latin America, el neumático in Spain. la rueda is the wheel.","ex":[{"es":"Se me pinchó una llanta.","en":"I got a flat tyre."}]},{"es":"el volante · el freno","pos":"n.m.","en":"steering wheel; brake","note":"frenar is to brake; acelerar to accelerate.","ex":[{"tag":"steering wheel","es":"No suelte el volante.","en":"Don't let go of the steering wheel."},{"tag":"brake","es":"Los frenos no responden bien.","en":"The brakes aren't responding properly."}]},{"es":"la velocidad","pos":"n.f.","en":"speed","note":"el límite de velocidad is the speed limit; rápido and lento are fast and slow.","ex":[{"es":"Iba a mucha velocidad.","en":"He was going very fast."}]},{"es":"el accidente","pos":"n.m.","en":"accident","note":"chocar is to crash; el choque the crash.","ex":[{"es":"Hubo un accidente en la curva.","en":"There was an accident on the bend."}]},{"es":"la licencia","pos":"n.f.","en":"licence; leave (from work)","he":"רישיון / חופשה","note":"la licencia de conducir or el permiso de conducir is a driving licence.","ex":[{"tag":"licence","es":"Muéstreme su licencia, por favor.","en":"Show me your licence, please."},{"tag":"leave","es":"Está de licencia por enfermedad.","en":"She's on sick leave."}]},{"es":"el mapa","pos":"n.m.","en":"map","note":"Masculine despite the -a. el plano is a street plan.","ex":[{"es":"Búscalo en el mapa.","en":"Look for it on the map."}]},{"es":"la ruta · el recorrido","pos":"n.","en":"route; journey, run","ex":[{"tag":"route","es":"Tomamos la ruta más corta.","en":"We took the shortest route."},{"tag":"run","es":"El recorrido dura una hora.","en":"The run takes an hour."}]},{"es":"el conductor / la conductora","pos":"n.","en":"driver","note":"el chofer in Latin America, especially of a hired driver.","ex":[{"es":"El conductor no vio la señal.","en":"The driver didn't see the sign."}]},{"es":"el pasajero","pos":"n.m.","en":"passenger","note":"el peatón is a pedestrian.","ex":[{"es":"Los pasajeros bajaron rápido.","en":"The passengers got off quickly."}]},{"es":"el asiento","pos":"n.m.","en":"seat","note":"tomar asiento is to take a seat; el cinturón the seatbelt.","ex":[{"es":"Mi asiento es el catorce.","en":"My seat is number fourteen."}]},{"es":"la llegada · la salida","pos":"n.f.","en":"arrival; departure, exit","note":"The two words on every airport board.","ex":[{"tag":"arrival","es":"La llegada está prevista a las seis.","en":"Arrival is scheduled for six."},{"tag":"departure","es":"La salida se retrasó una hora.","en":"Departure was delayed by an hour."}]},{"es":"el equipaje","pos":"n.m.","en":"luggage, baggage","note":"Singular and uncountable, like la ropa. la maleta is the case — see unit 22.","ex":[{"es":"Perdieron mi equipaje.","en":"They lost my luggage."}]},{"es":"la aduana","pos":"n.f.","en":"customs","note":"declarar is to declare; la frontera the border.","ex":[{"es":"Nos revisaron en la aduana.","en":"They searched us at customs."}]},{"es":"la frontera","pos":"n.f.","en":"border, frontier","ex":[{"es":"Cruzamos la frontera de noche.","en":"We crossed the border at night."}]},{"es":"el vuelo","pos":"n.m.","en":"flight","note":"volar is to fly; la escala a stopover; despegar and aterrizar to take off and land.","ex":[{"es":"El vuelo hace una escala en Bogotá.","en":"The flight has a stopover in Bogotá."}]},{"es":"el taxi · el chofer","pos":"n.m.","en":"taxi; driver","note":"In Mexico el taxista is the taxi driver.","ex":[{"tag":"taxi","es":"Pedimos un taxi por teléfono.","en":"We ordered a taxi by phone."},{"tag":"driver","es":"El chofer conocía un atajo.","en":"The driver knew a shortcut."}]}]},{"id":"u49","title":"Set phrases worth knowing whole","intro":"Fixed expressions that no amount of word-by-word knowledge will give you. Learn each as a single unit, the way you learned the greetings in unit 5.","entries":[{"es":"tener que","pos":"phrase","en":"to have to, must","he":"חייב","note":"The commonest way to express obligation, ahead of deber. hay que is the impersonal version: one must.","ex":[{"tag":"personal","es":"Tengo que irme ya.","en":"I have to go now."},{"tag":"impersonal","es":"Hay que llegar temprano.","en":"One has to arrive early."}]},{"es":"ir a + infinitivo","pos":"phrase","en":"to be going to","note":"The everyday future. Spanish has a proper future tense but this outnumbers it in speech.","ex":[{"es":"Voy a llamarla mañana.","en":"I'm going to call her tomorrow."}]},{"es":"acabar de + infinitivo","pos":"phrase","en":"to have just done","note":"See unit 40. acabo de comer, I've just eaten.","ex":[{"es":"Acaba de salir.","en":"He's just left."}]},{"es":"volver a + infinitivo","pos":"phrase","en":"to do again","note":"See unit 1. Where English adds again, Spanish uses a verb.","ex":[{"es":"Volvió a preguntar lo mismo.","en":"He asked the same thing again."}]},{"es":"estar a punto de","pos":"phrase","en":"to be about to","ex":[{"es":"Estaba a punto de llamarte.","en":"I was about to call you."}]},{"es":"darse cuenta de","pos":"phrase","en":"to realise","note":"See unit 24. Nothing to do with realizar.","ex":[{"es":"No se dio cuenta del error.","en":"He didn't realise the mistake."}]},{"es":"tener ganas de","pos":"phrase","en":"to feel like, to fancy","note":"See unit 20. The natural way to say you feel like doing something.","ex":[{"es":"Tengo ganas de un café.","en":"I fancy a coffee."}]},{"es":"dar igual","pos":"phrase","en":"not to matter, to make no difference","note":"Built like gustar. me da igual is I don't mind either way.","ex":[{"es":"Me da igual dónde comamos.","en":"I don't mind where we eat."}]},{"es":"por lo menos","pos":"phrase","en":"at least","note":"al menos means the same.","ex":[{"es":"Dura por lo menos dos horas.","en":"It lasts at least two hours."}]},{"es":"más o menos","pos":"phrase","en":"more or less, roughly; so-so","note":"See unit 5.","ex":[{"tag":"roughly","es":"Son más o menos veinte minutos.","en":"It's about twenty minutes."},{"tag":"so-so","es":"—¿Te gustó? —Más o menos.","en":"\"Did you like it?\" \"So-so.\""}]},{"es":"a lo mejor","pos":"phrase","en":"maybe, perhaps","note":"Unlike quizá it takes the indicative: a lo mejor viene.","ex":[{"es":"A lo mejor llueve por la tarde.","en":"Maybe it'll rain this afternoon."}]},{"es":"en serio","pos":"phrase","en":"seriously, really","note":"¿En serio? is the everyday really? tomar en serio is to take seriously.","ex":[{"es":"¿En serio te dijo eso?","en":"Did he really say that to you?"}]},{"es":"ni idea","pos":"phrase","en":"no idea","note":"Short for no tengo ni idea.","ex":[{"es":"—¿Dónde está? —Ni idea.","en":"\"Where is it?\" \"No idea.\""}]},{"es":"de nuevo · otra vez","pos":"phrase","en":"again","note":"otra vez is commoner in speech. See volver a above for the verb version.","ex":[{"es":"Lo intentó otra vez.","en":"He tried again."}]},{"es":"sobre todo · en general","pos":"phrase","en":"above all; in general","note":"See unit 32 and unit 43.","ex":[{"tag":"above all","es":"Sobre todo, no te preocupes.","en":"Above all, don't worry."},{"tag":"in general","es":"En general funciona bien.","en":"In general it works well."}]},{"es":"qué + adjetivo","pos":"phrase","en":"how ...!, what a ...!","he":"כמה...!","note":"¡Qué bonito! ¡Qué lástima! ¡Qué calor! The commonest exclamation pattern in the language.","ex":[{"es":"¡Qué bonita casa!","en":"What a lovely house!"}]},{"es":"¡Qué lástima! · ¡Qué pena!","pos":"phrase","en":"what a shame, what a pity","note":"In Colombia ¡qué pena! also means sorry or how embarrassing.","ex":[{"es":"¡Qué lástima que no pudiste venir!","en":"What a shame you couldn't come!"}]},{"es":"no importa · no pasa nada","pos":"phrase","en":"it doesn't matter; it's fine, no harm done","note":"no pasa nada is the standard reassurance after an apology.","ex":[{"tag":"doesn't matter","es":"No importa, lo hacemos después.","en":"It doesn't matter, we'll do it later."},{"tag":"it's fine","es":"—Perdón. —No pasa nada.","en":"\"Sorry.\" \"It's fine.\""}]},{"es":"por si acaso","pos":"phrase","en":"just in case","ex":[{"es":"Lleva paraguas por si acaso.","en":"Take an umbrella just in case."}]},{"es":"poco a poco","pos":"phrase","en":"little by little, gradually","note":"The standard encouragement to a learner, and true of this book.","ex":[{"es":"Poco a poco vas mejorando.","en":"Little by little you're improving."}]}]},{"id":"u50","title":"Last words: the useful remainder","intro":"The final twenty: words too frequent to leave out that belong to no theme. The first entry is the best illustration in the book of gender carrying meaning — el orden and la orden are different words.","entries":[{"es":"el orden · la orden","pos":"n.","en":"order, sequence; order, command","he":"סדר / פקודה","warn":"The gender changes the meaning outright. el orden is arrangement; la orden is an instruction, and also a religious order. Getting it wrong turns tidiness into a command.","ex":[{"tag":"sequence","es":"Los nombres están en orden alfabético.","en":"The names are in alphabetical order."},{"tag":"command","es":"Cumplió la orden sin preguntar.","en":"He carried out the order without asking."}]},{"es":"el tipo","pos":"n.m.","en":"type, kind; guy, bloke","he":"סוג / בחור","note":"The second sense is informal and can be slightly dismissive.","ex":[{"tag":"type","es":"¿Qué tipo de música te gusta?","en":"What kind of music do you like?"},{"tag":"guy","es":"Un tipo raro preguntó por ti.","en":"Some odd bloke asked after you."}]},{"es":"el punto","pos":"n.m.","en":"point; dot, full stop","note":"en punto means on the dot: a las tres en punto. estar a punto de is to be about to — see unit 49.","ex":[{"tag":"point","es":"Ése es el punto importante.","en":"That's the important point."},{"tag":"full stop","es":"Falta un punto al final.","en":"There's a full stop missing at the end."}]},{"es":"la línea","pos":"n.f.","en":"line","note":"en línea means online; la línea aérea an airline.","ex":[{"es":"Firme sobre la línea.","en":"Sign on the line."}]},{"es":"la letra","pos":"n.f.","en":"letter (of the alphabet); handwriting; lyrics","he":"אות / כתב יד / מילים","note":"Not a letter you post — that is una carta (see unit 12).","ex":[{"tag":"letter","es":"Empieza con la letra ese.","en":"It starts with the letter S."},{"tag":"handwriting","es":"Tiene muy buena letra.","en":"He has very good handwriting."},{"tag":"lyrics","es":"No me acuerdo de la letra.","en":"I can't remember the lyrics."}]},{"es":"el grupo","pos":"n.m.","en":"group, band; class","note":"See unit 33 for bands, unit 25 for school classes.","ex":[{"tag":"group","es":"Vinieron en grupo.","en":"They came as a group."},{"tag":"class","es":"Estoy en el grupo de la tarde.","en":"I'm in the afternoon class."}]},{"es":"el fondo","pos":"n.m.","en":"bottom, back; background; fund","he":"תחתית / רקע / קרן","note":"al fondo means at the back or at the far end. en el fondo means deep down.","ex":[{"tag":"back","es":"El baño está al fondo.","en":"The bathroom is at the back."},{"tag":"background","es":"Se oía música de fondo.","en":"There was music in the background."},{"tag":"fund","es":"Crearon un fondo para becas.","en":"They set up a fund for scholarships."}]},{"es":"el nivel","pos":"n.m.","en":"level, standard","note":"el nivel del mar is sea level; a nivel de at the level of.","ex":[{"es":"Su nivel de español es muy alto.","en":"Her level of Spanish is very high."}]},{"es":"la edad","pos":"n.f.","en":"age","note":"¿Qué edad tienes? is the formal way to ask; ¿cuántos años tienes? the everyday one.","ex":[{"es":"Está muy bien para su edad.","en":"He's in very good shape for his age."}]},{"es":"la marca","pos":"n.f.","en":"brand, make; mark","he":"מותג / סימן","ex":[{"tag":"brand","es":"¿De qué marca es tu carro?","en":"What make is your car?"},{"tag":"mark","es":"Dejó una marca en la mesa.","en":"It left a mark on the table."}]},{"es":"el gusto","pos":"n.m.","en":"taste; liking, pleasure","note":"mucho gusto is nice to meet you — see unit 5. con gusto means gladly.","ex":[{"tag":"taste","es":"Tiene buen gusto para la ropa.","en":"She has good taste in clothes."},{"tag":"pleasure","es":"Fue un gusto conocerte.","en":"It was a pleasure to meet you."}]},{"es":"el consejo","pos":"n.m.","en":"advice; council","he":"עצה / מועצה","note":"Countable, unlike English advice: un consejo, dos consejos. aconsejar is to advise.","ex":[{"tag":"advice","es":"¿Me das un consejo?","en":"Can you give me some advice?"},{"tag":"council","es":"El consejo se reúne el lunes.","en":"The council meets on Monday."}]},{"es":"el esfuerzo","pos":"n.m.","en":"effort","note":"hacer un esfuerzo is to make an effort; esforzarse to make an effort oneself.","ex":[{"es":"Valoro mucho tu esfuerzo.","en":"I really appreciate your effort."}]},{"es":"el riesgo","pos":"n.m.","en":"risk","note":"correr un riesgo is to run a risk; arriesgar to risk.","ex":[{"es":"No vale el riesgo.","en":"It isn't worth the risk."}]},{"es":"el apoyo","pos":"n.m.","en":"support, backing","note":"apoyar is to support, both a cause and physically leaning something.","ex":[{"es":"Contamos con el apoyo de todos.","en":"We have everyone's support."}]},{"es":"la falta","pos":"n.f.","en":"lack, absence; mistake; foul","he":"חוסר / שגיאה / עבירה","note":"hacer falta is to be needed — see unit 40. por falta de means for want of.","ex":[{"tag":"lack","es":"Se canceló por falta de dinero.","en":"It was cancelled for lack of money."},{"tag":"mistake","es":"Tiene tres faltas de ortografía.","en":"It has three spelling mistakes."},{"tag":"foul","es":"El árbitro marcó falta.","en":"The referee called a foul."}]},{"es":"la ventaja · la desventaja","pos":"n.f.","en":"advantage; disadvantage","note":"llevar ventaja is to be ahead.","ex":[{"tag":"advantage","es":"Tiene la ventaja de estar cerca.","en":"It has the advantage of being close."},{"tag":"disadvantage","es":"La única desventaja es el precio.","en":"The only disadvantage is the price."}]},{"es":"el paso","pos":"n.m.","en":"step; way through, passage","he":"צעד / מעבר","note":"paso a paso is step by step. Prohibido el paso means no entry.","ex":[{"tag":"step","es":"Es un paso importante.","en":"It's an important step."},{"tag":"passage","es":"Los árboles bloqueaban el paso.","en":"The trees blocked the way through."}]},{"es":"la vuelta","pos":"n.f.","en":"return; turn, lap; change (money)","he":"חזרה / סיבוב / עודף","note":"dar la vuelta is to turn round or to go round. In Mexico la vuelta is also your change.","ex":[{"tag":"return","es":"A la vuelta te cuento.","en":"I'll tell you when I get back."},{"tag":"lap","es":"Dio dos vueltas a la plaza.","en":"He went twice round the square."},{"tag":"change","es":"Quédese con la vuelta.","en":"Keep the change."}]},{"es":"la meta · el objetivo","pos":"n.","en":"goal, aim; finish line","note":"la meta is the finish line in a race, and a goal in life. el objetivo is also a camera lens.","ex":[{"tag":"goal","es":"Cumplimos el objetivo del año.","en":"We met the year's target."},{"tag":"finish line","es":"Cruzó la meta primero.","en":"He crossed the finish line first."}]}]}],"grammar":{"title":"The words a gloss cannot teach","intro":"These sit in the top 50 of every Spanish frequency list, and every one of them is a piece of grammar wearing the costume of a word. Read this section before the units; come back to it whenever a sentence refuses to parse.","items":[{"word":"que","gloss":"that · which · who · than","he":"ש- / אשר / מ- (בהשוואה)","senses":[{"label":"joins clauses","text":"Links a second clause to the first. English often drops it; Spanish never does.","ex":[{"es":"Creo que tiene razón.","en":"I think (that) he's right."},{"es":"Dice que no viene.","en":"She says she isn't coming."}]},{"label":"relative pronoun","text":"Covers English that, which, who and whom all at once, for people and things alike.","ex":[{"es":"La mujer que trabaja aquí es mi hermana.","en":"The woman who works here is my sister."},{"es":"El libro que leí era corto.","en":"The book I read was short."}]},{"label":"than","text":"After más or menos it forms the comparison.","ex":[{"es":"Es más caro que el otro.","en":"It's more expensive than the other one."}]}],"pitfall":"With an accent, qué is the question word what. ¿Qué dices? = What are you saying? Que dices = that you say. The accent is the entire difference."},{"word":"de","gloss":"of · from · made of","senses":[{"label":"possession","text":"Spanish has no apostrophe-s. Ownership is built backwards with de.","ex":[{"es":"el carro de mi padre","en":"my father's car"}]},{"label":"origin, material, topic","text":"Where something is from, what it is made of, what it is about.","ex":[{"es":"Soy de Israel.","en":"I'm from Israel."},{"es":"una mesa de madera","en":"a wooden table"}]}],"pitfall":"de + el always contracts to del. Never write de el. The same happens with a + el = al."},{"word":"se","gloss":"himself · herself · itself · one · each other","he":"ממלא תפקיד של התפעל / נפעל / סתמי","senses":[{"label":"reflexive","text":"The action returns to the subject. Closest to the Hebrew hitpa'el.","ex":[{"es":"Mi hijo se lava las manos.","en":"My son washes his hands."}]},{"label":"reciprocal","text":"Two or more people doing it to each other.","ex":[{"es":"Se conocieron en la escuela.","en":"They met each other at school."}]},{"label":"impersonal / passive","text":"No named actor at all. Where English says one, you, or a passive, Spanish says se. Extremely common on signs.","ex":[{"es":"Aquí se habla español.","en":"Spanish is spoken here."},{"es":"¿Cómo se dice esto?","en":"How do you say this?"}]}],"pitfall":"A fourth se exists purely for sound: le or les becomes se before lo/la/los/las. Se lo di, never le lo di."},{"word":"lo","gloss":"it · him · the abstract one","he":"אותו / הדבר ה-","senses":[{"label":"object pronoun","text":"Stands for a masculine thing or person already mentioned, and goes before the verb.","ex":[{"es":"¿El informe? Ya lo terminé.","en":"The report? I already finished it."}]},{"label":"makes a noun from an adjective","text":"lo + adjective names the quality itself. There is no English one-word equivalent.","ex":[{"es":"Lo importante es empezar.","en":"The important thing is to start."},{"es":"Eso es lo malo.","en":"That's the bad part."}]},{"label":"lo que","text":"what, in the sense of the thing which.","ex":[{"es":"No entiendo lo que quieres.","en":"I don't understand what you want."}]}],"pitfall":"lo is not the masculine of la in the article sense. The article is el. lo never precedes a normal noun."},{"word":"por","gloss":"because of · through · by · per","he":"בשל / דרך / על ידי","senses":[{"label":"cause, motive","text":"The reason behind an action. Looks backwards, at what made it happen.","ex":[{"es":"Lo hice por ti.","en":"I did it because of you / for your sake."},{"es":"Gracias por la ayuda.","en":"Thanks for the help."}]},{"label":"movement through, duration","text":"Passing along or across, or how long something lasts.","ex":[{"es":"Caminamos por el parque.","en":"We walked through the park."},{"es":"Estudió por dos horas.","en":"He studied for two hours."}]},{"label":"agent and rate","text":"The doer in a passive, and prices or rates.","ex":[{"es":"Fue escrito por un niño.","en":"It was written by a child."},{"es":"cien pesos por kilo","en":"a hundred pesos per kilo"}]}],"pitfall":"See para below. If you can substitute in order to, you need para; if you can substitute because of, you need por."},{"word":"para","gloss":"in order to · for (a recipient) · by (a deadline)","he":"כדי ל- / עבור / עד","senses":[{"label":"purpose, goal","text":"Looks forwards, at what the action aims at. Followed by an infinitive.","ex":[{"es":"Estudio para aprender.","en":"I study in order to learn."}]},{"label":"recipient, destination","text":"Who or where something is headed.","ex":[{"es":"Esta carta es para ti.","en":"This letter is for you."},{"es":"Salimos para Madrid mañana.","en":"We leave for Madrid tomorrow."}]},{"label":"deadline","text":"The point by which something must be done.","ex":[{"es":"Lo necesito para el viernes.","en":"I need it by Friday."}]}],"pitfall":"Trabajo para Ana = Ana is my boss. Trabajo por Ana = I'm covering her shift. One preposition, two very different employment situations."},{"word":"a","gloss":"to · at · the personal a","senses":[{"label":"direction, time","text":"Motion towards something, or a clock time.","ex":[{"es":"Vamos a la playa a las ocho.","en":"We're going to the beach at eight."}]},{"label":"the personal a","text":"When the direct object is a specific person, Spanish inserts an a that English has no equivalent for. Skipping it is the single most recognisable foreigner mistake.","ex":[{"es":"Veo a María.","en":"I see María."},{"es":"Veo la casa.","en":"I see the house. (no a — not a person)"}]}],"pitfall":"a + el contracts to al. Voy al banco."},{"word":"no","gloss":"no · not","senses":[{"label":"negates the verb","text":"Always immediately before the verb, and before any object pronouns attached to it.","ex":[{"es":"No lo sé.","en":"I don't know."}]},{"label":"double negatives are correct","text":"Unlike English, Spanish requires the second negative. Nada, nadie and nunca after the verb still need no in front of it.","ex":[{"es":"No veo nada.","en":"I don't see anything."},{"es":"No viene nadie.","en":"Nobody is coming."}]}]},{"word":"ya","gloss":"already · now · anymore","he":"כבר / עכשיו / יותר (בשלילה)","senses":[{"label":"already","text":"The thing has happened, sooner than expected.","ex":[{"es":"Ya comimos.","en":"We already ate."}]},{"label":"ya no — not anymore","text":"Marks a state that has ended.","ex":[{"es":"Ya no vivo allí.","en":"I don't live there anymore."}]},{"label":"now, right away","text":"In commands and answers it means immediately.","ex":[{"es":"¡Ya voy!","en":"I'm coming, right now!"}]}]},{"word":"más / menos","gloss":"more, most / less, fewer","senses":[{"label":"comparison","text":"más or menos + adjective + que. Spanish has no -er ending.","ex":[{"es":"Este camino es más corto.","en":"This road is shorter."},{"es":"Hoy hay menos gente que ayer.","en":"There are fewer people today than yesterday."}]},{"label":"superlative","text":"Add the article: el/la/los/las más.","ex":[{"es":"Es la ciudad más grande del país.","en":"It's the biggest city in the country."}]}],"pitfall":"Four comparatives are irregular and refuse más: mejor (better), peor (worse), mayor (older/greater), menor (younger/lesser)."},{"word":"si / sí","gloss":"if / yes","senses":[{"label":"si — if","text":"Introduces a condition. No accent.","ex":[{"es":"Si llueve, nos quedamos.","en":"If it rains, we'll stay."}]},{"label":"sí — yes","text":"With accent. Also used to stress a verb, the way English stresses with does.","ex":[{"es":"Sí entiendo, pero no estoy de acuerdo.","en":"I do understand, but I don't agree."}]}]},{"word":"pero / sino","gloss":"but / but rather","he":"אבל / אלא","senses":[{"label":"pero","text":"The ordinary but, adding a contrasting fact.","ex":[{"es":"Es caro pero vale la pena.","en":"It's expensive but it's worth it."}]},{"label":"sino","text":"Only after a negative, to correct it: not X but Y. Hebrew אלא maps onto it exactly.","ex":[{"es":"No es azul sino verde.","en":"It isn't blue but green."}]}]},{"word":"mismo","gloss":"same · -self · very","senses":[{"label":"the same","text":"Before the noun, with the article.","ex":[{"es":"Tomamos el mismo tren.","en":"We took the same train."}]},{"label":"intensifier","text":"After a pronoun or adverb it means exactly, -self, right there.","ex":[{"es":"Lo hizo ella misma.","en":"She did it herself."},{"es":"Aquí mismo.","en":"Right here."}]}]}]},"cognates":{"title":"Appendix A · Words you already know","intro":"These are frequent enough to belong in a top-1000 list, and transparent enough from English that a full entry would waste a page. Read the column once; you own them. Only the few whose meaning drifts from the English cognate carry a gloss.","groups":[{"label":"-ción → -tion","words":[{"es":"la información"},{"es":"la situación"},{"es":"la relación"},{"es":"la atención"},{"es":"la nación"},{"es":"la acción"},{"es":"la condición"},{"es":"la operación"},{"es":"la población","en":"population"},{"es":"la educación"},{"es":"la dirección","en":"also: address"}]},{"label":"-dad / -tad → -ty","words":[{"es":"la ciudad","en":"city, not 'citty'"},{"es":"la realidad"},{"es":"la posibilidad"},{"es":"la sociedad"},{"es":"la universidad"},{"es":"la libertad"},{"es":"la dificultad"},{"es":"la calidad","en":"quality"},{"es":"la cantidad","en":"quantity"}]},{"label":"-mente → -ly","words":[{"es":"exactamente"},{"es":"realmente"},{"es":"normalmente"},{"es":"completamente"},{"es":"generalmente"},{"es":"finalmente"},{"es":"posiblemente"},{"es":"totalmente"}]},{"label":"adjectives","words":[{"es":"importante"},{"es":"diferente"},{"es":"posible"},{"es":"necesario"},{"es":"natural"},{"es":"social"},{"es":"nacional"},{"es":"especial"},{"es":"personal"},{"es":"público"},{"es":"político"},{"es":"económico"},{"es":"final"},{"es":"central"},{"es":"normal"}]},{"label":"nouns","words":[{"es":"el problema","en":"masc. despite the -a"},{"es":"el momento"},{"es":"el grupo"},{"es":"el centro"},{"es":"el programa","en":"masc."},{"es":"el sistema","en":"masc."},{"es":"la idea"},{"es":"el proyecto"},{"es":"el doctor"},{"es":"el hotel"},{"es":"el restaurante"},{"es":"el banco","en":"also: bench"},{"es":"el hospital"},{"es":"la música"},{"es":"el teléfono"},{"es":"el minuto"},{"es":"el color"},{"es":"el animal"},{"es":"la parte"}]},{"label":"verbs","words":[{"es":"usar"},{"es":"pasar","en":"also: to happen"},{"es":"presentar"},{"es":"considerar"},{"es":"aceptar"},{"es":"decidir"},{"es":"permitir"},{"es":"existir"},{"es":"formar"},{"es":"preparar"},{"es":"visitar"},{"es":"estudiar"},{"es":"continuar"},{"es":"notar"}]},{"label":"false friends — do not trust these","words":[{"es":"actual","en":"current, not actual"},{"es":"realizar","en":"to carry out, not to realise"},{"es":"asistir","en":"to attend, not to assist"},{"es":"éxito","en":"success, not exit"},{"es":"embarazada","en":"pregnant, not embarrassed"},{"es":"sensible","en":"sensitive, not sensible"},{"es":"librería","en":"bookshop; library is biblioteca"},{"es":"recordar","en":"to remember, not to record"},{"es":"molestar","en":"to bother, nothing worse"},{"es":"largo","en":"long, not large"},{"es":"ropa","en":"clothes, not rope"},{"es":"carta","en":"letter or menu, not cart"}]}]},"plates":[{"id":"p01","title":"La casa · a floor plan","intro":"An estate agent's plan of a small house, seen from above, w const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const fold=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const icon=(n,c='i')=>`<svg class="${c}" viewBox="0 0 24 24">${IC[n]}</svg>`;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const today=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5);

/* ---------- words -------------------------------------------------- */
const ALL=[];
D.units.forEach((u,ui)=>u.entries.forEach(e=>ALL.push({...e,u:ui,un:ui+1,unit:u.title,id:u.id+'|'+e.es})));
ALL.forEach(e=>e._hay=fold([e.es,e.en,e.he||'',e.note||'',e.warn||'',...(e.ex||[]).flatMap(x=>[x.es,x.en])].join(' ')));
const first=e=>e.en.split(';')[0].trim();                 // first sense, for prompts
const typeable=e=>!/[·\/(]/.test(e.es)&&e.es.split(' ').length<=3;
const ART=/^(el|la|los|las|un|una)\s+/;

/* ---------- state -------------------------------------------------- */
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(_){return d}};
let prog=load('esp.progress.v1',{}), meta=load('esp.meta.v1',{days:[],goalDay:0,goalN:0});
const save=()=>{try{localStorage.setItem('esp.progress.v1',JSON.stringify(prog));localStorage.setItem('esp.meta.v1',JSON.stringify(meta))}catch(_){}};
const GOAL=20, BOX=[0,1,3,7,21,60];
const goalToday=()=>meta.goalDay===today()?meta.goalN:0;
function streak(){
  const s=new Set(meta.days);let n=0,d=today();
  if(!s.has(d))d--;                         // today not done yet still keeps yesterday's run
  while(s.has(d)){n++;d--}return n;
}
const learned=ui=>D.units[ui].entries.filter(e=>prog[D.units[ui].id+'|'+e.es]).length;
const dueList=()=>{const t=today();return ALL.filter(e=>prog[e.id]&&prog[e.id].due<=t)};

/* ---------- shell -------------------------------------------------- */
let tab='learn', read=null;
const TABS=[['learn','Learn','path'],['review','Review','review'],['search','Search','search'],['plates','Plates','plates']];
function topBar(title,back){
  const g=goalToday(),st=streak(),C=2*Math.PI*14,f=Math.min(1,g/GOAL);
  return `<div class="top">${back?`<button class="iconbtn" id="bk">${icon('back')}</button>`:''}
  <h1>${esc(title)}</h1>
  <span class="chip ${st?'fl':'off'}">${icon('flame')}${st}</span>
  <span class="goal" title="Daily goal"><svg viewBox="0 0 34 34"><circle cx="17" cy="17" r="14" fill="none" stroke="var(--line)" stroke-width="4"/>
  <circle cx="17" cy="17" r="14" fill="none" stroke="var(--g)" stroke-width="4" stroke-linecap="round"
  stroke-dasharray="${C}" stroke-dashoffset="${C*(1-f)}"/></svg><b>${Math.min(g,GOAL)}</b></span></div>`;
}
function navHTML(){
  const due=dueList().length;
  return TABS.map(([t,l,ic])=>`<button data-t="${t}" class="${t===tab?'on':''}">${icon(ic)}${
    t==='review'&&due?`<span class="badge">${due>99?'99+':due}</span>`:''}${l}</button>`).join('');
}
function render(){
  $('nav').innerHTML=navHTML();
  document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;read=null;render();scrollTo(0,0)});
  ({learn:vLearn,review:vReview,search:vSearch,plates:vPlates})[tab]();
}

/* ---------- learn -------------------------------------------------- */
function vLearn(){
  if(read!==null)return vRead();
  const nowU=D.units.findIndex((u,i)=>learned(i)<u.entries.length);
  const offs=[0,48,70,48,0,-48,-70,-48];
  let h=topBar('Español')+'<main>';
  h+=`<button class="readfirst" data-r="G">${icon('book')}<div><b>Read this first</b><span>${esc(D.grammar.title)} · 13 words</span></div></button>`;
  h+='<div class="path">';
  D.units.forEach((u,i)=>{
    const n=learned(i),t=u.entries.length,f=n/t,cls=n===t?'done':i===nowU?'now':'';
    const ring=`conic-gradient(var(--g) ${f*360}deg,var(--line) 0)`;
    h+=`<button class="node ${cls}" data-u="${i}" style="transform:translateX(${offs[i%8]}px)">
      ${i===nowU?'<span class="startflag">'+(n?'Continue':'Start')+'</span>':''}
      <span class="ring" style="background:${ring}"><span class="disc">${n===t?icon('check'):i+1}</span></span>
      <span class="nl">${esc(u.title)}</span><span class="ns">${n} / ${t}</span></button>`;
  });
  h+=`</div><button class="readfirst" data-r="A" style="margin-top:30px">${icon('book')}<div><b>Words you already know</b><span>Cognates and false friends</span></div></button></main>`;
  $('#app').innerHTML=h;
  document.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>openSheet(+b.dataset.u));
  document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{read=b.dataset.r;render();scrollTo(0,0)});
  const cur=document.querySelector('.node.now');
  if(cur&&!vLearn.scrolled){vLearn.scrolled=1;cur.scrollIntoView({block:'center'})}
}
function openSheet(i){
  const u=D.units[i],n=learned(i),t=u.entries.length;
  $('#sheet').innerHTML=`<div class="grab"></div><div class="k">Unit ${i+1}</div><h2>${esc(u.title)}</h2>
  <p>${esc(u.intro||'')}</p><div class="bar"><i style="width:${n/t*100}%"></i></div>
  <div class="tiny" style="text-align:left;margin:0">${n} of ${t} words learned</div>
  <div class="row"><button class="btn" id="go">${n===t?'Practise again':n?'Next lesson':'Start first lesson'}</button>
  <button class="btn ghost" id="rd">Read the unit</button></div>`;
  $('#scrim').classList.add('on');$('#sheet').classList.add('on');
  $('#go').onclick=()=>{closeSheet();startLesson(i)};
  $('#rd').onclick=()=>{closeSheet();read=i;render();scrollTo(0,0)};
}
function closeSheet(){$('#scrim').classList.remove('on');$('#sheet').classList.remove('on')}

function entryHTML(e,unit){
  let h=`<div class="e"><div class="eh">${esc(e.es)}<span class="pos">${esc(e.pos||'')}${unit?' · unit '+e.un:''}</span></div>`;
  h+=`<p class="gl">${esc(e.en.replace(/; /g,' · '))}</p>`;
  if(e.he)h+=`<p class="he" dir="rtl" lang="he">${esc(e.he)}</p>`;
  if(e.warn)h+=`<div class="warn"><b>Watch out</b>${esc(e.warn)}</div>`;
  if(e.note)h+=`<p class="note">${esc(e.note)}</p>`;
  if(e.conj){const p=['yo','tú','él','nos.','ellos'];h+='<div class="conj">'+e.conj.forms.map((f,k)=>`<span><i>${p[k]}</i>${esc(f)}</span>`).join('')+'</div>'}
  (e.ex||[]).forEach(x=>h+=`<div class="ex">${x.tag?`<span class="tag">${esc(x.tag)}</span>`:''}<span class="s">${esc(x.es)}</span><span class="t">${esc(x.en)}</span></div>`);
  return h+'</div>';
}
let hideM=false;
function vRead(){
  let title,body;
  if(read==='G'){
    title='Read this first';
    body=`<p class="lead">${esc(D.grammar.intro)}</p>`+D.grammar.items.map(it=>{
      let h=`<div class="e"><div class="eh">${esc(it.word)}</div><p class="gl">${esc(it.gloss)}</p>`;
      if(it.he)h+=`<p class="he" dir="rtl" lang="he">${esc(it.he)}</p>`;
      it.senses.forEach(s=>{h+=`<div class="ex"><span class="tag">${esc(s.label)}</span><span class="t">${esc(s.text)}</span>`+
        (s.ex||[]).map(x=>`<span class="s">${esc(x.es)}</span><span class="t">${esc(x.en)}</span>`).join('')+'</div>'});
      if(it.pitfall)h+=`<div class="warn"><b>Watch out</b>${esc(it.pitfall)}</div>`;
      return h+'</div>'}).join('');
  }else if(read==='A'){
    title='Words you know';
    body=`<p class="lead">${esc(D.cognates.intro)}</p>`+D.cognates.groups.map(g=>`<div class="sect">${esc(g.label)}</div><ul class="cog">`+
      g.words.map(w=>`<li><b>${esc(w.es)}</b>${w.en?` <span>${esc(w.en)}</span>`:''}</li>`).join('')+'</ul>').join('');
  }else{
    const u=D.units[read];title=u.title;
    body=`<p class="lead">${esc(u.intro||'')}</p><div class="seg"><button class="${hideM?'':'on'}" data-h="0">Show all</button><button class="${hideM?'on':''}" data-h="1">Quiz myself</button></div>`+
      (hideM?'<p class="lead" style="margin-top:-6px">Meanings are blurred. Press and hold a word to check it.</p>':'')+
      `<div class="${hideM?'hidden':''}">${u.entries.map(e=>entryHTML(e)).join('')}</div>`;
  }
  $('#app').innerHTML=topBar(title,true)+'<main>'+body+'</main>';
  $('#bk').onclick=()=>{read=null;hideM=false;render()};
  document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{hideM=b.dataset.h==='1';render()});
}

/* ---------- review hub --------------------------------------------- */
function vReview(){
  const due=dueList(),seen=Object.keys(prog).length;
  const strong=Object.values(prog).filter(p=>p.box>=3).length;
  let h=topBar('Review')+'<main><div class="hero">';
  h+=due.length
    ?`<div class="big">${due.length}</div><div class="cap">word${due.length===1?'':'s'} ready to review</div><button class="btn" id="rv">Review now</button>`
    :`<div class="big" style="color:var(--g)">${icon('check','i" style="width:52px;height:52px;margin:0 auto')}</div><div class="cap">${seen?"You're all caught up. New reviews appear as words come due.":'Learn a few words first. They show up here when it is time to review them.'}</div>`;
  h+=`</div><div class="stats3"><div class="stat"><b>${seen}</b><span>learned</span></div>
  <div class="stat"><b>${strong}</b><span>strong</span></div><div class="stat"><b>${streak()}</b><span>day streak</span></div></div>
  <div class="tiny">Progress is saved in this browser. Keep a copy somewhere safe.</div>
  <div class="linkrow"><button class="btn ghost" id="exp">Copy backup</button><button class="btn ghost" id="imp">Restore</button></div></main>`;
  $('#app').innerHTML=h;
  if(due.length)$('#rv').onclick=()=>startReview();
  $('#exp').onclick=async()=>{const t=JSON.stringify({prog,meta});try{await navigator.clipboard.writeText(t);alert('Backup copied.')}catch(_){prompt('Copy this backup:',t)}};
  $('#imp').onclick=()=>{const t=prompt('Paste a backup:');if(!t)return;try{const d=JSON.parse(t);
    if(d.prog){prog=d.prog;meta=d.meta||meta}else prog=d;save();alert('Restored.');render()}catch(_){alert("That doesn't look like a backup.")}};
}

/* ---------- search ------------------------------------------------- */
let lastQ='';
function vSearch(){
  $('#app').innerHTML=topBar('Search')+`<main><div class="sbox">${icon('search')}<input id="q" type="search" placeholder="Spanish, English or Hebrew"
    autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search"></div><div id="res"></div></main>`;
  const q=$('#q');q.value=lastQ;q.oninput=()=>{lastQ=q.value;results()};results();
}
function results(){
  const q=fold(lastQ.trim());
  if(q.length<2){$('#res').innerHTML='<div class="empty">Search every word, meaning and example sentence.<br>Accents are optional.</div>';return}
  const rank=e=>{const h=fold(e.es);if(h.split(/[\s·/]+/).includes(q)||h===q)return 0;if(h.includes(q))return 1;
    if(fold(e.en+' '+(e.he||'')).includes(q))return 2;return 3};
  const hits=ALL.filter(e=>e._hay.includes(q)).map(e=>[rank(e),e]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]).slice(0,80);
  $('#res').innerHTML=hits.length?`<p class="lead">${hits.length}${hits.length===80?'+':''} result${hits.length===1?'':'s'}</p>`+hits.map(e=>entryHTML(e,1)).join('')
    :'<div class="empty">No matches.</div>';
}

/* ---------- plates ------------------------------------------------- */
function vPlates(){
  $('#app').innerHTML=topBar('Plates')+'<main><p class="lead">Tap a drawing to zoom in. Hide the labels to test yourself.</p>'+D.plates.map((p,i)=>
    `<div class="plate"><h2>${esc(p.title)}</h2><div class="pfig" id="f${i}">${p.svg}</div>
    <div class="ptools"><button class="pill" data-l="${i}">Hide labels</button></div></div>`).join('')+'</main>';
  document.querySelectorAll('.pfig').forEach(f=>f.onclick=()=>{f.classList.toggle('zoom');if(!f.classList.contains('zoom'))f.scrollLeft=0});
  document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{const on=$('#f'+b.dataset.l).classList.toggle('nolab');
    b.classList.toggle('on',on);b.textContent=on?'Show labels':'Hide labels'});
}

/* ---------- lesson engine ------------------------------------------ */
// A lesson is a queue of steps. Missed questions are appended once more at the
// end, so a lesson only ends when everything in it has been answered right.
let L=null;
function distractors(w,field,n=3){
  const key=x=>fold(field==='en'?first(x):x.es.replace(ART,''));
  const pool=shuffle(ALL.filter(x=>x!==w&&key(x)!==key(w)));
  const same=pool.filter(x=>x.u===w.u),other=pool.filter(x=>x.u!==w.u&&x.pos===w.pos);
  const out=[],seen=new Set([key(w)]);
  for(const x of [...same,...other,...pool]){if(out.length===n)break;if(!seen.has(key(x))){seen.add(key(x));out.push(x)}}
  return out;
}
function startLesson(ui){
  const u=D.units[ui];
  const all=u.entries.map(e=>ALL.find(x=>x.id===u.id+'|'+e.es));
  let fresh=all.filter(w=>!prog[w.id]).slice(0,5),steps=[];
  if(fresh.length){
    fresh.forEach(w=>{steps.push({k:'meet',w},{k:'pickEn',w})});
    shuffle(fresh).forEach(w=>steps.push({k:'pickEs',w}));
    shuffle(fresh.filter(typeable)).slice(0,2).forEach(w=>steps.push({k:'type',w}));
  }else{
    // unit already learned: practise its weakest words
    const weak=all.slice().sort((a,b)=>(prog[a.id].box-prog[b.id].box)||Math.random()-.5).slice(0,8);
    weak.forEach(w=>steps.push(stepFor(w)));
  }
  run(steps,`Unit ${ui+1}`);
}
function stepFor(w){
  const b=(prog[w.id]||{box:0}).box;
  if(b>=3&&typeable(w))return{k:'type',w};
  return{k:b>=2?'pickEs':'pickEn',w};
}
function startReview(){run(shuffle(dueList()).slice(0,15).map(stepFor),'Review')}
function run(steps,label){
  L={steps,i:0,label,right:0,asked:0,missed:new Set(),words:new Set(steps.map(s=>s.w.id)),retried:new Set()};
  $('#lesson').classList.remove('hide');document.body.style.overflow='hidden';step();
}
function quit(){$('#lesson').classList.add('hide');document.body.style.overflow='';L=null;render()}
function progressBar(){return `<div class="lh"><button class="iconbtn" id="lx">${icon('close')}</button>
  <div class="lbar"><i style="width:${L.i/L.steps.length*100}%"></i></div></div>`}
function step(){
  const s=L.steps[L.i];if(!s)return finish();
  const w=s.w;let body='',foot='';
  if(s.k==='meet'){
    body=`<div class="kind">New word</div><div class="meet pop"><span class="new">Unit ${w.un}</span>
      <div class="w">${esc(w.es)}</div><div class="p">${esc(w.pos||'')}</div>
      <div class="m">${esc(w.en.replace(/; /g,' · '))}</div>${w.he?`<div class="h" dir="rtl" lang="he">${esc(w.he)}</div>`:''}
      ${w.conj?'<div class="conj">'+w.conj.forms.map((f,k)=>`<span><i>${['yo','tú','él','nos.','ellos'][k]}</i>${esc(f)}</span>`).join('')+'</div>':''}
      ${w.warn?`<div class="warn"><b>Watch out</b>${esc(w.warn)}</div>`:''}
      ${(w.ex||[])[0]?`<div class="x"><div class="s">${esc(w.ex[0].es)}</div><div class="t">${esc(w.ex[0].en)}</div></div>`:''}</div>`;
    foot=`<button class="btn" id="nx">Got it</button>`;
  }else if(s.k==='pickEn'||s.k==='pickEs'){
    const toEn=s.k==='pickEn';
    if(!s.opts)s.opts=shuffle([w,...distractors(w,toEn?'en':'es')]);
    body=`<div class="kind">${toEn?'What does this mean?':'Which is the Spanish?'}</div>
      <div class="q ${toEn?'es':''}">${esc(toEn?w.es:first(w))}</div><div class="opts">`+
      s.opts.map((o,k)=>`<button class="opt ${toEn?'':'es'}" data-o="${k}"><span class="n">${k+1}</span>${esc(toEn?first(o):o.es)}</button>`).join('')+'</div>';
    foot=`<button class="btn" id="ck" disabled>Check</button>`;
  }else{
    body=`<div class="kind">Type it in Spanish</div><div class="q">${esc(first(w))}</div>
      <input class="type" id="ty" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" lang="es" enterkeyhint="done" placeholder="${/^(el|la|los|las) /.test(w.es)?'with el or la':'Spanish'}">
      <div class="hint">Accents are forgiven, but noticed.</div>`;
    foot=`<button class="btn" id="ck" disabled>Check</button>`;
  }
  $('#lesson').innerHTML=progressBar()+`<div class="lbody">${body}</div><div class="lfoot" id="ft">${foot}</div>`;
  $('#lx').onclick=()=>{if(L.i===0||confirm('Leave the lesson? Words you already answered are saved.'))quit()};
  if(s.k==='meet'){
    $('#nx').onclick=()=>{if(!prog[w.id])prog[w.id]={box:0,due:today(),intro:today()};save();L.i++;step()};
    return;
  }
  let pick=null;
  if(s.k==='type'){
    const ty=$('#ty');setTimeout(()=>ty.focus(),60);
    ty.oninput=()=>{$('#ck').disabled=!ty.value.trim()};
    ty.onkeydown=e=>{if(e.key==='Enter'&&ty.value.trim())$('#ck').click()};
  }else{
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');pick=+b.dataset.o;$('#ck').disabled=false});
  }
  $('#ck').onclick=()=>{
    let ok,msg='',ans='';
    if(s.k==='type'){[ok,msg]=checkTyped($('#ty').value,w);$('#ty').readOnly=true;ans=w.es}
    else{
      const toEn=s.k==='pickEn',right=s.opts.indexOf(w);ok=pick===right;
      document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;b.classList.remove('sel');
        if(k===right)b.classList.add('ok');else if(k===pick)b.classList.add('bad')});
      ans=toEn?first(w):w.es;
    }
    grade(s,ok);
    const ex=(w.ex||[])[0];
    $('#ft').className='lfoot '+(ok?'ok':'bad');
    $('#ft').innerHTML=`<div class="fb pop"><span class="dot">${icon(ok?'check':'close')}</span><div>
      <b>${ok?(msg?'Correct, nearly':['Nice','Correct','That’s it','Exactly'][Math.floor(Math.random()*4)]):'Not quite'}</b>
      ${!ok?`<span>Correct answer:</span><span class="ans">${esc(ans)}</span>`:''}
      ${msg?`<span>${esc(msg)}</span>`:''}
      ${ex?`<span style="margin-top:6px;opacity:.85">${esc(ex.es)}</span>`:''}</div></div>
      <button class="btn ${ok?'':'red'}" id="nx">Continue</button>`;
    if(!ok)$('.lbody').classList.add('shake');
    $('#nx').onclick=()=>{L.i++;step()};
  };
}
function checkTyped(raw,w){
  const clean=s=>s.trim().toLowerCase().replace(/[¿?¡!.,]/g,'').replace(/\s+/g,' ');
  const got=clean(raw),want=clean(w.es);
  if(got===want)return[true,''];
  const ga=(got.match(ART)||[''])[0].trim(),wa=(want.match(ART)||[''])[0].trim();
  const gc=got.replace(ART,''),wc=want.replace(ART,'');
  const same=gc===wc,near=fold(gc)===fold(wc);
  if(!same&&!near)return[false,''];
  if(wa&&ga&&ga!==wa)return[false,`It is ${want} — mind the gender.`];
  const notes=[];
  if(!same)notes.push(`Mind the accent: ${w.es}`);
  if(wa&&!ga)notes.push(`Learn it with its article: ${w.es}`);
  return[true,notes.join('. ')];
}
function grade(s,ok){
  const w=s.w;L.asked++;
  if(meta.goalDay!==today()){meta.goalDay=today();meta.goalN=0}
  meta.goalN++;if(!meta.days.includes(today()))meta.days.push(today());
  const retry=L.retried.has(s);
  if(ok){if(!retry)L.right++}
  else{
    L.missed.add(w.id);
    if(!retry){const again={...s,opts:null};L.retried.add(again);L.steps.push(again)}
  }
  // only the first answer in a session moves the word between boxes
  if(!L.graded)L.graded=new Set();
  if(!L.graded.has(w.id)){
    L.graded.add(w.id);
    const p=prog[w.id]||{box:0,intro:today()};
    p.box=ok?Math.min(p.box+1,BOX.length-1):0;
    p.due=today()+BOX[p.box];prog[w.id]=p;
  }
  save();
}
function finish(){
  const pct=L.asked?Math.round(L.right/(L.asked-L.retried.size)*100):100;
  const n=L.words.size,st=streak();
  $('#lesson').innerHTML=`<div class="lbody done"><div class="medal pop">${icon('check')}</div>
    <h2>${L.label==='Review'?'Review done':'Lesson complete'}</h2>
    <p>${n} word${n===1?'':'s'} practised${L.missed.size?`, ${L.missed.size} to keep an eye on`:''}.</p>
    <div class="stats3"><div class="stat"><b>${Math.max(0,Math.min(100,pct))}%</b><span>first try</span></div>
    <div class="stat"><b>${goalToday()}</b><span>of ${GOAL} today</span></div><div class="stat"><b>${st}</b><span>day streak</span></div></div></div>
    <div class="lfoot"><button class="btn" id="nx">Continue</button></div>`;
  $('#nx').onclick=quit;
}

$('#scrim').onclick=closeSheet;
render();
</script>
</body></html>
