ort in a week."}]},{"es":"tomar","pos":"v.","en":"to take; to drink","note":"See unit 2. In Latin America it is the default for both.","ex":[{"tag":"take","es":"Toma asiento, por favor.","en":"Take a seat, please."},{"tag":"drink","es":"Tomamos algo después del trabajo.","en":"We had a drink after work."}]},{"es":"agarrar","pos":"v.","en":"to grab, to take hold of; to catch","he":"לתפוס","note":"The safe Latin American alternative to coger — see the warning in unit 2.","ex":[{"tag":"grab","es":"Agarra bien la bolsa.","en":"Hold the bag tightly."},{"tag":"catch","es":"Agarré el último autobús.","en":"I caught the last bus."}]},{"es":"soltar","pos":"v. irr.","en":"to let go of, to release","conj":{"label":"pres.","forms":["suelto","sueltas","suelta","soltamos","sueltan"]},"ex":[{"es":"Suelta mi brazo.","en":"Let go of my arm."}]},{"es":"regalar","pos":"v.","en":"to give as a present","note":"el regalo is the present. Spanish has a separate verb where English says give a present.","ex":[{"es":"Me regalaron un libro.","en":"They gave me a book as a present."}]},{"es":"mandar · enviar","pos":"v.","en":"to send; (mandar) to order, to be in charge","he":"לשלוח / לצוות","ex":[{"tag":"send","es":"Te mando la dirección por mensaje.","en":"I'll send you the address by message."},{"tag":"be in charge","es":"Aquí manda ella.","en":"She's the one in charge here."}]},{"es":"recibir","pos":"v.","en":"to receive; to welcome, to see (a visitor)","ex":[{"tag":"receive","es":"Recibí tu carta ayer.","en":"I received your letter yesterday."},{"tag":"welcome","es":"El doctor recibe de nueve a una.","en":"The doctor sees patients from nine to one."}]},{"es":"devolver","pos":"v. irr.","en":"to give back, to return (something)","note":"volver is to come back yourself; devolver is to give a thing back.","conj":{"label":"pres.","forms":["devuelvo","devuelves","devuelve","devolvemos","devuelven"]},"ex":[{"es":"Devuélveme el libro cuando puedas.","en":"Give me the book back when you can."}]},{"es":"perder","pos":"v. irr.","en":"to lose; to miss (a train, a chance)","he":"לאבד / לפספס","conj":{"label":"pres.","forms":["pierdo","pierdes","pierde","perdemos","pierden"]},"ex":[{"tag":"lose","es":"Perdí el paraguas en el taxi.","en":"I lost my umbrella in the taxi."},{"tag":"miss","es":"Perdimos el vuelo por el tráfico.","en":"We missed the flight because of the traffic."}]},{"es":"guardar","pos":"v.","en":"to keep, to put away","note":"See unit 27 for the computing sense.","ex":[{"es":"Guarda esto en un lugar seguro.","en":"Keep this somewhere safe."}]},{"es":"usar","pos":"v.","en":"to use; to wear","he":"להשתמש / ללבוש","note":"usar lentes is to wear glasses — usar covers habitual wearing, llevar what you have on today.","ex":[{"tag":"use","es":"Usa este cuchillo, corta mejor.","en":"Use this knife, it cuts better."},{"tag":"wear","es":"Usa lentes desde niña.","en":"She's worn glasses since she was a girl."}]},{"es":"servir","pos":"v. irr.","en":"to serve; to be useful, to work","he":"להגיש / להיות שימושי","note":"no sirve means it's no good, it doesn't work. ¿para qué sirve? is what's it for?","conj":{"label":"pres.","forms":["sirvo","sirves","sirve","servimos","sirven"]},"ex":[{"tag":"serve","es":"Sirvieron la cena a las nueve.","en":"They served dinner at nine."},{"tag":"be useful","es":"Esta llave no sirve.","en":"This key is no good."}]},{"es":"ayudar","pos":"v.","en":"to help","note":"ayudar a + infinitive: me ayudó a cargar las bolsas. la ayuda is help.","ex":[{"es":"¿Te ayudo con eso?","en":"Shall I help you with that?"}]},{"es":"el regalo","pos":"n.m.","en":"present, gift","ex":[{"es":"Todavía no compré los regalos.","en":"I haven't bought the presents yet."}]},{"es":"la cosa","pos":"n.f.","en":"thing","note":"The most useful noun in the language when you don't know the word. otra cosa is something else.","ex":[{"es":"Deja tus cosas en el cuarto.","en":"Leave your things in the room."}]},{"es":"el objeto","pos":"n.m.","en":"object; purpose","ex":[{"tag":"object","es":"Encontraron varios objetos antiguos.","en":"They found several old objects."},{"tag":"purpose","es":"¿Cuál es el objeto de la reunión?","en":"What is the purpose of the meeting?"}]},{"es":"el pedazo","pos":"n.m.","en":"piece, bit","note":"la pieza is a component or a room; el trozo a chunk.","ex":[{"es":"¿Quieres un pedazo de pastel?","en":"Would you like a piece of cake?"}]},{"es":"la parte","pos":"n.f.","en":"part; place, side","he":"חלק / מקום","note":"en alguna parte means somewhere; por otra parte means on the other hand.","ex":[{"tag":"part","es":"La primera parte es la más difícil.","en":"The first part is the hardest."},{"tag":"place","es":"Lo vi en alguna parte.","en":"I saw it somewhere."}]}]},{"id":"u29","title":"Making, breaking and fixing","intro":"Spanish is fond of the accidental construction: se rompió el vaso, the glass broke, with no one to blame. Add me and the blame lands gently on you — se me rompió el vaso.","entries":[{"es":"hacer","pos":"v. irr.","en":"to make, to do","note":"See unit 1. Also hacerse, to become: se hizo médico.","ex":[{"es":"Hizo una mesa de madera.","en":"He made a wooden table."}]},{"es":"construir","pos":"v. irr.","en":"to build","conj":{"label":"pres.","forms":["construyo","construyes","construye","construimos","construyen"]},"ex":[{"es":"Están construyendo un puente nuevo.","en":"They're building a new bridge."}]},{"es":"romper","pos":"v.","en":"to break, to tear","note":"Irregular past participle: roto. se rompió is it broke, with no blame attached.","ex":[{"es":"Se me rompió el plato.","en":"I broke the plate."}]},{"es":"arreglar","pos":"v.","en":"to fix, to repair; to tidy up; to sort out","he":"לתקן / לסדר","ex":[{"tag":"repair","es":"¿Puedes arreglar la bicicleta?","en":"Can you fix the bicycle?"},{"tag":"tidy","es":"Arregla tu cuarto antes de salir.","en":"Tidy your room before you go out."},{"tag":"sort out","es":"Ya arreglamos el problema.","en":"We've sorted the problem out."}]},{"es":"cortar","pos":"v.","en":"to cut; to cut off","ex":[{"tag":"cut","es":"Corta el pan en rebanadas.","en":"Cut the bread into slices."},{"tag":"cut off","es":"Cortaron la luz sin avisar.","en":"They cut the power off without warning."}]},{"es":"pintar","pos":"v.","en":"to paint","note":"la pintura is both paint and a painting; el cuadro a framed picture.","ex":[{"es":"Pintamos la sala de blanco.","en":"We painted the living room white."}]},{"es":"la madera","pos":"n.f.","en":"wood (material)","note":"el árbol is the tree; la leña firewood; el bosque the forest.","ex":[{"es":"Es una silla de madera.","en":"It's a wooden chair."}]},{"es":"el metal · el hierro","pos":"n.m.","en":"metal; iron","note":"el acero is steel, el oro gold, la plata silver, el cobre copper.","ex":[{"tag":"metal","es":"La caja es de metal.","en":"The box is made of metal."},{"tag":"iron","es":"La puerta es de hierro.","en":"The door is made of iron."}]},{"es":"el vidrio","pos":"n.m.","en":"glass (material)","note":"el cristal is used in Spain and for fine glass. el vaso is a drinking glass.","ex":[{"es":"Cuidado, hay vidrio en el piso.","en":"Careful, there's glass on the floor."}]},{"es":"el plástico","pos":"n.m.","en":"plastic","ex":[{"es":"Prefiero evitar el plástico.","en":"I prefer to avoid plastic."}]},{"es":"la piedra","pos":"n.f.","en":"stone, rock","note":"la roca is a large rock; la arena sand.","ex":[{"es":"El muro es de piedra.","en":"The wall is made of stone."}]},{"es":"la herramienta","pos":"n.f.","en":"tool","note":"el martillo is a hammer; el clavo a nail; el destornillador a screwdriver.","ex":[{"es":"Trae las herramientas del garaje.","en":"Bring the tools from the garage."}]},{"es":"la máquina","pos":"n.f.","en":"machine","note":"el motor is the engine; la pieza a part.","ex":[{"es":"La máquina se paró sola.","en":"The machine stopped by itself."}]},{"es":"el trabajo manual","pos":"n.m.","en":"manual work, handiwork","note":"hecho a mano means handmade.","ex":[{"es":"Es un trabajo manual muy fino.","en":"It's very fine handiwork."}]},{"es":"intentar · tratar de","pos":"v.","en":"to try, to attempt","note":"tratar de + infinitive. tratar alone means to treat. probar is to try by tasting or testing.","ex":[{"es":"Intenté abrirlo pero no pude.","en":"I tried to open it but couldn't."}]},{"es":"lograr · conseguir","pos":"v. irr.","en":"to manage to, to achieve; to get hold of","he":"להצליח / להשיג","conj":{"label":"conseguir, pres.","forms":["consigo","consigues","consigue","conseguimos","consiguen"]},"ex":[{"tag":"manage to","es":"Logré terminar a tiempo.","en":"I managed to finish on time."},{"tag":"get hold of","es":"Conseguí boletos para el sábado.","en":"I got hold of tickets for Saturday."}]},{"es":"listo","pos":"adj.","en":"ready; clever","he":"מוכן / חכם","note":"estar listo is ready, ser listo is clever. The verb decides the meaning.","ex":[{"tag":"ready","es":"¿Ya estás listo?","en":"Are you ready?"},{"tag":"clever","es":"Es muy lista para su edad.","en":"She's very clever for her age."}]},{"es":"roto · nuevo","pos":"adj.","en":"broken; new","ex":[{"tag":"broken","es":"La ventana está rota.","en":"The window is broken."},{"tag":"new","es":"Compró un carro nuevo.","en":"He bought a new car."}]},{"es":"fuerte · débil","pos":"adj.","en":"strong, loud; weak","he":"חזק / חלש","note":"fuerte also means loud: habla más fuerte, speak up.","ex":[{"tag":"strong","es":"El café está muy fuerte.","en":"The coffee is very strong."},{"tag":"weak","es":"Se siente débil desde la gripe.","en":"He's felt weak since the flu."}]},{"es":"duro · blando","pos":"adj.","en":"hard, tough; soft","note":"For difficult use difícil; duro is physically hard or harsh.","ex":[{"tag":"hard","es":"El pan está duro.","en":"The bread is stale."},{"tag":"soft","es":"La almohada es muy blanda.","en":"The pillow is very soft."}]}]},{"id":"u30","title":"Nature and landscape","intro":"Geography words, and a few that English collapses: Spanish separates el mar from el océano loosely, but keeps la sierra, la montaña and el cerro genuinely apart by size.","entries":[{"es":"la naturaleza","pos":"n.f.","en":"nature","ex":[{"es":"Le gusta estar en la naturaleza.","en":"She likes being out in nature."}]},{"es":"el árbol","pos":"n.m.","en":"tree","note":"Plural árboles. la rama is a branch; la hoja a leaf; la raíz a root.","ex":[{"es":"Nos sentamos bajo un árbol.","en":"We sat under a tree."}]},{"es":"la flor","pos":"n.f.","en":"flower","note":"Plural flores. florecer is to bloom.","ex":[{"es":"Le llevó flores al hospital.","en":"He took her flowers at the hospital."}]},{"es":"la planta","pos":"n.f.","en":"plant; floor, storey","he":"צמח / קומה","note":"la planta baja is the ground floor — the sign in every lift in Spain.","ex":[{"tag":"plant","es":"Riega las plantas, por favor.","en":"Water the plants, please."},{"tag":"floor","es":"La oficina está en la planta baja.","en":"The office is on the ground floor."}]},{"es":"la hoja","pos":"n.f.","en":"leaf; sheet of paper","he":"עלה / דף","ex":[{"tag":"leaf","es":"Las hojas cambian de color en otoño.","en":"The leaves change colour in autumn."},{"tag":"sheet","es":"Dame una hoja en blanco.","en":"Give me a blank sheet."}]},{"es":"el pasto · la hierba","pos":"n.","en":"grass","note":"el pasto in Latin America, la hierba or el césped for a lawn.","ex":[{"es":"No pises el pasto.","en":"Don't walk on the grass."}]},{"es":"la tierra","pos":"n.f.","en":"earth, soil; land; the Earth","he":"אדמה / ארץ","note":"Capitalised as la Tierra for the planet.","ex":[{"tag":"soil","es":"La tierra está muy seca.","en":"The soil is very dry."},{"tag":"land","es":"Compraron una tierra en el sur.","en":"They bought land in the south."},{"tag":"the Earth","es":"La Tierra gira alrededor del Sol.","en":"The Earth goes round the Sun."}]},{"es":"el campo","pos":"n.m.","en":"countryside; field; field (of study)","he":"כפר / שדה / תחום","ex":[{"tag":"countryside","es":"Pasamos el fin de semana en el campo.","en":"We spent the weekend in the countryside."},{"tag":"field","es":"El campo está lleno de flores.","en":"The field is full of flowers."},{"tag":"discipline","es":"Es experta en el campo de la genética.","en":"She's an expert in the field of genetics."}]},{"es":"la montaña","pos":"n.f.","en":"mountain","note":"el cerro is a hill; la sierra a mountain range; la colina a low hill.","ex":[{"es":"Las montañas tienen nieve todo el año.","en":"The mountains have snow all year."}]},{"es":"el río","pos":"n.m.","en":"river","note":"la orilla is the bank; el arroyo a stream.","ex":[{"es":"El río creció con la lluvia.","en":"The river rose with the rain."}]},{"es":"el mar","pos":"n.m.","en":"sea","note":"Usually masculine, but sailors and poets say la mar. el océano for the ocean.","ex":[{"es":"Vivimos cerca del mar.","en":"We live near the sea."}]},{"es":"la playa","pos":"n.f.","en":"beach","note":"la costa is the coast; la arena sand; la ola a wave.","ex":[{"es":"La playa está vacía en invierno.","en":"The beach is empty in winter."}]},{"es":"el lago","pos":"n.m.","en":"lake","note":"la laguna is a lagoon or a smaller lake.","ex":[{"es":"Nadamos en el lago al amanecer.","en":"We swam in the lake at dawn."}]},{"es":"la isla","pos":"n.f.","en":"island","ex":[{"es":"La isla sólo se llega en barco.","en":"The island can only be reached by boat."}]},{"es":"el desierto","pos":"n.m.","en":"desert","note":"desierto as an adjective means deserted: una calle desierta.","ex":[{"es":"Cruzamos el desierto de noche.","en":"We crossed the desert at night."}]},{"es":"el bosque","pos":"n.m.","en":"wood, forest","note":"la selva is jungle or rainforest.","ex":[{"es":"Nos perdimos en el bosque.","en":"We got lost in the wood."}]},{"es":"el fuego","pos":"n.m.","en":"fire","note":"el incendio is a destructive blaze; quemar is to burn; el humo smoke.","ex":[{"es":"Encendieron un fuego en la playa.","en":"They lit a fire on the beach."}]},{"es":"el aire","pos":"n.m.","en":"air","note":"al aire libre means outdoors, in the open air.","ex":[{"es":"Salgamos a tomar aire.","en":"Let's go out for some air."}]},{"es":"la estrella","pos":"n.f.","en":"star","note":"la luna is the moon; el sol the sun; el cielo the sky.","ex":[{"es":"Se veían todas las estrellas.","en":"You could see every star."}]},{"es":"el mundo","pos":"n.m.","en":"world","note":"todo el mundo means everybody, not the whole world.","ex":[{"tag":"world","es":"Quiere ver el mundo.","en":"She wants to see the world."},{"tag":"everybody","es":"Todo el mundo lo sabe.","en":"Everybody knows."}]}]},{"id":"u31","title":"Character and personality","intro":"These take ser, not estar, because they describe what someone is rather than how they are today. The contrast is sharp: es aburrido means he is boring, está aburrido means he is bored.","entries":[{"es":"simpático","pos":"adj.","en":"nice, likeable, friendly","warn":"Not sympathetic. To be sympathetic is comprensivo or solidario. simpático is the commonest compliment about a person's manner.","ex":[{"es":"Su hermana es muy simpática.","en":"His sister is very nice."}]},{"es":"amable","pos":"adj.","en":"kind, polite","note":"Muy amable is the standard thank you for a courtesy.","ex":[{"es":"Fue muy amable con nosotros.","en":"He was very kind to us."}]},{"es":"serio","pos":"adj.","en":"serious; reliable","he":"רציני","ex":[{"tag":"serious","es":"Puso cara seria.","en":"He put on a serious face."},{"tag":"reliable","es":"Es una empresa seria.","en":"It's a reputable company."}]},{"es":"gracioso","pos":"adj.","en":"funny, amusing","note":"chistoso in Mexico. divertido means fun or enjoyable.","ex":[{"es":"Tu amigo es muy gracioso.","en":"Your friend is very funny."}]},{"es":"tímido","pos":"adj.","en":"shy","ex":[{"es":"De niño era muy tímido.","en":"As a boy he was very shy."}]},{"es":"valiente","pos":"adj.","en":"brave","note":"el valor is courage, and also value — see unit 33.","ex":[{"es":"Fue muy valiente al decirlo.","en":"It was brave of her to say it."}]},{"es":"inteligente","pos":"adj.","en":"intelligent, clever","note":"listo is the everyday alternative — see unit 29.","ex":[{"es":"Es inteligente pero perezoso.","en":"He's clever but lazy."}]},{"es":"perezoso · flojo","pos":"adj.","en":"lazy","note":"flojo is the common word in Latin America, and also means loose or slack.","ex":[{"es":"No seas flojo, levántate.","en":"Don't be lazy, get up."}]},{"es":"trabajador","pos":"adj. / n.m.","en":"hard-working; worker","ex":[{"tag":"hard-working","es":"Es muy trabajadora.","en":"She's very hard-working."},{"tag":"worker","es":"Los trabajadores piden aumento.","en":"The workers are asking for a rise."}]},{"es":"honesto · sincero","pos":"adj.","en":"honest; sincere","ex":[{"tag":"honest","es":"Fue honesto sobre el precio.","en":"He was honest about the price."},{"tag":"sincere","es":"Te lo digo sincero.","en":"I'm telling you sincerely."}]},{"es":"orgulloso","pos":"adj.","en":"proud; arrogant","he":"גאה / יהיר","note":"estar orgulloso de is proud of; ser orgulloso leans towards arrogant.","ex":[{"tag":"proud","es":"Estoy orgulloso de ti.","en":"I'm proud of you."},{"tag":"arrogant","es":"Es demasiado orgulloso para pedir ayuda.","en":"He's too proud to ask for help."}]},{"es":"celoso","pos":"adj.","en":"jealous","note":"los celos are jealousy, always plural.","ex":[{"es":"Se puso celoso sin razón.","en":"He got jealous for no reason."}]},{"es":"generoso · tacaño","pos":"adj.","en":"generous; stingy","ex":[{"tag":"generous","es":"Es generosa con su tiempo.","en":"She's generous with her time."},{"tag":"stingy","es":"No seas tacaño, deja propina.","en":"Don't be stingy, leave a tip."}]},{"es":"educado · grosero","pos":"adj.","en":"polite, well-mannered; rude","warn":"educado means well-mannered, not educated. For educated say culto or con estudios.","ex":[{"tag":"polite","es":"Es un niño muy educado.","en":"He's a very well-mannered boy."},{"tag":"rude","es":"Fue grosero con la mesera.","en":"He was rude to the waitress."}]},{"es":"el carácter","pos":"n.m.","en":"character, temperament","note":"Plural caracteres shifts its stress. tener mal carácter is to be bad-tempered.","ex":[{"es":"Tiene buen carácter.","en":"He has a good temperament."}]},{"es":"la costumbre","pos":"n.f.","en":"custom, habit","note":"tener la costumbre de is to be in the habit of; como de costumbre means as usual.","ex":[{"es":"Es la costumbre del pueblo.","en":"It's the village's custom."}]},{"es":"confiar","pos":"v.","en":"to trust","note":"confiar en. la confianza is trust, and also familiarity.","ex":[{"es":"Confío en ella completamente.","en":"I trust her completely."}]},{"es":"el comportamiento","pos":"n.m.","en":"behaviour","note":"portarse bien is to behave well — what parents say to children.","ex":[{"es":"Su comportamiento mejoró mucho.","en":"His behaviour improved a lot."}]},{"es":"raro · extraño","pos":"adj.","en":"strange, odd; rare","he":"מוזר / נדיר","ex":[{"tag":"strange","es":"Qué raro que no haya llamado.","en":"How strange that he hasn't called."},{"tag":"rare","es":"Es una planta muy rara.","en":"It's a very rare plant."}]},{"es":"aburrido","pos":"adj.","en":"boring; bored","he":"משעמם / משועמם","note":"The clearest ser and estar pair in the language: es aburrido, he is boring; está aburrido, he is bored.","ex":[{"tag":"boring","es":"La película es aburrida.","en":"The film is boring."},{"tag":"bored","es":"Los niños están aburridos.","en":"The children are bored."}]}]},{"id":"u32","title":"Connecting sentences","intro":"The words that turn a list of sentences into prose. Most are invariable and cost nothing to learn, and they do more for how fluent you sound than any amount of vocabulary.","entries":[{"es":"también · tampoco","pos":"adv.","en":"also, too; neither, not either","he":"גם / גם לא","note":"tampoco is the negative twin. Yo tampoco means me neither.","ex":[{"tag":"also","es":"Yo también quiero ir.","en":"I want to go too."},{"tag":"neither","es":"Tampoco me gustó el final.","en":"I didn't like the ending either."}]},{"es":"además","pos":"adv.","en":"besides, moreover, what's more","note":"además de means as well as, in addition to.","ex":[{"es":"Es caro y además está lejos.","en":"It's expensive, and what's more it's far away."}]},{"es":"sin embargo","pos":"adv.","en":"however, nevertheless","note":"The formal but. no obstante is a heavier version.","ex":[{"es":"Es difícil; sin embargo, vale la pena.","en":"It's hard; however, it's worth it."}]},{"es":"aunque","pos":"conj.","en":"although, even though; even if","he":"אף על פי ש- / גם אם","note":"With the indicative it means although; with the subjunctive, even if.","ex":[{"tag":"although","es":"Aunque llueve, vamos a salir.","en":"Although it's raining, we're going out."},{"tag":"even if","es":"Aunque llueva, saldremos.","en":"Even if it rains, we'll go out."}]},{"es":"entonces","pos":"adv.","en":"then, so; at that time","he":"אז","ex":[{"tag":"so","es":"¿Entonces vienes o no?","en":"So are you coming or not?"},{"tag":"at that time","es":"Entonces vivíamos en Lima.","en":"At that time we lived in Lima."}]},{"es":"por eso","pos":"phrase","en":"that's why, therefore","note":"por lo tanto is the formal version.","ex":[{"es":"Llovía, por eso no salimos.","en":"It was raining, that's why we didn't go out."}]},{"es":"es decir","pos":"phrase","en":"that is to say, in other words","note":"o sea does the same job and is far commoner in speech.","ex":[{"es":"Llegó tarde, es decir, perdimos el tren.","en":"He arrived late — in other words, we missed the train."}]},{"es":"o sea","pos":"phrase","en":"I mean, that is","note":"The great filler of spoken Spanish, roughly English like or I mean.","ex":[{"es":"Está cerca, o sea, unos diez minutos.","en":"It's close — I mean, about ten minutes."}]},{"es":"por ejemplo","pos":"phrase","en":"for example","ex":[{"es":"Trae algo dulce, por ejemplo fruta.","en":"Bring something sweet, for example fruit."}]},{"es":"en cambio","pos":"phrase","en":"on the other hand, whereas","note":"Marks a contrast between two subjects. Different from el cambio, change — see unit 18.","ex":[{"es":"Él es callado; ella, en cambio, habla muchísimo.","en":"He's quiet; she, on the other hand, talks a lot."}]},{"es":"mientras · mientras que","pos":"conj.","en":"while; whereas","note":"mientras for simultaneous time, mientras que for contrast.","ex":[{"tag":"while","es":"Cocino mientras escucho la radio.","en":"I cook while I listen to the radio."},{"tag":"whereas","es":"Yo pago, mientras que ella no paga nada.","en":"I pay, whereas she pays nothing."}]},{"es":"por fin · al fin","pos":"adv.","en":"at last, finally","note":"finalmente is the neutral word; por fin carries relief.","ex":[{"es":"¡Por fin llegaste!","en":"You're here at last!"}]},{"es":"sobre todo","pos":"phrase","en":"above all, especially","note":"Two words. One word, el sobretodo, is an overcoat.","ex":[{"es":"Me gusta la fruta, sobre todo el mango.","en":"I like fruit, especially mango."}]},{"es":"de todos modos","pos":"phrase","en":"anyway, in any case","note":"de todas maneras and de todas formas mean the same.","ex":[{"es":"De todos modos, gracias por avisar.","en":"Anyway, thanks for letting me know."}]},{"es":"a pesar de","pos":"prep.","en":"in spite of, despite","note":"a pesar de que + clause: a pesar de que llovía.","ex":[{"es":"Salimos a pesar del frío.","en":"We went out in spite of the cold."}]},{"es":"según","pos":"prep.","en":"according to; depending on","he":"לפי / תלוי ב-","ex":[{"tag":"according to","es":"Según el periódico, ganó el otro equipo.","en":"According to the paper, the other team won."},{"tag":"depending on","es":"Salimos según el clima.","en":"We'll leave depending on the weather."}]},{"es":"en cuanto a","pos":"phrase","en":"as for, regarding","note":"Not to be confused with en cuanto, which means as soon as.","ex":[{"es":"En cuanto al dinero, ya lo resolvimos.","en":"As for the money, we've sorted it out."}]},{"es":"ni · ni siquiera","pos":"conj. / adv.","en":"nor, not even; not even","he":"אף לא / אפילו לא","note":"ni ... ni is neither ... nor. ni siquiera intensifies it.","ex":[{"tag":"neither/nor","es":"No come ni carne ni pescado.","en":"He eats neither meat nor fish."},{"tag":"not even","es":"Ni siquiera me saludó.","en":"He didn't even say hello."}]},{"es":"o · u","pos":"conj.","en":"or","note":"Becomes u before a word starting with o: siete u ocho. The same rule turns y into e before i: padre e hijo.","ex":[{"es":"Tráeme siete u ocho, no importa.","en":"Bring me seven or eight, it doesn't matter."}]},{"es":"así","pos":"adv.","en":"like this, like that, so","he":"כך","note":"así es means that's right; así que means so, therefore.","ex":[{"tag":"like this","es":"Hazlo así.","en":"Do it like this."},{"tag":"so","es":"Estaba cerrado, así que volvimos.","en":"It was closed, so we came back."}]}]},{"id":"u33","title":"Sport, music and free time","intro":"One thing to fix early: jugar takes a for a sport (jugar al fútbol), tocar is used for playing an instrument, and practicar covers taking part in a sport generally.","entries":[{"es":"jugar","pos":"v. irr.","en":"to play (a game or sport)","note":"jugar a with sports and games; never for instruments.","conj":{"label":"pres.","forms":["juego","juegas","juega","jugamos","juegan"]},"ex":[{"es":"Jugamos al fútbol los sábados.","en":"We play football on Saturdays."}]},{"es":"tocar","pos":"v.","en":"to touch; to play (an instrument); to be someone's turn","he":"לגעת / לנגן","note":"me toca a mí means it's my turn.","ex":[{"tag":"touch","es":"No toques eso, está caliente.","en":"Don't touch that, it's hot."},{"tag":"play music","es":"Toca la guitarra muy bien.","en":"She plays the guitar very well."},{"tag":"one's turn","es":"Ahora te toca a ti.","en":"Now it's your turn."}]},{"es":"el juego","pos":"n.m.","en":"game; set (of things)","he":"משחק / מערכת","ex":[{"tag":"game","es":"Es un juego de cartas.","en":"It's a card game."},{"tag":"set","es":"Compró un juego de platos.","en":"She bought a set of plates."}]},{"es":"el partido","pos":"n.m.","en":"match, game; political party","he":"משחק / מפלגה","ex":[{"tag":"match","es":"El partido empieza a las ocho.","en":"The match starts at eight."},{"tag":"party","es":"Ganó el partido de la oposición.","en":"The opposition party won."}]},{"es":"el equipo","pos":"n.m.","en":"team; equipment","he":"קבוצה / ציוד","ex":[{"tag":"team","es":"Nuestro equipo va último.","en":"Our team is bottom."},{"tag":"equipment","es":"Trajeron el equipo de sonido.","en":"They brought the sound equipment."}]},{"es":"la pelota · el balón","pos":"n.","en":"ball","note":"la pelota is any ball; el balón the large kind used in football.","ex":[{"es":"Pásame la pelota.","en":"Pass me the ball."}]},{"es":"nadar","pos":"v.","en":"to swim","note":"la piscina is the pool, la alberca in Mexico.","ex":[{"es":"Nada todas las mañanas.","en":"He swims every morning."}]},{"es":"el ejercicio","pos":"n.m.","en":"exercise","note":"hacer ejercicio is to exercise; el gimnasio the gym.","ex":[{"es":"Hago ejercicio tres veces por semana.","en":"I exercise three times a week."}]},{"es":"ganar · perder","pos":"v. irr.","en":"to win; to lose","note":"empatar is to draw. See unit 17 for ganar meaning to earn.","ex":[{"tag":"win","es":"Ganamos tres a uno.","en":"We won three to one."},{"tag":"lose","es":"Perdieron en el último minuto.","en":"They lost in the last minute."}]},{"es":"la música","pos":"n.f.","en":"music","note":"el músico is a musician; la canción a song; el cantante a singer.","ex":[{"es":"Pon música mientras cocinamos.","en":"Put some music on while we cook."}]},{"es":"la canción","pos":"n.f.","en":"song","note":"Plural canciones. cantar is to sing.","ex":[{"es":"Esa canción me recuerda a mi madre.","en":"That song reminds me of my mother."}]},{"es":"bailar","pos":"v.","en":"to dance","note":"el baile is the dance; la danza the art form.","ex":[{"es":"No sé bailar salsa.","en":"I don't know how to dance salsa."}]},{"es":"la película","pos":"n.f.","en":"film, movie","note":"el cine is the cinema, and also cinema as an art. la serie is a TV series.","ex":[{"es":"La película dura tres horas.","en":"The film is three hours long."}]},{"es":"el cuento","pos":"n.m.","en":"short story, tale","note":"la novela is a novel. Don't confuse with la cuenta, the bill.","ex":[{"es":"Le leo un cuento cada noche.","en":"I read him a story every night."}]},{"es":"el dibujo","pos":"n.m.","en":"drawing","note":"dibujar is to draw; los dibujos animados are cartoons.","ex":[{"es":"Colgamos sus dibujos en la cocina.","en":"We put her drawings up in the kitchen."}]},{"es":"la fiesta","pos":"n.f.","en":"party; public holiday","he":"מסיבה / חג","ex":[{"tag":"party","es":"La fiesta acabó a las tres.","en":"The party ended at three."},{"tag":"holiday","es":"El lunes es fiesta.","en":"Monday is a public holiday."}]},{"es":"divertirse","pos":"v. irr.","en":"to have fun, to enjoy oneself","note":"¡Diviértete! means have fun. divertido is fun as an adjective.","conj":{"label":"pres.","forms":["me divierto","te diviertes","se divierte","nos divertimos","se divierten"]},"ex":[{"es":"Nos divertimos mucho en el viaje.","en":"We had a great time on the trip."}]},{"es":"el paseo","pos":"n.m.","en":"walk, stroll, outing","note":"dar un paseo is to go for a walk; pasear to stroll.","ex":[{"es":"Dimos un paseo por el centro.","en":"We went for a walk round the centre."}]},{"es":"el valor","pos":"n.m.","en":"value, worth; courage","he":"ערך / אומץ","ex":[{"tag":"value","es":"El cuadro tiene mucho valor.","en":"The painting is worth a lot."},{"tag":"courage","es":"No tuvo el valor de decirlo.","en":"He didn't have the courage to say it."}]},{"es":"el premio","pos":"n.m.","en":"prize, award","note":"ganar un premio is to win a prize; el campeón the champion.","ex":[{"es":"Ganó el primer premio.","en":"She won first prize."}]}]},{"id":"u34","title":"Health, pharmacy and emergencies","intro":"Read plate 3 and unit 9 first for the body itself. This unit is what you say when something is wrong. The single most useful sentence here is me duele — see unit 9.","entries":[{"es":"la farmacia","pos":"n.f.","en":"pharmacy, chemist's","note":"la droguería in Colombia. In much of Latin America pharmacies sell far more without prescription than in Europe.","ex":[{"es":"¿Hay una farmacia cerca?","en":"Is there a pharmacy nearby?"}]},{"es":"la receta","pos":"n.f.","en":"prescription; recipe","he":"מרשם / מתכון","note":"One word for both. Context does all the work.","ex":[{"tag":"prescription","es":"Necesito receta para esto.","en":"I need a prescription for this."},{"tag":"recipe","es":"Me dio la receta de su abuela.","en":"She gave me her grandmother's recipe."}]},{"es":"la pastilla","pos":"n.f.","en":"pill, tablet","note":"el medicamento is the formal word for a drug; la inyección an injection.","ex":[{"es":"Toma una pastilla cada ocho horas.","en":"Take one tablet every eight hours."}]},{"es":"la enfermedad","pos":"n.f.","en":"illness, disease","note":"enfermarse is to fall ill; el enfermero the nurse.","ex":[{"es":"Es una enfermedad común aquí.","en":"It's a common illness here."}]},{"es":"la gripe","pos":"n.f.","en":"flu","note":"el resfriado is a cold. Latin America also says la gripa.","ex":[{"es":"Estuvo en cama con gripe.","en":"He was in bed with flu."}]},{"es":"la tos","pos":"n.f.","en":"cough","note":"toser is to cough. estornudar is to sneeze.","ex":[{"es":"Tiene tos desde el domingo.","en":"She's had a cough since Sunday."}]},{"es":"la herida","pos":"n.f.","en":"wound, injury","note":"herirse is to injure oneself; lastimarse the everyday version in Latin America.","ex":[{"es":"Hay que limpiar la herida.","en":"The wound needs cleaning."}]},{"es":"la sangre","pos":"n.f.","en":"blood","note":"sangrar is to bleed. el análisis de sangre is a blood test.","ex":[{"es":"Le tomaron una muestra de sangre.","en":"They took a blood sample."}]},{"es":"el hueso","pos":"n.m.","en":"bone","note":"romperse un hueso is to break a bone. Not to be confused with el oso, bear.","ex":[{"es":"Se rompió un hueso del pie.","en":"He broke a bone in his foot."}]},{"es":"la piel","pos":"n.f.","en":"skin; leather","he":"עור","ex":[{"tag":"skin","es":"Tiene la piel muy sensible.","en":"She has very sensitive skin."},{"tag":"leather","es":"Es una chaqueta de piel.","en":"It's a leather jacket."}]},{"es":"la garganta","pos":"n.f.","en":"throat","note":"dolor de garganta is a sore throat.","ex":[{"es":"Me duele la garganta al tragar.","en":"My throat hurts when I swallow."}]},{"es":"el diente · la muela","pos":"n.","en":"tooth; back tooth, molar","note":"el dentista treats both. dolor de muelas is toothache.","ex":[{"tag":"tooth","es":"Al bebé le salió el primer diente.","en":"The baby got his first tooth."},{"tag":"molar","es":"Me sacaron una muela.","en":"They took out one of my back teeth."}]},{"es":"la cita","pos":"n.f.","en":"appointment; date; quotation","he":"תור / פגישה","note":"Not la fecha, which is a calendar date — see unit 16.","ex":[{"tag":"appointment","es":"Tengo cita con el médico a las cuatro.","en":"I have a doctor's appointment at four."},{"tag":"date","es":"Salieron en una primera cita.","en":"They went on a first date."},{"tag":"quotation","es":"Empezó con una cita de Borges.","en":"She began with a quotation from Borges."}]},{"es":"la emergencia","pos":"n.f.","en":"emergency","note":"la sala de emergencias or urgencias is the A&E department.","ex":[{"es":"Llama a emergencias.","en":"Call the emergency services."}]},{"es":"la ambulancia","pos":"n.f.","en":"ambulance","ex":[{"es":"La ambulancia llegó en diez minutos.","en":"The ambulance arrived in ten minutes."}]},{"es":"el seguro","pos":"n.m. / adj.","en":"insurance; safe, sure","he":"ביטוח / בטוח","note":"estar seguro is to be sure; el seguro médico is health insurance.","ex":[{"tag":"insurance","es":"¿Tiene seguro médico?","en":"Do you have health insurance?"},{"tag":"sure","es":"Estoy seguro de que lo vi.","en":"I'm sure I saw it."}]},{"es":"el peligro","pos":"n.m.","en":"danger","note":"peligroso is dangerous. ¡Peligro! on a sign.","ex":[{"es":"Está fuera de peligro.","en":"He's out of danger."}]},{"es":"el cuidado","pos":"n.m.","en":"care; look out!","he":"טיפול / זהירות","note":"¡Cuidado! is the universal watch out. cuidar is to look after.","ex":[{"tag":"care","es":"Necesita cuidados especiales.","en":"He needs special care."},{"tag":"look out","es":"¡Cuidado, viene un carro!","en":"Watch out, there's a car coming!"}]},{"es":"sano · saludable","pos":"adj.","en":"healthy","note":"sano of a person, saludable of food and habits.","ex":[{"es":"Come sano y duerme bien.","en":"He eats healthily and sleeps well."}]},{"es":"mejorarse","pos":"v.","en":"to get better, to recover","note":"¡Que te mejores! is get well soon. empeorar is to get worse.","ex":[{"es":"Espero que te mejores pronto.","en":"I hope you get better soon."}]}]},{"id":"u35","title":"Quantity, containers and measures","intro":"Almost everything here joins to its noun with de: un vaso de agua, un poco de sal, la mayoría de la gente. That de is not optional.","entries":[{"es":"un poco","pos":"phrase","en":"a little, a bit","note":"un poco de before a noun. poco alone means little in the sense of not much.","ex":[{"es":"Ponle un poco de sal.","en":"Put a little salt on it."}]},{"es":"demasiado","pos":"adj. / adv.","en":"too much, too many; too","he":"יותר מדי","note":"As an adjective it agrees: demasiada gente. As an adverb it never changes: habla demasiado rápido.","ex":[{"tag":"too much","es":"Hay demasiada gente aquí.","en":"There are too many people here."},{"tag":"too","es":"Es demasiado caro.","en":"It's too expensive."}]},{"es":"bastante","pos":"adj. / adv.","en":"quite a lot, enough; quite, fairly","he":"מספיק / די","ex":[{"tag":"enough","es":"Tenemos bastante comida.","en":"We have enough food."},{"tag":"fairly","es":"Está bastante lejos.","en":"It's quite far."}]},{"es":"la mayoría","pos":"n.f.","en":"the majority, most","note":"la mayoría de la gente. Takes a singular verb even about many people.","ex":[{"es":"La mayoría de los alumnos aprobó.","en":"Most of the pupils passed."}]},{"es":"la mitad","pos":"n.f.","en":"half","note":"See unit 11. la mitad de takes de; medio is the adjective.","ex":[{"es":"Nos comimos la mitad del pan.","en":"We ate half the bread."}]},{"es":"el resto","pos":"n.m.","en":"the rest, the remainder","note":"los restos are leftovers or remains.","ex":[{"es":"El resto lo hacemos mañana.","en":"We'll do the rest tomorrow."}]},{"es":"el montón","pos":"n.m.","en":"pile, heap; loads (informal)","he":"ערימה / המון","note":"un montón de is the everyday loads of.","ex":[{"tag":"pile","es":"Hay un montón de ropa en la cama.","en":"There's a pile of clothes on the bed."},{"tag":"loads","es":"Tengo un montón de trabajo.","en":"I have loads of work."}]},{"es":"el par","pos":"n.m.","en":"pair, a couple of","note":"un par de zapatos, and un par de días for a couple of days.","ex":[{"es":"Compré un par de calcetines.","en":"I bought a pair of socks."}]},{"es":"la docena","pos":"n.f.","en":"dozen","ex":[{"es":"Deme una docena de huevos.","en":"Give me a dozen eggs."}]},{"es":"el kilo · el gramo","pos":"n.m.","en":"kilo; gram","note":"Markets sell by the kilo, and prices are given as por kilo.","ex":[{"tag":"kilo","es":"Un kilo de tomates, por favor.","en":"A kilo of tomatoes, please."},{"tag":"gram","es":"Añade cien gramos de azúcar.","en":"Add a hundred grams of sugar."}]},{"es":"el litro","pos":"n.m.","en":"litre","ex":[{"es":"Compra dos litros de leche.","en":"Buy two litres of milk."}]},{"es":"el metro","pos":"n.m.","en":"metre; underground, metro","he":"מטר / רכבת תחתית","ex":[{"tag":"metre","es":"La cuerda mide tres metros.","en":"The rope is three metres long."},{"tag":"underground","es":"Tomamos el metro hasta el centro.","en":"We took the metro to the centre."}]},{"es":"el kilómetro","pos":"n.m.","en":"kilometre","note":"Distances are always metric. la milla exists but is rare.","ex":[{"es":"Está a veinte kilómetros de aquí.","en":"It's twenty kilometres from here."}]},{"es":"la caja","pos":"n.f.","en":"box; till, checkout","he":"קופסה / קופה","note":"el cajero is the cashier, and also the cash machine.","ex":[{"tag":"box","es":"Guarda los papeles en la caja.","en":"Keep the papers in the box."},{"tag":"till","es":"Pague en la caja, por favor.","en":"Pay at the till, please."}]},{"es":"la lata","pos":"n.f.","en":"tin, can; a nuisance","he":"פחית / נודניק","warn":"Not can in the sense of able to — that is poder. ¡Qué lata! means what a pain.","ex":[{"tag":"tin","es":"Abre una lata de atún.","en":"Open a tin of tuna."},{"tag":"nuisance","es":"Qué lata tener que volver.","en":"What a pain having to come back."}]},{"es":"el paquete","pos":"n.m.","en":"packet, parcel, package","ex":[{"es":"Llegó un paquete para ti.","en":"A parcel came for you."}]},{"es":"el tamaño","pos":"n.m.","en":"size","note":"For clothing say la talla, for shoes el número — see unit 13.","ex":[{"es":"¿De qué tamaño lo quiere?","en":"What size would you like it?"}]},{"es":"el peso","pos":"n.m.","en":"weight; peso (currency)","he":"משקל","note":"pesar is to weigh.","ex":[{"tag":"weight","es":"El peso del equipaje es de veinte kilos.","en":"The luggage weight is twenty kilos."},{"tag":"currency","es":"Cuesta cincuenta pesos.","en":"It costs fifty pesos."}]},{"es":"vacío · lleno","pos":"adj.","en":"empty; full","ex":[{"tag":"empty","es":"La botella está vacía.","en":"The bottle is empty."},{"tag":"full","es":"El autobús venía lleno.","en":"The bus was full."}]},{"es":"casi","pos":"adv.","en":"almost, nearly","note":"casi nunca means hardly ever; casi nada hardly anything.","ex":[{"es":"Ya casi terminamos.","en":"We're almost finished."}]}]},{"id":"u36","title":"Place and direction","intro":"Read plate 2 for the prepositions. These are the adverbs that go with them. Spanish has a three-way distance system where English has two: aquí here, ahí there near you, allí there further off.","entries":[{"es":"aquí · acá","pos":"adv.","en":"here","note":"acá is commoner in Latin America and suggests movement towards the speaker: ven acá.","ex":[{"es":"Ponlo aquí, junto a la ventana.","en":"Put it here, next to the window."}]},{"es":"ahí · allí · allá","pos":"adv.","en":"there (near you); there; over there","he":"שם / שם רחוק","note":"A genuine three-way scale: ahí is near the listener, allí further, allá vaguer and further still.","ex":[{"tag":"near you","es":"Ahí está, en tu mano.","en":"There it is, in your hand."},{"tag":"there","es":"Allí vivía mi abuela.","en":"My grandmother lived there."},{"tag":"over there","es":"Allá en el norte hace frío.","en":"Up there in the north it's cold."}]},{"es":"arriba · abajo","pos":"adv.","en":"up, upstairs; down, downstairs","he":"למעלה / למטה","ex":[{"tag":"up","es":"Los niños están arriba.","en":"The children are upstairs."},{"tag":"down","es":"Te espero abajo.","en":"I'll wait for you downstairs."}]},{"es":"adentro · afuera","pos":"adv.","en":"inside; outside","note":"Spain prefers dentro and fuera; Latin America adds the a-.","ex":[{"tag":"inside","es":"Vamos adentro, hace frío.","en":"Let's go inside, it's cold."},{"tag":"outside","es":"El perro duerme afuera.","en":"The dog sleeps outside."}]},{"es":"adelante · atrás","pos":"adv.","en":"forward, ahead; behind, back","he":"קדימה / אחורה","note":"¡Adelante! also means come in.","ex":[{"tag":"ahead","es":"Sigue adelante dos calles.","en":"Carry straight on for two streets."},{"tag":"behind","es":"Se quedó atrás con las maletas.","en":"He stayed behind with the suitcases."}]},{"es":"la derecha · la izquierda","pos":"n.f.","en":"right; left","note":"a la derecha, a la izquierda. derecho as an adverb means straight ahead, so a la derecha and derecho are different instructions.","ex":[{"tag":"right","es":"Gira a la derecha en la esquina.","en":"Turn right at the corner."},{"tag":"left","es":"El baño está a la izquierda.","en":"The bathroom is on the left."}]},{"es":"derecho","pos":"adv. / n.m.","en":"straight ahead; a right, the law","he":"ישר / זכות","note":"sigue derecho is carry straight on. los derechos humanos are human rights; estudiar derecho is to study law.","ex":[{"tag":"straight ahead","es":"Sigue derecho hasta el semáforo.","en":"Go straight on to the traffic lights."},{"tag":"a right","es":"Tienes derecho a saberlo.","en":"You have a right to know."}]},{"es":"cerca · lejos","pos":"adv.","en":"near, close; far","note":"Both take de before a noun: cerca de la escuela.","ex":[{"tag":"near","es":"Vivo cerca del mercado.","en":"I live near the market."},{"tag":"far","es":"Queda muy lejos de aquí.","en":"It's very far from here."}]},{"es":"el norte · el sur","pos":"n.m.","en":"north; south","note":"Not capitalised. al norte de means to the north of.","ex":[{"tag":"north","es":"Viven en el norte del país.","en":"They live in the north of the country."},{"tag":"south","es":"El clima del sur es más cálido.","en":"The climate in the south is warmer."}]},{"es":"el este · el oeste","pos":"n.m.","en":"east; west","ex":[{"tag":"east","es":"El sol sale por el este.","en":"The sun rises in the east."},{"tag":"west","es":"La costa oeste es más lluviosa.","en":"The west coast is rainier."}]},{"es":"el centro","pos":"n.m.","en":"centre; town centre, downtown","ex":[{"tag":"centre","es":"Ponlo en el centro de la mesa.","en":"Put it in the centre of the table."},{"tag":"downtown","es":"Trabajo en el centro.","en":"I work downtown."}]},{"es":"el lado","pos":"n.m.","en":"side","note":"al lado de is next to — see plate 2. por un lado ... por otro lado is on the one hand ... on the other.","ex":[{"es":"Siéntate a mi lado.","en":"Sit next to me."}]},{"es":"el lugar · el sitio","pos":"n.m.","en":"place, spot","note":"en lugar de means instead of; tener lugar to take place.","ex":[{"es":"Es mi lugar favorito de la ciudad.","en":"It's my favourite place in the city."}]},{"es":"el rincón · la esquina","pos":"n.","en":"corner (inside); corner (of streets)","he":"פינה פנימית / פינת רחוב","note":"A room has rincones; streets meet at an esquina.","ex":[{"tag":"inside corner","es":"La planta está en el rincón.","en":"The plant is in the corner."},{"tag":"street corner","es":"Te espero en la esquina.","en":"I'll wait for you on the corner."}]},{"es":"el borde · la orilla","pos":"n.","en":"edge; bank, shore","note":"Used of rivers and the sea. el borde is any edge.","ex":[{"tag":"edge","es":"No te pares en el borde.","en":"Don't stand on the edge."},{"tag":"bank","es":"Caminamos por la orilla del río.","en":"We walked along the river bank."}]},{"es":"alrededor","pos":"adv.","en":"around, round about","note":"alrededor de before a noun, and also used for approximately: alrededor de veinte.","ex":[{"es":"Miró alrededor pero no vio nada.","en":"He looked around but saw nothing."}]},{"es":"en medio de","pos":"prep.","en":"in the middle of","note":"For an interruption Spanish also says en pleno: en plena reunión.","ex":[{"es":"Se paró en medio de la calle.","en":"He stopped in the middle of the street."}]},{"es":"enfrente · frente a","pos":"adv. / prep.","en":"opposite, facing","note":"Distinct from delante de, which is simply in front of. enfrente implies facing across a gap.","ex":[{"es":"La farmacia está enfrente del banco.","en":"The pharmacy is opposite the bank."}]},{"es":"hacia","pos":"prep.","en":"towards; around (a time)","he":"לכיוון / בסביבות","ex":[{"tag":"towards","es":"Caminó hacia la puerta.","en":"He walked towards the door."},{"tag":"around a time","es":"Llegaron hacia las diez.","en":"They arrived around ten."}]},{"es":"dondequiera · por todas partes","pos":"adv.","en":"anywhere; everywhere","note":"en ninguna parte is nowhere, and needs no before the verb.","ex":[{"tag":"anywhere","es":"Puedes sentarte dondequiera.","en":"You can sit anywhere."},{"tag":"everywhere","es":"Hay basura por todas partes.","en":"There's rubbish everywhere."}]}]},{"id":"u37","title":"Documents, rules and officialdom","intro":"The vocabulary of forms, offices and queues. Two false friends worth noting: la carpeta is a folder, not a carpet, and asistir means to attend, not to assist.","entries":[{"es":"el documento","pos":"n.m.","en":"document","note":"los documentos loosely means your papers or ID.","ex":[{"es":"Traiga todos los documentos originales.","en":"Bring all the original documents."}]},{"es":"el pasaporte","pos":"n.m.","en":"passport","note":"la visa or el visado is the visa; la credencial or el carnet an ID card.","ex":[{"es":"Mi pasaporte vence en marzo.","en":"My passport expires in March."}]},{"es":"la firma","pos":"n.f.","en":"signature; firm, company","he":"חתימה / חברה","note":"firmar is to sign. The company sense is formal and less common than la empresa.","ex":[{"tag":"signature","es":"Falta su firma aquí.","en":"Your signature is missing here."},{"tag":"firm","es":"Trabaja en una firma de abogados.","en":"She works at a law firm."}]},{"es":"el formulario","pos":"n.m.","en":"form","note":"llenar un formulario is to fill in a form; rellenar in Spain.","ex":[{"es":"Llene el formulario con letra clara.","en":"Fill in the form in clear writing."}]},{"es":"la carpeta","pos":"n.f.","en":"folder, file","warn":"Not a carpet. A carpet is la alfombra. Also the computer folder.","ex":[{"es":"Los papeles están en la carpeta azul.","en":"The papers are in the blue folder."}]},{"es":"la ley","pos":"n.f.","en":"law","note":"Plural leyes. legal and ilegal as expected; la regla is a rule.","ex":[{"es":"La ley cambió el año pasado.","en":"The law changed last year."}]},{"es":"la regla","pos":"n.f.","en":"rule; ruler","he":"כלל / סרגל","ex":[{"tag":"rule","es":"Hay que respetar las reglas.","en":"The rules have to be respected."},{"tag":"ruler","es":"Necesito una regla para la línea.","en":"I need a ruler for the line."}]},{"es":"el permiso","pos":"n.m.","en":"permission; permit, licence","he":"רשות / אישור","note":"con permiso is the everyday excuse me — see unit 5.","ex":[{"tag":"permission","es":"Pidió permiso para salir temprano.","en":"He asked permission to leave early."},{"tag":"permit","es":"Necesitas permiso de conducir.","en":"You need a driving licence."}]},{"es":"prohibido","pos":"adj.","en":"forbidden, prohibited","note":"The word on every sign: prohibido fumar, prohibido el paso.","ex":[{"es":"Está prohibido estacionar aquí.","en":"Parking is forbidden here."}]},{"es":"permitir","pos":"v.","en":"to allow, to permit","note":"dejar is the everyday alternative — see unit 28.","ex":[{"es":"No permiten mascotas en el edificio.","en":"They don't allow pets in the building."}]},{"es":"asistir","pos":"v.","en":"to attend, to be present","warn":"A false friend. To assist someone is ayudar or atender. asistir a una reunión is to attend a meeting.","ex":[{"es":"Asistieron más de cien personas.","en":"More than a hundred people attended."}]},{"es":"la oficina de correos","pos":"n.f.","en":"post office","note":"el sello or la estampilla is a stamp; el sobre an envelope.","ex":[{"es":"La oficina de correos cierra a la una.","en":"The post office closes at one."}]},{"es":"la dirección","pos":"n.f.","en":"address; direction; management","he":"כתובת / כיוון / הנהלה","ex":[{"tag":"address","es":"Escríbeme la dirección.","en":"Write the address down for me."},{"tag":"direction","es":"Vamos en dirección contraria.","en":"We're going in the wrong direction."},{"tag":"management","es":"La dirección tomó la decisión.","en":"Management took the decision."}]},{"es":"el trámite","pos":"n.m.","en":"formality, piece of paperwork","he":"הליך בירוקרטי","note":"hacer un trámite is to deal with a piece of bureaucracy. A word you will need constantly.","ex":[{"es":"El trámite tarda tres semanas.","en":"The paperwork takes three weeks."}]},{"es":"la fila","pos":"n.f.","en":"queue, line; row","he":"תור / שורה","note":"hacer fila is to queue, alongside hacer cola — see unit 21.","ex":[{"tag":"queue","es":"Había una fila larguísima.","en":"There was a very long queue."},{"tag":"row","es":"Nos sentamos en la primera fila.","en":"We sat in the front row."}]},{"es":"el gobierno","pos":"n.m.","en":"government","note":"gobernar is to govern; el presidente the president.","ex":[{"es":"El gobierno anunció el cambio.","en":"The government announced the change."}]},{"es":"el impuesto","pos":"n.m.","en":"tax","note":"el IVA is VAT; pagar impuestos to pay tax.","ex":[{"es":"El precio ya incluye impuestos.","en":"The price already includes tax."}]},{"es":"la multa","pos":"n.f.","en":"fine, penalty","note":"poner una multa is to issue a fine.","ex":[{"es":"Me pusieron una multa por estacionar.","en":"I got a parking fine."}]},{"es":"el juez · el tribunal","pos":"n.m.","en":"judge; court","note":"Plural jueces. el abogado is the lawyer — see unit 17.","ex":[{"tag":"judge","es":"El juez dictó la sentencia.","en":"The judge delivered the verdict."},{"tag":"court","es":"El caso llegó al tribunal.","en":"The case reached the court."}]},{"es":"el derecho · el deber","pos":"n.m.","en":"a right; a duty","note":"See unit 36 for derecho meaning straight ahead, and unit 1 for deber as a verb.","ex":[{"tag":"right","es":"Es tu derecho negarte.","en":"It's your right to refuse."},{"tag":"duty","es":"Cumplió con su deber.","en":"He did his duty."}]}]},{"id":"u38","title":"Fruit, vegetables and the market","intro":"Names vary by country more here than almost anywhere else — the same fruit can be el plátano, la banana or el banano. The Mexican and widely-understood term is given first, with alternatives in the notes.","entries":[{"es":"la manzana","pos":"n.f.","en":"apple; block (of houses, in Spain)","he":"תפוח","ex":[{"tag":"apple","es":"Me como una manzana al día.","en":"I eat an apple a day."},{"tag":"block","es":"Está a dos manzanas de aquí.","en":"It's two blocks from here."}]},{"es":"el plátano","pos":"n.m.","en":"banana","note":"la banana in Argentina and Uruguay, el banano in Colombia. In Spain el plátano; a cooking plantain is el plátano macho.","ex":[{"es":"Los plátanos ya están maduros.","en":"The bananas are ripe now."}]},{"es":"la naranja · el limón","pos":"n.","en":"orange; lemon","note":"In Mexico el limón usually means a lime, and a lemon is el limón amarillo.","ex":[{"tag":"orange","es":"Exprimí tres naranjas.","en":"I squeezed three oranges."},{"tag":"lemon","es":"Ponle limón al pescado.","en":"Put lemon on the fish."}]},{"es":"la uva · la fresa","pos":"n.f.","en":"grape; strawberry","note":"In Spain and Mexico la fresa; in the Southern Cone la frutilla.","ex":[{"tag":"grape","es":"Compramos un kilo de uvas.","en":"We bought a kilo of grapes."},{"tag":"strawberry","es":"Las fresas están carísimas.","en":"Strawberries are very expensive."}]},{"es":"la piña · el mango","pos":"n.","en":"pineapple; mango","note":"In Argentina el ananá for pineapple.","ex":[{"tag":"pineapple","es":"Corta la piña en trozos.","en":"Cut the pineapple into pieces."},{"tag":"mango","es":"El mango está en su mejor época.","en":"Mango is at its best right now."}]},{"es":"el aguacate","pos":"n.m.","en":"avocado","note":"la palta in Peru, Chile, Argentina and Bolivia. A genuine divide.","ex":[{"es":"El aguacate se pone negro rápido.","en":"Avocado goes black quickly."}]},{"es":"el tomate","pos":"n.m.","en":"tomato","note":"el jitomate in central Mexico, where el tomate means a green tomatillo.","ex":[{"es":"La ensalada lleva tomate y cebolla.","en":"The salad has tomato and onion in it."}]},{"es":"la cebolla · el ajo","pos":"n.","en":"onion; garlic","note":"un diente de ajo is a clove of garlic — literally a tooth.","ex":[{"tag":"onion","es":"Pica la cebolla bien fina.","en":"Chop the onion very finely."},{"tag":"garlic","es":"Añade dos dientes de ajo.","en":"Add two cloves of garlic."}]},{"es":"la papa","pos":"n.f.","en":"potato","note":"la papa across Latin America, la patata in Spain. Chips or fries are las papas fritas.","ex":[{"es":"Hierve las papas veinte minutos.","en":"Boil the potatoes for twenty minutes."}]},{"es":"la zanahoria · la lechuga","pos":"n.f.","en":"carrot; lettuce","ex":[{"tag":"carrot","es":"Ralla una zanahoria para la ensalada.","en":"Grate a carrot for the salad."},{"tag":"lettuce","es":"La lechuga está marchita.","en":"The lettuce has wilted."}]},{"es":"el maíz","pos":"n.m.","en":"maize, corn","note":"Masculine, despite some lists getting this wrong. el elote is a corn cob in Mexico, el choclo further south.","ex":[{"es":"Las tortillas son de maíz.","en":"The tortillas are made of maize."}]},{"es":"el chile","pos":"n.m.","en":"chilli pepper","note":"el ají in the Andes and the Southern Cone, el pimiento for a sweet pepper in Spain.","ex":[{"es":"Ese chile es muy picante.","en":"That chilli is very hot."}]},{"es":"la sopa · la ensalada","pos":"n.f.","en":"soup; salad","ex":[{"tag":"soup","es":"La sopa está fría.","en":"The soup is cold."},{"tag":"salad","es":"De entrada pedí una ensalada.","en":"For a starter I ordered a salad."}]},{"es":"el aceite","pos":"n.m.","en":"oil (cooking)","note":"el petróleo is crude oil. el vinagre is vinegar.","ex":[{"es":"Usa aceite de oliva.","en":"Use olive oil."}]},{"es":"la harina","pos":"n.f.","en":"flour","note":"la masa is dough; hornear is to bake.","ex":[{"es":"Falta harina para el pan.","en":"There isn't enough flour for the bread."}]},{"es":"maduro · fresco","pos":"adj.","en":"ripe, mature; fresh, cool","he":"בשל / טרי","ex":[{"tag":"ripe","es":"Espera a que esté maduro.","en":"Wait until it's ripe."},{"tag":"fresh","es":"El pescado es fresquísimo.","en":"The fish is extremely fresh."}]},{"es":"cocer · hervir","pos":"v. irr.","en":"to cook (in liquid); to boil","note":"cocinar is the general to cook — see unit 12. freír is to fry, asar to roast, hornear to bake.","ex":[{"tag":"cook","es":"Cuece el arroz a fuego lento.","en":"Cook the rice on a low heat."},{"tag":"boil","es":"Hierve el agua primero.","en":"Boil the water first."}]},{"es":"picar","pos":"v.","en":"to chop; to sting, to bite; to be spicy","he":"לקצוץ / לעקוץ / לצרוב","ex":[{"tag":"chop","es":"Pica el ajo muy fino.","en":"Chop the garlic very finely."},{"tag":"sting","es":"Me picó un mosquito.","en":"A mosquito bit me."},{"tag":"be spicy","es":"Esta salsa pica mucho.","en":"This sauce is very hot."}]},{"es":"mezclar · añadir","pos":"v.","en":"to mix; to add","note":"agregar is the everyday alternative to añadir in Latin America.","ex":[{"tag":"mix","es":"Mezcla bien los ingredientes.","en":"Mix the ingredients well."},{"tag":"add","es":"Añade la sal al final.","en":"Add the salt at the end."}]},{"es":"la olla · la sartén","pos":"n.","en":"pot, pan; frying pan","note":"la sartén is feminine in most of the Spanish-speaking world, masculine in parts of Latin America.","ex":[{"tag":"pot","es":"Pon la olla en la estufa.","en":"Put the pot on the stove."},{"tag":"frying pan","es":"Calienta la sartén primero.","en":"Heat the frying pan first."}]}]},{"id":"u39","title":"Abstract nouns you will meet everywhere","intro":"These are the words that fill newspapers and conversations about anything serious. Several are masculine despite ending in -a, because they come from Greek: el tema, el sistema, el programa, el problema.","entries":[{"es":"el tema","pos":"n.m.","en":"subject, topic, theme","note":"Masculine. cambiar de tema is to change the subject.","ex":[{"es":"Volvamos al tema principal.","en":"Let's get back to the main point."}]},{"es":"el sistema","pos":"n.m.","en":"system","note":"Masculine, like all the Greek -ma nouns.","ex":[{"es":"El sistema no funciona bien.","en":"The system doesn't work properly."}]},{"es":"el caso","pos":"n.m.","en":"case, instance","note":"en todo caso means in any case; hacer caso a means to pay attention to.","ex":[{"es":"En ese caso, mejor esperamos.","en":"In that case, we'd better wait."}]},{"es":"el hecho","pos":"n.m.","en":"fact; deed","he":"עובדה / מעשה","note":"de hecho means in fact. Also the past participle of hacer, done or made.","ex":[{"tag":"fact","es":"El hecho es que no llamó.","en":"The fact is he didn't call."},{"tag":"deed","es":"Lo juzgan por sus hechos.","en":"They judge him by his deeds."}]},{"es":"el estado","pos":"n.m.","en":"state, condition; the State","he":"מצב / מדינה","ex":[{"tag":"condition","es":"El carro está en buen estado.","en":"The car is in good condition."},{"tag":"the State","es":"Es una escuela del estado.","en":"It's a state school."}]},{"es":"la situación","pos":"n.f.","en":"situation","ex":[{"es":"La situación cambió por completo.","en":"The situation changed completely."}]},{"es":"la vida","pos":"n.f.","en":"life","note":"en mi vida means never in my life; toda la vida always, forever.","ex":[{"es":"Nunca en mi vida había visto eso.","en":"I'd never seen that in my life."}]},{"es":"la muerte","pos":"n.f.","en":"death","note":"muerto is dead, and also the past participle of morir.","ex":[{"es":"Su muerte nos sorprendió a todos.","en":"His death surprised us all."}]},{"es":"la fuerza","pos":"n.f.","en":"strength, force","note":"a la fuerza means by force or of necessity.","ex":[{"es":"No tengo fuerza para levantarlo.","en":"I haven't the strength to lift it."}]},{"es":"el poder","pos":"n.m.","en":"power","note":"Same word as the verb poder, to be able — see unit 1.","ex":[{"es":"El poder corrompe.","en":"Power corrupts."}]},{"es":"la libertad","pos":"n.f.","en":"freedom, liberty","note":"libre is free in the sense of unconstrained; gratis is free of charge.","ex":[{"es":"Luchaban por su libertad.","en":"They were fighting for their freedom."}]},{"es":"la paz · la guerra","pos":"n.f.","en":"peace; war","note":"Plural paces. hacer las paces is to make up after a quarrel.","ex":[{"tag":"peace","es":"Firmaron la paz en 1996.","en":"They signed the peace in 1996."},{"tag":"war","es":"La guerra duró diez años.","en":"The war lasted ten years."}]},{"es":"la sociedad","pos":"n.f.","en":"society; company (business)","ex":[{"tag":"society","es":"La sociedad ha cambiado mucho.","en":"Society has changed a lot."},{"tag":"company","es":"Fundaron una sociedad en 1990.","en":"They founded a company in 1990."}]},{"es":"el pueblo","pos":"n.m.","en":"the people; village","note":"See unit 8. In political contexts the first sense dominates.","ex":[{"tag":"the people","es":"El pueblo decidió en las urnas.","en":"The people decided at the ballot box."},{"tag":"village","es":"Nació en un pueblo del sur.","en":"He was born in a village in the south."}]},{"es":"el resultado","pos":"n.m.","en":"result, outcome","note":"como resultado de means as a result of.","ex":[{"es":"El resultado fue mejor de lo esperado.","en":"The result was better than expected."}]},{"es":"la causa","pos":"n.f.","en":"cause, reason","note":"a causa de means because of — a tidier alternative to porque before a noun.","ex":[{"es":"Se canceló a causa de la lluvia.","en":"It was cancelled because of the rain."}]},{"es":"el efecto","pos":"n.m.","en":"effect","note":"en efecto means indeed; el efecto secundario a side effect.","ex":[{"es":"La medicina tuvo efecto enseguida.","en":"The medicine took effect straight away."}]},{"es":"la oportunidad","pos":"n.f.","en":"opportunity, chance","note":"la ocasión is an occasion, and in shops a bargain.","ex":[{"es":"Es una oportunidad que no se repite.","en":"It's a chance that won't come again."}]},{"es":"la diferencia","pos":"n.f.","en":"difference","note":"a diferencia de means unlike; dar igual means to make no difference.","ex":[{"es":"No veo la diferencia.","en":"I can't see the difference."}]},{"es":"la relación","pos":"n.f.","en":"relationship; connection","note":"con relación a means with regard to.","ex":[{"tag":"relationship","es":"Tienen una buena relación.","en":"They have a good relationship."},{"tag":"connection","es":"No hay relación entre los dos casos.","en":"There's no connection between the two cases."}]}]},{"id":"u40","title":"More high-frequency verbs","intro":"A gathering of verbs that are too common to leave out but belong to no single theme. Several are irregular only in the yo form, which is the easiest kind of irregularity to learn.","entries":[{"es":"necesitar","pos":"v.","en":"to need","note":"hacer falta is the alternative, built like gustar: me hace falta tiempo.","ex":[{"es":"Necesito hablar contigo.","en":"I need to talk to you."}]},{"es":"usar · utilizar","pos":"v.","en":"to use","note":"See unit 28. utilizar is the more formal of the two.","ex":[{"es":"Utilizamos este método desde hace años.","en":"We've used this method for years."}]},{"es":"cambiar","pos":"v.","en":"to change; to exchange","he":"לשנות / להחליף","ex":[{"tag":"change","es":"Cambió de trabajo en marzo.","en":"He changed jobs in March."},{"tag":"exchange","es":"¿Puedo cambiar esta camisa?","en":"Can I exchange this shirt?"}]},{"es":"pasar","pos":"v.","en":"to pass, to go by; to happen; to spend (time)","he":"לעבור / לקרות","note":"¿Qué pasa? is what's happening. pasarlo bien is to have a good time.","ex":[{"tag":"pass","es":"Pasamos por tu casa camino al centro.","en":"We went past your house on the way into town."},{"tag":"happen","es":"¿Qué pasó anoche?","en":"What happened last night?"},{"tag":"spend time","es":"Pasé el verano en el campo.","en":"I spent the summer in the countryside."}]},{"es":"quedarse","pos":"v.","en":"to stay, to remain","note":"See unit 1 for quedar without the reflexive.","ex":[{"es":"Me quedo una noche más.","en":"I'm staying one more night."}]},{"es":"vivir · morir","pos":"v. irr.","en":"to live; to die","note":"See unit 2 and unit 10. Paired here because they are the two commonest verbs in any obituary or biography.","ex":[{"tag":"live","es":"Vivió noventa años.","en":"She lived ninety years."},{"tag":"die","es":"Murió en su pueblo.","en":"He died in his village."}]},{"es":"creer · pensar","pos":"v.","en":"to believe; to think","note":"See unit 2. creo que and pienso que are interchangeable in most sentences.","ex":[{"tag":"believe","es":"No creo lo que dice.","en":"I don't believe what he says."},{"tag":"think","es":"Pienso que deberías ir.","en":"I think you should go."}]},{"es":"salir · entrar","pos":"v. irr.","en":"to go out; to go in","note":"See unit 22. Printed on every door: salida and entrada.","ex":[{"tag":"go out","es":"Salgo del trabajo a las seis.","en":"I leave work at six."},{"tag":"go in","es":"Entró sin llamar.","en":"He came in without knocking."}]},{"es":"esperar · empezar","pos":"v. irr.","en":"to wait; to begin","note":"See unit 2 for the three meanings of esperar.","ex":[{"tag":"wait","es":"Esperemos cinco minutos más.","en":"Let's wait five more minutes."},{"tag":"begin","es":"Empezamos a las nueve en punto.","en":"We begin at nine sharp."}]},{"es":"acabar","pos":"v.","en":"to finish; to have just done","he":"לגמור / בדיוק עשה","note":"acabar de + infinitive means to have just done something: acabo de llegar, I've just arrived. Extremely common and has no single-word English equivalent.","ex":[{"tag":"finish","es":"Acabamos el trabajo ayer.","en":"We finished the work yesterday."},{"tag":"have just","es":"Acabo de hablar con ella.","en":"I've just spoken to her."}]},{"es":"convertirse · volverse","pos":"v. irr.","en":"to become","note":"Spanish has several becomes: hacerse for a chosen change, ponerse for a passing state, volverse for a lasting one, convertirse en for a transformation.","ex":[{"es":"Se convirtió en el mejor del equipo.","en":"He became the best in the team."}]},{"es":"evitar","pos":"v.","en":"to avoid; to prevent","he":"להימנע / למנוע","ex":[{"tag":"avoid","es":"Evita la avenida a esta hora.","en":"Avoid the avenue at this time."},{"tag":"prevent","es":"No pudimos evitar el accidente.","en":"We couldn't prevent the accident."}]},{"es":"aceptar · negar","pos":"v. irr.","en":"to accept; to deny, to refuse","note":"negarse a is to refuse to do something.","ex":[{"tag":"accept","es":"Aceptó la oferta enseguida.","en":"She accepted the offer straight away."},{"tag":"deny","es":"Negó todo lo que dijeron.","en":"He denied everything they said."}]},{"es":"mostrar","pos":"v. irr.","en":"to show","note":"enseñar does the same job in speech — see unit 24.","conj":{"label":"pres.","forms":["muestro","muestras","muestra","mostramos","muestran"]},"ex":[{"es":"Muéstrame cómo se hace.","en":"Show me how it's done."}]},{"es":"elegir · escoger","pos":"v. irr.","en":"to choose; to elect","he":"לבחור","conj":{"label":"elegir, pres.","forms":["elijo","eliges","elige","elegimos","eligen"]},"ex":[{"tag":"choose","es":"Escoge el que más te guste.","en":"Choose the one you like best."},{"tag":"elect","es":"Lo eligieron presidente.","en":"They elected him president."}]},{"es":"ocurrir · suceder","pos":"v.","en":"to happen, to occur","note":"se me ocurrió means it occurred to me — an idea rather than an event.","ex":[{"es":"Nadie sabe qué ocurrió.","en":"Nobody knows what happened."}]},{"es":"resolver","pos":"v. irr.","en":"to solve, to resolve","note":"Irregular past participle: resuelto.","conj":{"label":"pres.","forms":["resuelvo","resuelves","resuelve","resolvemos","resuelven"]},"ex":[{"es":"Ya resolvimos el problema.","en":"We've already solved the problem."}]},{"es":"faltar","pos":"v.","en":"to be missing, to be lacking; to be left","he":"לחסר / להישאר","note":"Built like gustar. falta sal means it needs salt; faltan dos días, there are two days to go.","ex":[{"tag":"be missing","es":"Falta una silla.","en":"There's a chair missing."},{"tag":"be left","es":"Faltan diez minutos.","en":"There are ten minutes to go."}]},{"es":"sobrar","pos":"v.","en":"to be left over, to be more than enough","note":"The opposite of faltar. las sobras are leftovers.","ex":[{"es":"Sobró mucha comida.","en":"There was a lot of food left over."}]},{"es":"valer","pos":"v. irr.","en":"to be worth; to cost","he":"להיות שווה","note":"vale la pena means it's worth it. In Spain ¡vale! means OK.","conj":{"label":"pres.","forms":["valgo","vales","vale","valemos","valen"]},"ex":[{"tag":"be worth","es":"No vale la pena discutir.","en":"It isn't worth arguing."},{"tag":"cost","es":"¿Cuánto vale este libro?","en":"How much is this book?"}]}]},{"id":"u41","title":"Buildings and getting things done in town","intro":"Places you need and the words for dealing with them. See unit 8 for the street layout itself.","entries":[{"es":"el edificio","pos":"n.m.","en":"building","note":"el piso or el departamento is a flat; el apartamento too.","ex":[{"es":"El edificio tiene diez pisos.","en":"The building has ten floors."}]},{"es":"el departamento","pos":"n.m.","en":"flat, apartment; department","he":"דירה / מחלקה","note":"el apartamento and el piso (Spain) mean the same thing.","ex":[{"tag":"flat","es":"Rentamos un departamento pequeño.","en":"We rent a small flat."},{"tag":"department","es":"Trabaja en el departamento de ventas.","en":"He works in the sales department."}]},{"es":"el vecindario · el barrio","pos":"n.m.","en":"neighbourhood, district","note":"la colonia in Mexico. el vecino is the neighbour — see unit 3.","ex":[{"es":"Es un barrio tranquilo y seguro.","en":"It's a quiet, safe neighbourhood."}]},{"es":"la puerta · la entrada","pos":"n.f.","en":"door; entrance","note":"la salida is the exit, printed on every sign.","ex":[{"tag":"door","es":"Llama a la puerta antes de entrar.","en":"Knock on the door before going in."},{"tag":"entrance","es":"La entrada es por el otro lado.","en":"The entrance is on the other side."}]},{"es":"el ascensor","pos":"n.m.","en":"lift, elevator","note":"el elevador in Mexico. la escalera is the stairs — see unit 19.","ex":[{"es":"El ascensor está fuera de servicio.","en":"The lift is out of order."}]},{"es":"el techo · el suelo","pos":"n.m.","en":"ceiling, roof; floor, ground","he":"תקרה / רצפה","ex":[{"tag":"ceiling","es":"El techo tiene una mancha de humedad.","en":"The ceiling has a damp patch."},{"tag":"floor","es":"Se cayó al suelo.","en":"It fell to the floor."}]},{"es":"rentar · alquilar","pos":"v.","en":"to rent","note":"rentar in Mexico, alquilar in Spain and much of South America. la renta or el alquiler is the rent.","ex":[{"es":"Alquilamos un carro por tres días.","en":"We rented a car for three days."}]},{"es":"el hotel · la habitación","pos":"n.","en":"hotel; room","note":"el cuarto also means a room; la habitación is the hotel word.","ex":[{"tag":"hotel","es":"El hotel está lleno esta semana.","en":"The hotel is full this week."},{"tag":"room","es":"Reservé una habitación doble.","en":"I booked a double room."}]},{"es":"reservar","pos":"v.","en":"to book, to reserve","note":"la reserva or la reservación is the booking.","ex":[{"es":"¿Reservaste mesa?","en":"Did you book a table?"}]},{"es":"abierto · cerrado","pos":"adj.","en":"open; closed","note":"The two words on every shop door, and the past participles of abrir and cerrar.","ex":[{"tag":"open","es":"¿Está abierto los domingos?","en":"Is it open on Sundays?"},{"tag":"closed","es":"Estuvo cerrado todo agosto.","en":"It was closed all August."}]},{"es":"el semáforo","pos":"n.m.","en":"traffic light","note":"A common landmark in directions: en el semáforo, gira a la derecha.","ex":[{"es":"Para en el semáforo.","en":"Stop at the traffic light."}]},{"es":"el puente","pos":"n.m.","en":"bridge; long weekend","he":"גשר","note":"hacer puente is to take the bridging day off between a holiday and the weekend.","ex":[{"tag":"bridge","es":"Cruzamos el puente a pie.","en":"We crossed the bridge on foot."},{"tag":"long weekend","es":"El lunes hay puente.","en":"Monday is part of a long weekend."}]},{"es":"el tráfico · el tránsito","pos":"n.m.","en":"traffic","note":"el tránsito is preferred in much of South America. el atasco or el trancón is a traffic jam.","ex":[{"es":"Llegué tarde por el tráfico.","en":"I was late because of the traffic."}]},{"es":"estacionar · aparcar","pos":"v.","en":"to park","note":"estacionar in Latin America, aparcar in Spain. el estacionamiento is the car park.","ex":[{"es":"No se puede estacionar aquí.","en":"You can't park here."}]},{"es":"la gasolina","pos":"n.f.","en":"petrol, gasoline","note":"la gasolinera is the petrol station; la nafta in Argentina.","ex":[{"es":"Hay que echar gasolina.","en":"We need to get petrol."}]},{"es":"la esquina · la cuadra","pos":"n.f.","en":"corner; block","note":"See unit 8. Together they make up almost all spoken directions.","ex":[{"tag":"corner","es":"Dobla en la próxima esquina.","en":"Turn at the next corner."},{"tag":"block","es":"Camina dos cuadras derecho.","en":"Walk two blocks straight ahead."}]},{"es":"el letrero · el cartel","pos":"n.m.","en":"sign, notice; poster","ex":[{"tag":"sign","es":"El letrero dice cerrado.","en":"The sign says closed."},{"tag":"poster","es":"Pegaron carteles por toda la calle.","en":"They put posters up all along the street."}]},{"es":"el basurero","pos":"n.m.","en":"bin; rubbish collector","note":"See unit 19 for la basura itself.","ex":[{"tag":"bin","es":"Tíralo en el basurero.","en":"Throw it in the bin."},{"tag":"collector","es":"El basurero pasa los martes.","en":"The bin man comes on Tuesdays."}]},{"es":"el ruido · el silencio","pos":"n.m.","en":"noise; silence","note":"See unit 23. Paired here because they are what you notice most about a neighbourhood.","ex":[{"tag":"noise","es":"No soporto el ruido de la calle.","en":"I can't stand the street noise."},{"tag":"silence","es":"Se hizo un silencio incómodo.","en":"An awkward silence fell."}]},{"es":"seguro · peligroso","pos":"adj.","en":"safe; dangerous","note":"See unit 34 for el seguro, insurance.","ex":[{"tag":"safe","es":"Es una zona segura de noche.","en":"It's a safe area at night."},{"tag":"dangerous","es":"Ese cruce es peligroso.","en":"That crossing is dangerous."}]}]},{"id":"u42","title":"Friends and social life","intro":"How Spanish handles invitations, arrangements and company. Note quedar for making plans (unit 1) and invitar, which in Latin America usually means to pay as well as to invite.","entries":[{"es":"el amigo / la amiga","pos":"n.","en":"friend","note":"See unit 3. el conocido is an acquaintance; el compañero a colleague or classmate.","ex":[{"es":"Salí con unos amigos del trabajo.","en":"I went out with some friends from work."}]},{"es":"invitar","pos":"v.","en":"to invite; to treat, to pay for","he":"להזמין / לשלם עבור","note":"Yo invito means my treat. Saying te invito un café offers to buy it.","ex":[{"tag":"invite","es":"Nos invitaron a su boda.","en":"They invited us to their wedding."},{"tag":"treat","es":"Hoy invito yo.","en":"It's my treat today."}]},{"es":"la invitación","pos":"n.f.","en":"invitation","ex":[{"es":"Gracias por la invitación.","en":"Thank you for the invitation."}]},{"es":"el plan","pos":"n.m.","en":"plan","note":"¿Tienes planes? asks about your plans. hacer planes is to make plans.","ex":[{"es":"¿Qué planes tienes para el sábado?","en":"What are your plans for Saturday?"}]},{"es":"acompañar","pos":"v.","en":"to go with, to accompany","note":"¿Te acompaño? offers to come with you.","ex":[{"es":"Te acompaño a la estación.","en":"I'll walk you to the station."}]},{"es":"conocer a alguien","pos":"phrase","en":"to meet someone, to get to know someone","note":"See unit 1. The past conocí means I met, for the first time.","ex":[{"es":"La conocí en una fiesta.","en":"I met her at a party."}]},{"es":"presentar","pos":"v.","en":"to introduce; to present","he":"להציג","note":"te presento a Ana is how you introduce someone.","ex":[{"tag":"introduce","es":"Te presento a mi hermana.","en":"Let me introduce you to my sister."},{"tag":"present","es":"Presentó su trabajo en la reunión.","en":"She presented her work at the meeting."}]},{"es":"saludar · despedirse","pos":"v. irr.","en":"to greet, to say hello; to say goodbye","note":"el saludo is a greeting; la despedida a farewell or leaving party.","ex":[{"tag":"greet","es":"Pasó sin saludar.","en":"He walked past without saying hello."},{"tag":"say goodbye","es":"Se despidió de todos.","en":"She said goodbye to everyone."}]},{"es":"el novio / la novia","pos":"n.","en":"boyfriend, girlfriend; groom, bride","he":"חבר / חברה / חתן / כלה","note":"los novios are the couple at a wedding. See unit 10 for la pareja.","ex":[{"tag":"partner","es":"Vino con su novia.","en":"He came with his girlfriend."},{"tag":"bride and groom","es":"Los novios llegaron tarde.","en":"The bride and groom arrived late."}]},{"es":"salir con","pos":"phrase","en":"to go out with, to date","note":"salir alone is simply to go out — see unit 22.","ex":[{"es":"Salen juntos desde marzo.","en":"They've been going out since March."}]},{"es":"discutir · pelear","pos":"v.","en":"to argue, to discuss; to fight, to quarrel","he":"להתווכח / לריב","note":"discutir leans towards arguing, not calm discussion. For that use hablar de or tratar.","ex":[{"tag":"argue","es":"Discutimos por una tontería.","en":"We argued over something silly."},{"tag":"quarrel","es":"Los niños pelean todo el día.","en":"The children fight all day."}]},{"es":"perdonar","pos":"v.","en":"to forgive, to excuse","note":"perdón is the noun and the apology — see unit 5.","ex":[{"es":"Nunca lo perdonó.","en":"She never forgave him."}]},{"es":"prometer","pos":"v.","en":"to promise","note":"la promesa is the promise.","ex":[{"es":"Me prometió que vendría.","en":"He promised me he'd come."}]},{"es":"avisar","pos":"v.","en":"to let know, to warn, to notify","he":"להודיע / להזהיר","note":"avísame means let me know. Extremely common and has no neat English single word.","ex":[{"es":"Avísame cuando llegues.","en":"Let me know when you arrive."}]},{"es":"la cena · la comida","pos":"n.f.","en":"dinner; lunch, meal","note":"See unit 7. Social life in the Spanish-speaking world is organised around both.","ex":[{"tag":"dinner","es":"Nos vemos en la cena.","en":"See you at dinner."},{"tag":"meal","es":"Fue una comida larguísima.","en":"It was a very long meal."}]},{"es":"brindar","pos":"v.","en":"to toast, to drink a toast","note":"brindar por is to drink to something. See salud in unit 5.","ex":[{"es":"Brindemos por los novios.","en":"Let's drink to the bride and groom."}]},{"es":"el vecino / la vecina","pos":"n.","en":"neighbour","note":"See unit 3. In small towns the vecinos are effectively an institution.","ex":[{"es":"Mis vecinos son muy amables.","en":"My neighbours are very kind."}]},{"es":"juntos · solo","pos":"adj.","en":"together; alone","he":"ביחד / לבד","note":"sólo with an accent used to mean only; the accent is now optional and usually dropped.","ex":[{"tag":"together","es":"Estudiamos juntos en la universidad.","en":"We studied together at university."},{"tag":"alone","es":"Prefiere trabajar solo.","en":"He prefers to work alone."}]},{"es":"el favor","pos":"n.m.","en":"favour","note":"hacer un favor is to do a favour; por favor is please — see unit 5.","ex":[{"es":"¿Me haces un favor?","en":"Would you do me a favour?"}]},{"es":"la confianza","pos":"n.f.","en":"trust, confidence; closeness","he":"אמון / קרבה","note":"tener confianza con alguien is to be close enough to speak freely.","ex":[{"tag":"trust","es":"Perdió la confianza en ellos.","en":"He lost his trust in them."},{"tag":"closeness","es":"Tenemos mucha confianza.","en":"We're very close."}]}]},{"id":"u43","title":"Judging and comparing","intro":"Adjectives and adverbs for saying how good, how bad and how much. Remember the four irregular comparatives that refuse más: mejor, peor, mayor, menor (see the opening section).","entries":[{"es":"bueno · malo","pos":"adj.","en":"good; bad","note":"Both shorten before a masculine singular noun: un buen día, un mal año.","ex":[{"tag":"good","es":"Es una buena idea.","en":"It's a good idea."},{"tag":"bad","es":"Fue un mal día para todos.","en":"It was a bad day for everyone."}]},{"es":"mejor · peor","pos":"adj. / adv.","en":"better, best; worse, worst","he":"יותר טוב / יותר גרוע","note":"Never más bueno or más malo in comparisons. With the article they become the superlative: el mejor.","ex":[{"tag":"better","es":"Este camino es mejor.","en":"This road is better."},{"tag"
